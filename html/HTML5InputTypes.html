<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Input Types</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HTML5 Input Types</h1>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Enter email" required>

        <label>Date</label>
        <input type="date">

        <label>Number</label>
        <input type="number" min="1" max="100">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <button type="submit">Submit</button>

    </form>

    <a href="index.html">Back to HTML Programs</a>

</div>

</body>
</html>
