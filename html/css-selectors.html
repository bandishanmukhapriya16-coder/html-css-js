<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #2c3e50;
        }

        .box {
            color: #2c3e50;
            background-color: #eaf5ff;
            font-size: 18px;
            margin: 20px;
            padding: 20px;
            border: 3px solid #3498db;
            border-radius: 10px;
        }

        #special {
            color: #8e44ad;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSS Styling Properties</h1>

    <div class="box">
        This box demonstrates colors, fonts, margins,
        padding and borders.
    </div>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <a href="index.html">Back to HTML Programs</a>
    <a class="back" href="../index.html">Back to Home</a>
    
</div>

</body>
</html>
