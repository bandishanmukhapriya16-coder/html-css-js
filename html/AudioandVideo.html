<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
        }

        audio, video {
            width: 100%;
            max-width: 650px;
            margin: 15px 0 30px;
        }

        h1 {
            color: #2c3e50;
        }

        h2 {
            color: #3498db;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HTML Audio and Video</h1>

    <h2>Audio</h2>

    <audio controls>
        <source src="../assets/audio/music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>Video</h2>

    <video controls>
        <source src="../assets/video/video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <br><br>

    <a href="index.html">Back to HTML Programs</a>
    
    <a href="../index.html">Home</a>
</div>

</body>
</html>
