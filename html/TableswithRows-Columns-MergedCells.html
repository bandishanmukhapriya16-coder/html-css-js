<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Marks Table</h1>

    <table>

        <tr>
            <th rowspan="2">Student</th>
            <th colspan="3">Marks</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
            <th>JavaScript</th>
        </tr>

        <tr>
            <td>Priya</td>
            <td>90</td>
            <td>85</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>82</td>
            <td>89</td>
            <td>91</td>
        </tr>

        <tr>
            <td colspan="4">
                Student Performance Report
            </td>
        </tr>

    </table>

    <a href="index.html">Back to HTML Programs</a>

</div>

</body>
</html>
