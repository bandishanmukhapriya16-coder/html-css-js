<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6fb;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #3498db;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            max-width: 900px;
            margin: 20px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        article {
            padding: 15px;
            background-color: #eef5ff;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My College Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<section>

    <h2>About Our College</h2>

    <article>
        <h3>Computer Science Department</h3>

        <p>
            The Computer Science department provides education
            in programming, artificial intelligence and data science.
        </p>
    </article>

</section>

<footer>
    <p>© 2026 College Website</p>
</footer>
<a class="back" href="../index.html">Back to Home</a>
        <a class="back" href="index.html">HTML Programs</a>

</body>
</html>
