<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
        }

        .box {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        #mouseBox {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffeaa7;
            border: 3px dashed #e84393;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
            transition: 0.3s;
        }

        #result {
            font-size: 20px;
            color: #0984e3;
            font-weight: bold;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🖱️ Mouse Events</h1>

        <div id="mouseBox">
            Move your mouse here!
        </div>

        <p id="result">Mouse event will appear here.</p>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const mouseBox = document.getElementById("mouseBox");
        const result = document.getElementById("result");

        // Mouse Over
        mouseBox.addEventListener("mouseover", function() {
            mouseBox.style.background = "#a29bfe";
            mouseBox.textContent = "Mouse is over the box!";
            result.textContent = "Event: mouseover";
        });

        // Mouse Out
        mouseBox.addEventListener("mouseout", function() {
            mouseBox.style.background = "#ffeaa7";
            mouseBox.textContent = "Move your mouse here!";
            result.textContent = "Event: mouseout";
        });

        // Mouse Down
        mouseBox.addEventListener("mousedown", function() {
            result.textContent = "Event: mousedown — Mouse button pressed!";
        });

        // Mouse Up
        mouseBox.addEventListener("mouseup", function() {
            result.textContent = "Event: mouseup — Mouse button released!";
        });

        // Mouse Move
        mouseBox.addEventListener("mousemove", function() {
            result.textContent = "Event: mousemove — Mouse is moving!";
        });
    </script>

</body>
</html>
