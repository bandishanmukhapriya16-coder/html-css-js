<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Controlled Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            text-align: center;
            padding: 30px 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        #gameArea {
            width: 100%;
            max-width: 600px;
            height: 350px;
            margin: 25px auto;
            background: #dfe6e9;
            border: 4px solid #6c5ce7;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 45px;
            height: 45px;
            background: #e84393;
            border-radius: 10px;
            position: absolute;
            left: 20px;
            top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
            color: #0984e3;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🎮 Keyboard-Controlled Game</h1>

        <p>Use the <b>Arrow Keys</b> to move the player.</p>

        <div id="gameArea">
            <div id="player">🚀</div>
        </div>

        <p id="result">
            Press an arrow key to start!
        </p>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const player = document.getElementById("player");
        const gameArea = document.getElementById("gameArea");
        const result = document.getElementById("result");

        let x = 20;
        let y = 20;

        const speed = 10;

        document.addEventListener("keydown", function(event) {

            const maxX = gameArea.clientWidth - player.offsetWidth;
            const maxY = gameArea.clientHeight - player.offsetHeight;

            if (event.key === "ArrowRight") {
                x += speed;
            }

            if (event.key === "ArrowLeft") {
                x -= speed;
            }

            if (event.key === "ArrowDown") {
                y += speed;
            }

            if (event.key === "ArrowUp") {
                y -= speed;
            }

            // Keep player inside the game area
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            player.style.left = x + "px";
            player.style.top = y + "px";

            result.textContent =
                "Player Position: X = " + x + ", Y = " + y;
        });
    </script>

</body>
</html>
