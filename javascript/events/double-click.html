<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Click Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        #clickBox {
            padding: 50px 20px;
            margin: 30px 0;
            background: #a29bfe;
            color: white;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #clickBox:hover {
            background: #e84393;
            transform: scale(1.03);
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            color: #00b894;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🖱️ Double-Click Event</h1>

        <div id="clickBox">
            Double-click me!
        </div>

        <p id="result">
            Waiting for double-click...
        </p>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const clickBox = document.getElementById("clickBox");
        const result = document.getElementById("result");

        clickBox.addEventListener("dblclick", function() {

            result.textContent =
                "🎉 Double-click detected successfully!";

            clickBox.style.background = "#00b894";
            clickBox.textContent = "Double-clicked! ✓";
        });
    </script>

</body>
</html>
