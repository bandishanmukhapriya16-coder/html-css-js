<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        #menu {
            list-style: none;
            padding: 0;
        }

        #menu li {
            background: #ffeaa7;
            margin: 12px;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        #menu li:hover {
            background: #e84393;
            color: white;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #dff9fb;
            color: #0984e3;
            border-radius: 10px;
            font-weight: bold;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🎯 Event Delegation</h1>

        <p>Click any item below:</p>

        <ul id="menu">
            <li data-name="HTML">HTML</li>
            <li data-name="CSS">CSS</li>
            <li data-name="JavaScript">JavaScript</li>
            <li data-name="Python">Python</li>
        </ul>

        <div id="result">
            No item selected.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const menu = document.getElementById("menu");
        const result = document.getElementById("result");

        // One event listener handles all list items
        menu.addEventListener("click", function(event) {

            if (event.target.tagName === "LI") {

                const selectedItem = event.target.dataset.name;

                result.textContent =
                    "You selected: " + selectedItem;
            }
        });
    </script>

</body>
</html>
