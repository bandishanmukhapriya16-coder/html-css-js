<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling and Capturing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        .outer {
            background: #74b9ff;
            padding: 40px;
            border-radius: 15px;
            cursor: pointer;
        }

        .inner {
            background: #ffeaa7;
            padding: 35px;
            border-radius: 15px;
            cursor: pointer;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #e84393;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #dff9fb;
            border-radius: 10px;
            color: #0984e3;
            font-weight: bold;
            min-height: 25px;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🔄 Event Bubbling & Capturing</h1>

        <div class="outer" id="outer">
            OUTER DIV

            <div class="inner" id="inner">
                INNER DIV
                <br><br>
                <button id="btn">Click Me</button>
            </div>
        </div>

        <div id="result">
            Click the button to see event order.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const outer = document.getElementById("outer");
        const inner = document.getElementById("inner");
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");

        // Capturing phase
        outer.addEventListener("click", function() {
            result.textContent =
                "Capturing: Outer DIV";
        }, true);

        inner.addEventListener("click", function() {
            result.textContent =
                "Capturing: Inner DIV";
        }, true);

        // Bubbling phase
        inner.addEventListener("click", function() {
            result.textContent =
                "Bubbling: Inner DIV";
        });

        outer.addEventListener("click", function() {
            result.textContent =
                "Bubbling: Outer DIV";
        });

        btn.addEventListener("click", function(event) {
            event.stopPropagation();

            result.textContent =
                "Button clicked! Event propagation stopped.";
        });
    </script>

</body>
</html>
