<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        .items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .item {
            width: 100px;
            padding: 20px 10px;
            background: #e84393;
            color: white;
            border-radius: 12px;
            cursor: grab;
            font-size: 18px;
            font-weight: bold;
        }

        .item:active {
            cursor: grabbing;
        }

        #dropArea {
            min-height: 150px;
            padding: 30px;
            border: 3px dashed #6c5ce7;
            border-radius: 15px;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #636e72;
        }

        #dropArea.dragover {
            background: #dff9fb;
            border-color: #00b894;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #00b894;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🖱️ Drag and Drop</h1>

        <p>Drag an item into the drop area.</p>

        <div class="items">

            <div class="item" draggable="true" id="item1">
                🍎 Apple
            </div>

            <div class="item" draggable="true" id="item2">
                🍌 Banana
            </div>

            <div class="item" draggable="true" id="item3">
                🍊 Orange
            </div>

        </div>

        <div id="dropArea">
            Drop item here
        </div>

        <p id="result">
            Waiting for an item...
        </p>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const items = document.querySelectorAll(".item");
        const dropArea = document.getElementById("dropArea");
        const result = document.getElementById("result");

        // Drag start
        items.forEach(function(item) {

            item.addEventListener("dragstart", function(event) {
                event.dataTransfer.setData("text", event.target.id);

                result.textContent =
                    "Dragging: " + event.target.textContent.trim();
            });

        });

        // Allow dropping
        dropArea.addEventListener("dragover", function(event) {
            event.preventDefault();

            dropArea.classList.add("dragover");
        });

        // Remove highlight
        dropArea.addEventListener("dragleave", function() {
            dropArea.classList.remove("dragover");
        });

        // Drop event
        dropArea.addEventListener("drop", function(event) {

            event.preventDefault();

            dropArea.classList.remove("dragover");

            const itemId = event.dataTransfer.getData("text");
            const draggedItem = document.getElementById(itemId);

            dropArea.appendChild(draggedItem);

            result.textContent =
                "✅ Item dropped successfully!";
        });
    </script>

</body>
</html>
