<!DOCTYPE html>
<html>
<head>
    <title>Clear All localStorage Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #c0392b;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #c0392b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #922b21;
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            background: #fadbd8;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #922b21;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #922b21;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🧹 Clear All Storage</h1>

        <p>
            Click the button to remove all data stored
            in localStorage for this website.
        </p>

        <button onclick="clearStorage()">
            Clear All Data
        </button>

        <div id="message">
            Data is currently stored in localStorage.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        function clearStorage() {

            localStorage.clear();

            document.getElementById("message").textContent =
                "✅ All localStorage data has been cleared!";
        }
    </script>

</body>
</html>
