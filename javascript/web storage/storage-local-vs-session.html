<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage vs SessionStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2471a3;
        }

        .storage-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .storage-box {
            width: 250px;
            padding: 20px;
            border-radius: 15px;
            background: #ebf5fb;
            border: 2px solid #3498db;
        }

        .storage-box h2 {
            color: #21618c;
        }

        input {
            padding: 10px;
            width: 85%;
            border: 2px solid #3498db;
            border-radius: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #21618c;
        }

        .output {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            font-weight: bold;
            min-height: 20px;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #21618c;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>💾 Storage Comparison</h1>

        <p>
            Compare <b>localStorage</b> and
            <b>sessionStorage</b>.
        </p>

        <div class="storage-container">

            <!-- localStorage -->
            <div class="storage-box">

                <h2>📦 localStorage</h2>

                <input
                    type="text"
                    id="localInput"
                    placeholder="Enter a value"
                >

                <br>

                <button onclick="saveLocal()">
                    Save
                </button>

                <button onclick="getLocal()">
                    Get
                </button>

                <button class="clear" onclick="clearLocal()">
                    Clear
                </button>

                <div id="localOutput" class="output">
                    No value
                </div>

            </div>


            <!-- sessionStorage -->
            <div class="storage-box">

                <h2>🕐 sessionStorage</h2>

                <input
                    type="text"
                    id="sessionInput"
                    placeholder="Enter a value"
                >

                <br>

                <button onclick="saveSession()">
                    Save
                </button>

                <button onclick="getSession()">
                    Get
                </button>

                <button class="clear" onclick="clearSession()">
                    Clear
                </button>

                <div id="sessionOutput" class="output">
                    No value
                </div>

            </div>

        </div>

    </div>


    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>


    <script>

        // =========================
        // localStorage
        // =========================

        function saveLocal() {

            const value =
                document.getElementById("localInput").value;

            localStorage.setItem(
                "localData",
                value
            );

            document.getElementById("localOutput").textContent =
                "Saved: " + value;
        }


        function getLocal() {

            const value =
                localStorage.getItem("localData");

            if (value !== null) {

                document.getElementById("localOutput").textContent =
                    "Stored value: " + value;

            } else {

                document.getElementById("localOutput").textContent =
                    "No value found.";
            }
        }


        function clearLocal() {

            localStorage.removeItem("localData");

            document.getElementById("localOutput").textContent =
                "localStorage cleared.";
        }


        // =========================
        // sessionStorage
        // =========================

        function saveSession() {

            const value =
                document.getElementById("sessionInput").value;

            sessionStorage.setItem(
                "sessionData",
                value
            );

            document.getElementById("sessionOutput").textContent =
                "Saved: " + value;
        }


        function getSession() {

            const value =
                sessionStorage.getItem("sessionData");

            if (value !== null) {

                document.getElementById("sessionOutput").textContent =
                    "Stored value: " + value;

            } else {

                document.getElementById("sessionOutput").textContent =
                    "No value found.";
            }
        }


        function clearSession() {

            sessionStorage.removeItem("sessionData");

            document.getElementById("sessionOutput").textContent =
                "sessionStorage cleared.";
        }

    </script>

</body>
</html>
