<!DOCTYPE html>
<html>
<head>
    <title>Multiple Values - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            max-width: 550px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #8e44ad;
        }

        input {
            display: block;
            width: 80%;
            margin: 12px auto;
            padding: 12px;
            border: 2px solid #8e44ad;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #8e44ad;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6c3483;
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            background: #f5eef8;
            border-radius: 10px;
            font-size: 18px;
            color: #6c3483;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #6c3483;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>💾 Store Multiple Values</h1>

        <input type="text" id="name" placeholder="Enter your name">

        <input type="text" id="course" placeholder="Enter your course">

        <input type="text" id="college" placeholder="Enter your college">

        <button onclick="storeData()">
            Save Details
        </button>

        <div id="message">
            Enter your details and click Save.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        function storeData() {

            const name = document.getElementById("name").value;
            const course = document.getElementById("course").value;
            const college = document.getElementById("college").value;

            if (name === "" || course === "" || college === "") {
                document.getElementById("message").textContent =
                    "❌ Please fill in all fields.";
                return;
            }

            localStorage.setItem("studentName", name);
            localStorage.setItem("course", course);
            localStorage.setItem("college", college);

            document.getElementById("message").textContent =
                "✅ All details saved successfully!";
        }
    </script>

</body>
</html>
