<!DOCTYPE html>
<html>
<head>
    <title>Recently Viewed Items - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #d35400;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .product {
            width: 150px;
            padding: 20px;
            background: #fff3e0;
            border: 2px solid #f39c12;
            border-radius: 15px;
        }

        .product h3 {
            color: #a04000;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #e67e22;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #ca6f1e;
        }

        #recentItems {
            margin-top: 25px;
            text-align: left;
        }

        .recent {
            background: #fef5e7;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            color: #784212;
        }

        .clear-btn {
            background: #c0392b;
            margin-top: 15px;
        }

        .clear-btn:hover {
            background: #922b21;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #a04000;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🛍️ Recently Viewed Items</h1>

        <p>
            Click "View Item" to save an item to your
            recently viewed list.
        </p>

        <div class="products">

            <div class="product">
                <h3>👕 T-Shirt</h3>
                <p>₹599</p>
                <button onclick="viewItem('T-Shirt')">
                    View Item
                </button>
            </div>

            <div class="product">
                <h3>👟 Sneakers</h3>
                <p>₹1,499</p>
                <button onclick="viewItem('Sneakers')">
                    View Item
                </button>
            </div>

            <div class="product">
                <h3>🎒 Backpack</h3>
                <p>₹899</p>
                <button onclick="viewItem('Backpack')">
                    View Item
                </button>
            </div>

            <div class="product">
                <h3>⌚ Smart Watch</h3>
                <p>₹2,999</p>
                <button onclick="viewItem('Smart Watch')">
                    View Item
                </button>
            </div>

        </div>

        <div id="recentItems">
            <h2>🕒 Recently Viewed</h2>
            <div id="list"></div>
        </div>

        <button class="clear-btn" onclick="clearHistory()">
            Clear Recently Viewed
        </button>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Display recently viewed items
        function displayRecentItems() {

            const list =
                document.getElementById("list");

            const savedItems =
                localStorage.getItem("recentItems");

            let items = savedItems
                ? JSON.parse(savedItems)
                : [];

            list.innerHTML = "";

            if (items.length === 0) {

                list.innerHTML =
                    "<p>No items viewed yet.</p>";

                return;
            }

            items.forEach(function(item) {

                const div =
                    document.createElement("div");

                div.className = "recent";

                div.textContent =
                    "👀 " + item;

                list.appendChild(div);
            });
        }


        // Save a viewed item
        function viewItem(item) {

            const savedItems =
                localStorage.getItem("recentItems");

            let items = savedItems
                ? JSON.parse(savedItems)
                : [];

            // Remove the item if it already exists
            items = items.filter(function(existingItem) {
                return existingItem !== item;
            });

            // Add the newest item at the beginning
            items.unshift(item);

            // Keep only the latest 5 items
            if (items.length > 5) {
                items.pop();
            }

            localStorage.setItem(
                "recentItems",
                JSON.stringify(items)
            );

            displayRecentItems();
        }


        // Clear all recently viewed items
        function clearHistory() {

            localStorage.removeItem("recentItems");

            displayRecentItems();
        }


        // Display saved items when page loads
        displayRecentItems();

    </script>

</body>
</html>
