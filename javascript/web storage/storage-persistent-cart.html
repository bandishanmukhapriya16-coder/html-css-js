<!DOCTYPE html>
<html>
<head>
    <title>Persistent Shopping Cart - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 750px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #c0392b;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .product {
            width: 150px;
            padding: 20px;
            background: #fdf2e9;
            border: 2px solid #e67e22;
            border-radius: 15px;
        }

        .product h3 {
            color: #a04000;
        }

        .product p {
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #e67e22;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #ca6f1e;
        }

        .cart {
            margin-top: 30px;
            text-align: left;
            background: #fef9e7;
            padding: 20px;
            border-radius: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #f5cba7;
        }

        .remove {
            background: #e74c3c;
        }

        .remove:hover {
            background: #c0392b;
        }

        #total {
            font-size: 20px;
            font-weight: bold;
            color: #a04000;
            margin-top: 15px;
        }

        .clear {
            background: #8e44ad;
            margin-top: 10px;
        }

        .clear:hover {
            background: #6c3483;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #117864;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #a04000;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🛒 Persistent Shopping Cart</h1>

        <p>
            Add products to your cart. The cart will remain
            saved even after refreshing the page.
        </p>

        <div class="products">

            <div class="product">
                <h3>👕 T-Shirt</h3>
                <p>₹599</p>

                <button onclick="addToCart('T-Shirt', 599)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>👟 Sneakers</h3>
                <p>₹1499</p>

                <button onclick="addToCart('Sneakers', 1499)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>🎒 Backpack</h3>
                <p>₹899</p>

                <button onclick="addToCart('Backpack', 899)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>⌚ Smart Watch</h3>
                <p>₹2999</p>

                <button onclick="addToCart('Smart Watch', 2999)">
                    Add to Cart
                </button>
            </div>

        </div>


        <div class="cart">

            <h2>🛍️ My Cart</h2>

            <div id="cartItems">
                Your cart is empty.
            </div>

            <div id="total">
                Total: ₹0
            </div>

            <button class="clear" onclick="clearCart()">
                🗑️ Clear Cart
            </button>

        </div>


        <div id="status">
            Cart loaded.
        </div>

    </div>


    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>


    <script>

        // Get saved cart
        let cart = JSON.parse(
            localStorage.getItem("shoppingCart")
        ) || [];


        // Add product to cart
        function addToCart(name, price) {

            const existingItem =
                cart.find(function(item) {
                    return item.name === name;
                });


            if (existingItem) {

                existingItem.quantity++;

            } else {

                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });
            }


            saveCart();

            displayCart();

            document.getElementById("status").textContent =
                "✅ " + name + " added to cart!";
        }


        // Save cart to localStorage
        function saveCart() {

            localStorage.setItem(
                "shoppingCart",
                JSON.stringify(cart)
            );
        }


        // Display cart
        function displayCart() {

            const cartItems =
                document.getElementById("cartItems");

            const totalElement =
                document.getElementById("total");


            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.textContent =
                    "Your cart is empty.";

                totalElement.textContent =
                    "Total: ₹0";

                return;
            }


            let total = 0;


            cart.forEach(function(item, index) {

                const itemDiv =
                    document.createElement("div");

                itemDiv.className = "cart-item";


                const itemText =
                    document.createElement("span");

                itemText.textContent =
                    item.name +
                    " × " +
                    item.quantity +
                    " — ₹" +
                    (item.price * item.quantity);


                const removeButton =
                    document.createElement("button");

                removeButton.className = "remove";

                removeButton.textContent =
                    "Remove";

                removeButton.onclick =
                    function() {
                        removeFromCart(index);
                    };


                itemDiv.appendChild(itemText);

                itemDiv.appendChild(removeButton);

                cartItems.appendChild(itemDiv);


                total +=
                    item.price * item.quantity;
            });


            totalElement.textContent =
                "Total: ₹" + total;
        }


        // Remove one product
        function removeFromCart(index) {

            cart.splice(index, 1);

            saveCart();

            displayCart();

            document.getElementById("status").textContent =
                "🗑️ Item removed from cart.";
        }


        // Clear entire cart
        function clearCart() {

            cart = [];

            localStorage.removeItem(
                "shoppingCart"
            );

            displayCart();

            document.getElementById("status").textContent =
                "🗑️ Cart cleared.";
        }


        // Display saved cart when page loads
        displayCart();

    </script>

</body>
</html>
