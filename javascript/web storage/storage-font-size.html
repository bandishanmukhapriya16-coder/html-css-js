<!DOCTYPE html>
<html>
<head>
    <title>Preferred Font Size - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            text-align: center;
            padding: 40px;
            transition: 0.3s;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6c3483;
        }

        #content {
            margin: 25px 0;
            line-height: 1.6;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #6c3483;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #7d3c98;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #6c3483;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🔤 Preferred Font Size</h1>

        <div id="content">
            <p>
                This is a sample paragraph demonstrating
                different font sizes.
            </p>

            <p>
                Your selected font size will be saved using
                localStorage and restored when you refresh
                the page.
            </p>
        </div>

        <button onclick="setFontSize('small')">
            Small
        </button>

        <button onclick="setFontSize('medium')">
            Medium
        </button>

        <button onclick="setFontSize('large')">
            Large
        </button>

        <p id="status">
            Current font size: Medium
        </p>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function setFontSize(size) {

            const content =
                document.getElementById("content");

            if (size === "small") {

                content.style.fontSize = "14px";

            } else if (size === "medium") {

                content.style.fontSize = "18px";

            } else if (size === "large") {

                content.style.fontSize = "24px";
            }

            // Save preferred font size
            localStorage.setItem("fontSize", size);

            document.getElementById("status").textContent =
                "Current font size: " +
                size.charAt(0).toUpperCase() +
                size.slice(1);
        }


        // Restore saved font size
        const savedFontSize =
            localStorage.getItem("fontSize");

        if (savedFontSize) {

            setFontSize(savedFontSize);

        } else {

            setFontSize("medium");
        }

    </script>

</body>
</html>
