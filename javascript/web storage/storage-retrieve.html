<!DOCTYPE html>
<html>
<head>
    <title>Retrieve Username - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #185a9d;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #185a9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0e3d6b;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #e8f8f5;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #117864;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #185a9d;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>📂 Retrieve Username</h1>

        <p>Click the button to retrieve the saved username.</p>

        <button onclick="retrieveUsername()">
            Retrieve Username
        </button>

        <div id="result">
            Username will appear here.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        function retrieveUsername() {

            const username = localStorage.getItem("username");

            if (username) {
                document.getElementById("result").textContent =
                    "👋 Welcome, " + username + "!";
            } else {
                document.getElementById("result").textContent =
                    "❌ No username found.";
            }
        }
    </script>

</body>
</html>
