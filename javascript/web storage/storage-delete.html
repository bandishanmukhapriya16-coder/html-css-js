<!DOCTYPE html>
<html>
<head>
    <title>Delete Username - localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #d35400;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #e67e22;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ca6f1e;
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            background: #fef5e7;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #9c640c;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #d35400;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🗑️ Delete Username</h1>

        <p>Click the button to remove the saved username.</p>

        <button onclick="deleteUsername()">
            Delete Username
        </button>

        <div id="message">
            Username is stored in localStorage.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        function deleteUsername() {

            localStorage.removeItem("username");

            document.getElementById("message").textContent =
                "✅ Username deleted successfully!";
        }
    </script>

</body>
</html>
