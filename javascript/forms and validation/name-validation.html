<!DOCTYPE html>
<html>
<head>
    <title>Name Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #d81b60;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #d81b60, #8e24aa);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #8e24aa;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #d81b60;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👤 Name Validation</h1>

        <form onsubmit="return validateName()">

            <label>Enter Your Name:</label>

            <input
                type="text"
                id="name"
                placeholder="Enter name"
            >

            <button type="submit">Validate Name</button>

        </form>

        <div id="message"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function validateName() {

            let name = document.getElementById("name").value;
            let message = document.getElementById("message");

            // Regular expression for alphabets and spaces
            let namePattern = /^[A-Za-z ]+$/;

            if (name === "") {

                message.innerHTML = "❌ Name cannot be empty.";
                message.style.color = "red";

                return false;
            }

            if (!namePattern.test(name)) {

                message.innerHTML =
                    "❌ Name should contain alphabets only.";

                message.style.color = "red";

                return false;
            }

            message.innerHTML =
                "✅ Valid name!";

            message.style.color = "green";

            return false;
        }

    </script>

</body>
</html>
