<!DOCTYPE html>
<html>
<head>
    <title>Login Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 380px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            border-color: #7b1fa2;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #7b1fa2, #e91e63);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6a1b9a;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Login Form</h1>

        <p>Enter your username and password</p>

        <form onsubmit="return validateLogin()">

            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter username">

            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">

            <button type="submit">Login</button>

        </form>

        <div id="message"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function validateLogin() {

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (username === "") {
                message.innerHTML = "❌ Username cannot be empty.";
                message.style.color = "red";
                return false;
            }

            if (password === "") {
                message.innerHTML = "❌ Password cannot be empty.";
                message.style.color = "red";
                return false;
            }

            if (password.length < 6) {
                message.innerHTML = "❌ Password must contain at least 6 characters.";
                message.style.color = "red";
                return false;
            }

            message.innerHTML = "✅ Login validation successful!";
            message.style.color = "green";

            return false;
        }

    </script>

</body>
</html>
