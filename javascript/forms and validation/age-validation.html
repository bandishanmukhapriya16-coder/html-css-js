<!DOCTYPE html>
<html>
<head>
    <title>Age Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #3949ab;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #3949ab;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #3949ab, #7e57c2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #3949ab;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #7e57c2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎂 Age Validation</h1>

        <form onsubmit="return validateAge()">

            <label>Enter Your Age:</label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
            >

            <button type="submit">Validate Age</button>

        </form>

        <div id="message"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function validateAge() {

            let age = document.getElementById("age").value;
            let message = document.getElementById("message");

            if (age === "") {

                message.innerHTML = "❌ Age cannot be empty.";
                message.style.color = "red";

                return false;
            }

            age = Number(age);

            if (age < 1 || age > 120) {

                message.innerHTML =
                    "❌ Please enter a valid age between 1 and 120.";

                message.style.color = "red";

                return false;
            }

            message.innerHTML =
                "✅ Valid age: " + age;

            message.style.color = "green";

            return false;
        }

    </script>

</body>
</html>
