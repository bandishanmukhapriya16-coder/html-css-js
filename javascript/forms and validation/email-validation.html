<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #7b1fa2;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #7b1fa2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #7b1fa2, #e91e63);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #7b1fa2;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📧 Email Validation</h1>

        <form onsubmit="return validateEmail()">

            <label>Enter Email Address:</label>

            <input
                type="text"
                id="email"
                placeholder="example@gmail.com"
            >

            <button type="submit">Validate Email</button>

        </form>

        <div id="message"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function validateEmail() {

            let email = document.getElementById("email").value;
            let message = document.getElementById("message");

            // Regular expression for basic email validation
            let emailPattern =
                /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

            if (email === "") {

                message.innerHTML =
                    "❌ Email cannot be empty.";

                message.style.color = "red";

                return false;
            }

            if (!emailPattern.test(email)) {

                message.innerHTML =
                    "❌ Please enter a valid email address.";

                message.style.color = "red";

                return false;
            }

            message.innerHTML =
                "✅ Valid email address!";

            message.style.color = "green";

            return false;
        }

    </script>

</body>
</html>
