<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart - Local Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fce4ec;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
        }

        .product h3 {
            margin: 0;
            color: #880e4f;
        }

        .product p {
            margin: 5px 0;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #d81b60, #8e24aa);
            color: white;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .cart {
            margin-top: 25px;
            padding: 20px;
            background: #f3e5f5;
            border-radius: 15px;
        }

        .cart h2 {
            color: #6a1b9a;
        }

        #cartItems {
            line-height: 1.8;
        }

        .clear {
            width: 100%;
            margin-top: 15px;
            background: #e53935;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #8e24aa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛒 Shopping Cart</h1>

        <div class="product">
            <div>
                <h3>👕 T-Shirt</h3>
                <p>₹500</p>
            </div>

            <button onclick="addToCart('T-Shirt', 500)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <div>
                <h3>🎧 Headphones</h3>
                <p>₹1000</p>
            </div>

            <button onclick="addToCart('Headphones', 1000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <div>
                <h3>🎒 Backpack</h3>
                <p>₹800</p>
            </div>

            <button onclick="addToCart('Backpack', 800)">
                Add to Cart
            </button>
        </div>

        <div class="cart">

            <h2>🛍️ Your Cart</h2>

            <div id="cartItems">
                Cart is empty.
            </div>

            <h3 id="total">Total: ₹0</h3>

            <button class="clear" onclick="clearCart()">
                🗑️ Clear Cart
            </button>

        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Get cart from Local Storage
        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        // Add product to cart
        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            // Save cart
            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();
        }


        // Display cart
        function displayCart() {

            let cartItems =
                document.getElementById("cartItems");

            let total =
                document.getElementById("total");

            if (cart.length === 0) {

                cartItems.innerHTML =
                    "Cart is empty.";

                total.innerHTML =
                    "Total: ₹0";

                return;
            }

            cartItems.innerHTML = "";

            let totalPrice = 0;

            cart.forEach(function(item, index) {

                cartItems.innerHTML +=
                    (index + 1) + ". " +
                    item.name +
                    " - ₹" +
                    item.price +
                    "<br>";

                totalPrice += item.price;
            });

            total.innerHTML =
                "Total: ₹" + totalPrice;
        }


        // Clear cart
        function clearCart() {

            cart = [];

            localStorage.removeItem("cart");

            displayCart();
        }


        // Display saved cart when page loads
        displayCart();

    </script>

</body>
</html>
