<!DOCTYPE html>
<html>
<head>
    <title>Local Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #6a1b9a;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7b1fa2, #e91e63);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f3e5f5;
            border-radius: 12px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6a1b9a;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💾 Local Storage</h1>

        <p>Store and retrieve data using browser Local Storage.</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <br>

        <button onclick="saveData()">
            💾 Save Name
        </button>

        <button onclick="getData()">
            📂 Retrieve Name
        </button>

        <button onclick="deleteData()">
            🗑️ Delete Name
        </button>

        <div id="output">
            No data displayed.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Store data
        function saveData() {

            let name =
                document.getElementById("username").value;

            if (name === "") {

                document.getElementById("output").innerHTML =
                    "❌ Please enter your name.";

                return;
            }

            localStorage.setItem("username", name);

            document.getElementById("output").innerHTML =
                "✅ Name saved successfully!";
        }


        // Retrieve data
        function getData() {

            let name =
                localStorage.getItem("username");

            if (name !== null) {

                document.getElementById("output").innerHTML =
                    "👋 Stored Name: " + name;

            } else {

                document.getElementById("output").innerHTML =
                    "⚠️ No name found in Local Storage.";
            }
        }


        // Delete data
        function deleteData() {

            localStorage.removeItem("username");

            document.getElementById("output").innerHTML =
                "🗑️ Stored name deleted.";
        }

    </script>

</body>
</html>
