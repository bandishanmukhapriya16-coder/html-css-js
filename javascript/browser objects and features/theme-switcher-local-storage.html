<!DOCTYPE html>
<html>
<head>
    <title>Theme Switcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            transition: 0.5s;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transition: 0.5s;
        }

        h1 {
            color: #3949ab;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #3949ab, #7e57c2);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Dark Theme */
        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .container {
            background: #263238;
            color: white;
        }

        body.dark h1 {
            color: #ce93d8;
        }

        body.dark p {
            color: #eeeeee;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #3949ab;
            text-decoration: none;
            font-weight: bold;
        }

        body.dark .back a {
            color: #ce93d8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Theme Switcher</h1>

        <p>
            This program changes between Light Mode and Dark Mode.
        </p>

        <p id="status">
            Current Theme: Light Mode
        </p>

        <button onclick="toggleTheme()">
            🌙 Toggle Theme
        </button>

        <button onclick="clearTheme()">
            🔄 Reset Theme
        </button>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Check saved theme when page loads
        let savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
        }

        updateStatus();


        // Change theme
        function toggleTheme() {

            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {

                localStorage.setItem("theme", "dark");

            } else {

                localStorage.setItem("theme", "light");
            }

            updateStatus();
        }


        // Display current theme
        function updateStatus() {

            let status =
                document.getElementById("status");

            if (document.body.classList.contains("dark")) {

                status.innerHTML =
                    "Current Theme: 🌙 Dark Mode";

            } else {

                status.innerHTML =
                    "Current Theme: ☀️ Light Mode";
            }
        }


        // Reset saved theme
        function clearTheme() {

            localStorage.removeItem("theme");

            document.body.classList.remove("dark");

            updateStatus();
        }

    </script>

</body>
</html>
