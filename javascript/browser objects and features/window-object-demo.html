<!DOCTYPE html>
<html>
<head>
    <title>Window Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #6a1b9a;
        }

        .info {
            background: #f3e5f5;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            line-height: 1.8;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7b1fa2, #e91e63);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #fff3e0;
            border-radius: 12px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6a1b9a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🪟 Window Object</h1>

        <div class="info">
            <p><b>Window Width:</b> <span id="width"></span> px</p>
            <p><b>Window Height:</b> <span id="height"></span> px</p>
        </div>

        <button onclick="showAlert()">Show Alert</button>

        <button onclick="showWindowInfo()">
            Show Window Info
        </button>

        <div id="output"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Display window dimensions
        document.getElementById("width").innerHTML =
            window.innerWidth;

        document.getElementById("height").innerHTML =
            window.innerHeight;


        // Alert using Window object
        function showAlert() {

            window.alert("Hello! This is a Window Object example.");

        }


        // Display Window information
        function showWindowInfo() {

            let output = document.getElementById("output");

            output.innerHTML =
                "🌐 Window Object Information<br><br>" +
                "Width: " + window.innerWidth + " px<br>" +
                "Height: " + window.innerHeight + " px<br>" +
                "URL: " + window.location.href;

        }

    </script>

</body>
</html>
