<!DOCTYPE html>
<html>
<head>
    <title>Session Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #1565c0;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #1565c0;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #1565c0, #00897b);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 12px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #00897b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🗂️ Session Storage</h1>

        <p>
            Store data temporarily during the current browser session.
        </p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <br>

        <button onclick="saveData()">
            💾 Save Data
        </button>

        <button onclick="getData()">
            📂 Retrieve Data
        </button>

        <button onclick="deleteData()">
            🗑️ Delete Data
        </button>

        <div id="output">
            No data displayed.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        // Store data in Session Storage
        function saveData() {

            let name =
                document.getElementById("username").value;

            if (name === "") {

                document.getElementById("output").innerHTML =
                    "❌ Please enter your name.";

                return;
            }

            sessionStorage.setItem("username", name);

            document.getElementById("output").innerHTML =
                "✅ Name saved in Session Storage!";
        }


        // Retrieve data
        function getData() {

            let name =
                sessionStorage.getItem("username");

            if (name !== null) {

                document.getElementById("output").innerHTML =
                    "👋 Stored Name: " + name;

            } else {

                document.getElementById("output").innerHTML =
                    "⚠️ No name found in Session Storage.";
            }
        }


        // Delete data
        function deleteData() {

            sessionStorage.removeItem("username");

            document.getElementById("output").innerHTML =
                "🗑️ Stored name deleted.";
        }

    </script>

</body>
</html>
