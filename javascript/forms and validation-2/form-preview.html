<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d81b60;
            outline: none;
        }

        .error {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #d81b60;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ad1457;
        }

        #preview {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff0f6;
            border: 2px solid #f48fb1;
            border-radius: 15px;
        }

        #preview h2 {
            text-align: center;
            color: #c2185b;
        }

        .preview-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
        }

        .preview-item strong {
            color: #c2185b;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Student Form Preview</h1>

    <form id="studentForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <div id="nameError" class="error"></div>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <div id="emailError" class="error"></div>

        <label for="course">Course</label>
        <select id="course">
            <option value="">-- Select Course --</option>
            <option value="B.Tech CSE">B.Tech CSE</option>
            <option value="B.Tech AI & DS">B.Tech AI & DS</option>
            <option value="BCA">BCA</option>
            <option value="B.Sc Computer Science">B.Sc Computer Science</option>
        </select>
        <div id="courseError" class="error"></div>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number">
        <div id="phoneError" class="error"></div>

        <label for="message">About You</label>
        <textarea id="message" placeholder="Enter a short description"></textarea>
        <div id="messageError" class="error"></div>

        <button type="submit">👁️ Preview Form</button>

    </form>

    <!-- Preview Section -->
    <div id="preview">

        <h2>✨ Form Preview</h2>

        <div class="preview-item">
            <strong>Name:</strong>
            <span id="previewName"></span>
        </div>

        <div class="preview-item">
            <strong>Email:</strong>
            <span id="previewEmail"></span>
        </div>

        <div class="preview-item">
            <strong>Course:</strong>
            <span id="previewCourse"></span>
        </div>

        <div class="preview-item">
            <strong>Phone:</strong>
            <span id="previewPhone"></span>
        </div>

        <div class="preview-item">
            <strong>About:</strong>
            <span id="previewMessage"></span>
        </div>

        <button type="button" onclick="editForm()">
            ✏️ Edit Details
        </button>

        <button type="button" onclick="confirmForm()">
            ✅ Confirm Submission
        </button>

    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    document.getElementById("studentForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let course = document.getElementById("course").value;
            let phone = document.getElementById("phone").value.trim();
            let message = document.getElementById("message").value.trim();

            let valid = true;

            // Clear previous errors
            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("courseError").textContent = "";
            document.getElementById("phoneError").textContent = "";
            document.getElementById("messageError").textContent = "";

            // Name validation
            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required.";
                valid = false;
            }
            else if (!/^[A-Za-z ]+$/.test(name)) {
                document.getElementById("nameError").textContent =
                    "Name should contain only alphabets.";
                valid = false;
            }

            // Email validation
            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required.";
                valid = false;
            }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email address.";
                valid = false;
            }

            // Course validation
            if (course === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course.";
                valid = false;
            }

            // Phone validation
            if (phone === "") {
                document.getElementById("phoneError").textContent =
                    "Phone number is required.";
                valid = false;
            }
            else if (!/^[0-9]{10}$/.test(phone)) {
                document.getElementById("phoneError").textContent =
                    "Enter exactly 10 digits.";
                valid = false;
            }

            // Message validation
            if (message === "") {
                document.getElementById("messageError").textContent =
                    "Please enter some information.";
                valid = false;
            }

            // Display preview
            if (valid) {

                document.getElementById("previewName").textContent = name;
                document.getElementById("previewEmail").textContent = email;
                document.getElementById("previewCourse").textContent = course;
                document.getElementById("previewPhone").textContent = phone;
                document.getElementById("previewMessage").textContent = message;

                document.getElementById("preview").style.display = "block";
            }
        }
    );

    function editForm() {
        document.getElementById("preview").style.display = "none";
    }

    function confirmForm() {

        alert("🎉 Form submitted successfully!");

        document.getElementById("studentForm").reset();
        document.getElementById("preview").style.display = "none";
    }

</script>

</body>
</html>
