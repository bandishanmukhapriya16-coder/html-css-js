<!DOCTYPE html>
<html>
<head>
    <title>Regular Expression Form Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #185a9d;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #185a9d;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #185a9d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d3f70;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #185a9d;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Regex Form Validation</h1>

        <form id="regexForm">

            <label>Full Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <label>Email:</label>
            <input
                type="text"
                id="email"
                placeholder="Enter your email"
            >

            <label>Mobile Number:</label>
            <input
                type="text"
                id="mobile"
                placeholder="Enter 10-digit number"
            >

            <label>Password:</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button type="submit">Validate Form</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("regexForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let password = document.getElementById("password").value;

            let message = document.getElementById("message");

            // Regular expressions
            let namePattern = /^[A-Za-z ]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let mobilePattern = /^[0-9]{10}$/;
            let passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$/;

            if (!namePattern.test(name)) {

                message.innerHTML =
                    "❌ Name must contain alphabets only.";
                message.className = "error";

            }
            else if (!emailPattern.test(email)) {

                message.innerHTML =
                    "❌ Enter a valid email address.";
                message.className = "error";

            }
            else if (!mobilePattern.test(mobile)) {

                message.innerHTML =
                    "❌ Mobile number must contain exactly 10 digits.";
                message.className = "error";

            }
            else if (!passwordPattern.test(password)) {

                message.innerHTML =
                    "❌ Password must have 8+ characters, uppercase, lowercase and a number.";
                message.className = "error";

            }
            else {

                message.innerHTML =
                    "🎉 All fields are valid!";
                message.className = "success";

            }

        });
    </script>

</body>
</html>
