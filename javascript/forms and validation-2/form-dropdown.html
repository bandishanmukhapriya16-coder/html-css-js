<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #e84393;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #e84393;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #e84393;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #e84393;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Course Selection</h1>

        <form id="courseForm">

            <label>Select Your Course:</label>

            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="CSE">Computer Science</option>
                <option value="AI">Artificial Intelligence</option>
                <option value="DS">Data Science</option>
                <option value="Cyber Security">Cyber Security</option>
            </select>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("courseForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let course = document.getElementById("course").value;
            let message = document.getElementById("message");

            if (course === "") {

                message.innerHTML = "❌ Please select a course.";
                message.style.color = "red";

            }
            else {

                message.innerHTML =
                    "✅ Course selected successfully!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
