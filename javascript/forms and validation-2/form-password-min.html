<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #8e44ad;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8e44ad;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #8e44ad;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #732d91;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #8e44ad;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📧 Email Validation</h1>

        <form id="emailForm">

            <label>Email Address:</label>

            <input
                type="text"
                id="email"
                placeholder="Enter your email"
            >

            <button type="submit">Validate Email</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("emailForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message");

            // Regular expression for email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                message.innerHTML = "❌ Please enter your email address.";
                message.style.color = "red";

            }
            else if (!emailPattern.test(email)) {

                message.innerHTML = "❌ Please enter a valid email address.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Valid email address!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
