<!DOCTYPE html>
<html>
<head>
    <title>Email Regex Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f5fd1;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📧 Email Validation</h1>

        <form id="emailForm">

            <label for="email">Email Address:</label>

            <input
                type="text"
                id="email"
                placeholder="example@gmail.com"
            >

            <button type="submit">Validate Email</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("emailForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message");

            // Email regular expression
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                message.innerHTML = "❌ Please enter an email address.";
                message.className = "error";

            }
            else if (emailPattern.test(email)) {

                message.innerHTML = "✅ Valid email address!";
                message.className = "success";

            }
            else {

                message.innerHTML = "❌ Invalid email address.";
                message.className = "error";

            }

        });
    </script>

</body>
</html>
