<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 460px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #243b55;
        }

        input[type="file"] {
            background: #f5f5f5;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        #confirmation {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #eef3f8;
            border-radius: 10px;
            line-height: 1.7;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💼 Job Application</h1>

        <form id="jobForm">

            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <label for="email">Email:</label>
            <input
                type="text"
                id="email"
                placeholder="Enter your email"
            >

            <label for="phone">Mobile Number:</label>
            <input
                type="text"
                id="phone"
                maxlength="10"
                placeholder="Enter 10-digit number"
            >

            <label for="position">Job Position:</label>
            <select id="position">
                <option value="">-- Select Position --</option>
                <option value="Software Developer">Software Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="AI/ML Intern">AI/ML Intern</option>
                <option value="Web Developer">Web Developer</option>
            </select>

            <label for="experience">Experience (Years):</label>
            <input
                type="number"
                id="experience"
                min="0"
                max="50"
                placeholder="Enter years of experience"
            >

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume">

            <button type="submit">Apply Now</button>

        </form>

        <div id="message"></div>

        <div id="confirmation">
            <h2>🎉 Application Submitted!</h2>

            <p><strong>Name:</strong> <span id="confirmName"></span></p>
            <p><strong>Email:</strong> <span id="confirmEmail"></span></p>
            <p><strong>Mobile:</strong> <span id="confirmPhone"></span></p>
            <p><strong>Position:</strong> <span id="confirmPosition"></span></p>
            <p><strong>Experience:</strong> <span id="confirmExperience"></span> years</p>
            <p><strong>Resume:</strong> <span id="confirmResume"></span></p>
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        document.getElementById("jobForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let position = document.getElementById("position").value;
            let experience = document.getElementById("experience").value;
            let resume = document.getElementById("resume").files[0];

            let message = document.getElementById("message");
            let confirmation = document.getElementById("confirmation");

            let namePattern = /^[A-Za-z ]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[0-9]{10}$/;


            if (name === "") {
                showError("❌ Please enter your name.");
                return;
            }

            if (!namePattern.test(name)) {
                showError("❌ Name should contain alphabets only.");
                return;
            }

            if (!emailPattern.test(email)) {
                showError("❌ Please enter a valid email address.");
                return;
            }

            if (!phonePattern.test(phone)) {
                showError("❌ Enter a valid 10-digit mobile number.");
                return;
            }

            if (position === "") {
                showError("❌ Please select a job position.");
                return;
            }

            if (experience === "" || experience < 0) {
                showError("❌ Please enter valid experience.");
                return;
            }

            if (!resume) {
                showError("❌ Please upload your resume.");
                return;
            }


            // Display success
            message.innerHTML = "✅ Application submitted successfully!";
            message.className = "success";

            document.getElementById("confirmName").innerHTML = name;
            document.getElementById("confirmEmail").innerHTML = email;
            document.getElementById("confirmPhone").innerHTML = phone;
            document.getElementById("confirmPosition").innerHTML = position;
            document.getElementById("confirmExperience").innerHTML = experience;
            document.getElementById("confirmResume").innerHTML = resume.name;

            confirmation.style.display = "block";


            function showError(text) {

                message.innerHTML = text;
                message.className = "error";
                confirmation.style.display = "none";

            }

        });

    </script>

</body>
</html>
