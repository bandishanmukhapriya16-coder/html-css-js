<!DOCTYPE html>
<html>
<head>
    <title>Strong Password Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #00c6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #3867d6;
        }

        .info {
            background: #eef5ff;
            padding: 12px;
            border-radius: 10px;
            color: #444;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3867d6;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #3867d6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #274db5;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #3867d6;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Strong Password</h1>

        <div class="info">
            Password should contain:
            <br>✔ At least 8 characters
            <br>✔ One uppercase letter
            <br>✔ One lowercase letter
            <br>✔ One number
            <br>✔ One special character
        </div>

        <form id="passwordForm">

            <label>Password:</label>

            <input
                type="password"
                id="password"
                placeholder="Enter strong password"
            >

            <button type="submit">Check Password</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            // Password conditions
            let uppercase = /[A-Z]/;
            let lowercase = /[a-z]/;
            let number = /[0-9]/;
            let special = /[!@#$%^&*(),.?":{}|<>]/;

            if (password === "") {

                message.innerHTML = "❌ Please enter a password.";
                message.style.color = "red";

            }
            else if (password.length < 8) {

                message.innerHTML =
                    "❌ Password must contain at least 8 characters.";
                message.style.color = "red";

            }
            else if (!uppercase.test(password)) {

                message.innerHTML =
                    "❌ Password must contain an uppercase letter.";
                message.style.color = "red";

            }
            else if (!lowercase.test(password)) {

                message.innerHTML =
                    "❌ Password must contain a lowercase letter.";
                message.style.color = "red";

            }
            else if (!number.test(password)) {

                message.innerHTML =
                    "❌ Password must contain a number.";
                message.style.color = "red";

            }
            else if (!special.test(password)) {

                message.innerHTML =
                    "❌ Password must contain a special character.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Strong password!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
