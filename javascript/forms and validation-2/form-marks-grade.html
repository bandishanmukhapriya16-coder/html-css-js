<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #e65100;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #ff7043;
        }

        .error {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #f4511e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d84315;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff3e0;
            border-radius: 12px;
        }

        #result h2 {
            text-align: center;
            color: #e65100;
        }

        .result-item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 17px;
        }

        .grade {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e65100;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Student Marks Calculator</h1>

    <form id="marksForm">

        <label for="subject1">Subject 1</label>
        <input type="number" id="subject1" min="0" max="100"
               placeholder="Enter marks out of 100">
        <div id="error1" class="error"></div>

        <label for="subject2">Subject 2</label>
        <input type="number" id="subject2" min="0" max="100"
               placeholder="Enter marks out of 100">
        <div id="error2" class="error"></div>

        <label for="subject3">Subject 3</label>
        <input type="number" id="subject3" min="0" max="100"
               placeholder="Enter marks out of 100">
        <div id="error3" class="error"></div>

        <label for="subject4">Subject 4</label>
        <input type="number" id="subject4" min="0" max="100"
               placeholder="Enter marks out of 100">
        <div id="error4" class="error"></div>

        <label for="subject5">Subject 5</label>
        <input type="number" id="subject5" min="0" max="100"
               placeholder="Enter marks out of 100">
        <div id="error5" class="error"></div>

        <button type="submit">
            🧮 Calculate Result
        </button>

    </form>

    <div id="result">

        <h2>🎓 Result</h2>

        <div class="result-item">
            <strong>Total Marks:</strong>
            <span id="total"></span> / 500
        </div>

        <div class="result-item">
            <strong>Average:</strong>
            <span id="average"></span>
        </div>

        <div class="result-item">
            <strong>Percentage:</strong>
            <span id="percentage"></span>%
        </div>

        <div class="result-item">
            <strong>Grade:</strong>
            <div class="grade" id="grade"></div>
        </div>

    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    document.getElementById("marksForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let valid = true;
            let marks = [];

            // Clear previous errors
            for (let i = 1; i <= 5; i++) {
                document.getElementById("error" + i).textContent = "";
            }

            document.getElementById("result").style.display = "none";

            // Validate all subjects
            for (let i = 1; i <= 5; i++) {

                let value =
                    document.getElementById("subject" + i).value;

                if (value === "") {

                    document.getElementById("error" + i).textContent =
                        "Please enter marks.";

                    valid = false;

                } else if (value < 0 || value > 100) {

                    document.getElementById("error" + i).textContent =
                        "Marks must be between 0 and 100.";

                    valid = false;

                } else {

                    marks.push(Number(value));
                }
            }

            if (!valid) {
                return;
            }

            // Calculate total
            let total = 0;

            for (let mark of marks) {
                total += mark;
            }

            // Calculate average
            let average = total / marks.length;

            // Percentage
            let percentage = (total / 500) * 100;

            // Calculate grade
            let grade;

            if (average >= 90) {
                grade = "A+";
            }
            else if (average >= 80) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 60) {
                grade = "C";
            }
            else if (average >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("total").textContent =
                total;

            document.getElementById("average").textContent =
                average.toFixed(2);

            document.getElementById("percentage").textContent =
                percentage.toFixed(2);

            document.getElementById("grade").textContent =
                grade;

            document.getElementById("result").style.display =
                "block";
        }
    );

</script>

</body>
</html>
