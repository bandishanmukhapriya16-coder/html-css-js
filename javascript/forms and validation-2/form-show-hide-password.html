<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #11998e;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        .password-box {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #11998e;
        }

        .show-password {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .show-password input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #11998e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d7f74;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #11998e;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Show / Hide Password</h1>

        <form id="passwordForm">

            <label for="password">Password:</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </div>

            <div class="show-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Password</label>
            </div>

            <button type="submit">Submit</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let password = document.getElementById("password");
        let showPassword = document.getElementById("showPassword");

        // Show / Hide Password
        showPassword.addEventListener("change", function() {

            if (showPassword.checked) {
                password.type = "text";
            }
            else {
                password.type = "password";
            }

        });


        // Form validation
        document.getElementById("passwordForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let message = document.getElementById("message");

            if (password.value.trim() === "") {

                message.innerHTML = "❌ Please enter a password.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Password entered successfully!";
                message.style.color = "green";

            }

        });

    </script>

</body>
</html>
