<!DOCTYPE html>
<html>
<head>
    <title>Mobile Number Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #0984e3;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0984e3;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #0984e3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0767b1;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #0984e3;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📱 Mobile Validation</h1>

        <form id="mobileForm">

            <label>Mobile Number:</label>

            <input
                type="text"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
            >

            <button type="submit">Validate Number</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("mobileForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let mobile = document.getElementById("mobile").value.trim();
            let message = document.getElementById("message");

            // Regular expression for exactly 10 digits
            let mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {

                message.innerHTML = "❌ Please enter your mobile number.";
                message.style.color = "red";

            }
            else if (!mobilePattern.test(mobile)) {

                message.innerHTML = "❌ Mobile number must contain exactly 10 digits.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Valid mobile number!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
