<!DOCTYPE html>
<html>
<head>
    <title>Radio Button Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
        }

        .question {
            font-weight: bold;
            margin-top: 20px;
        }

        .option {
            margin-top: 12px;
            padding: 12px;
            background: #f2efff;
            border-radius: 8px;
        }

        .option input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4834d4;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Radio Button Validation</h1>

        <form id="radioForm">

            <p class="question">Select your preferred mode of study:</p>

            <div class="option">
                <input type="radio" name="study" value="Online">
                Online
            </div>

            <div class="option">
                <input type="radio" name="study" value="Offline">
                Offline
            </div>

            <div class="option">
                <input type="radio" name="study" value="Hybrid">
                Hybrid
            </div>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("radioForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let selectedOption = document.querySelector(
                'input[name="study"]:checked'
            );

            let message = document.getElementById("message");

            if (selectedOption === null) {

                message.innerHTML = "❌ Please select one option.";
                message.style.color = "red";

            }
            else {

                message.innerHTML =
                    "✅ Option selected successfully!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
