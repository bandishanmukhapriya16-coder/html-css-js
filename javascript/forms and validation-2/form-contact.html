<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Validation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7b1fa2;
            box-shadow: 0 0 5px rgba(123,31,162,0.3);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .error {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8e24aa, #5e35b1);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(90deg, #5e35b1, #8e24aa);
        }

        #success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .back a:hover {
            background: #111;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📩 Contact Us</h1>
    <p class="subtitle">Fill in the form and send us your message.</p>

    <form id="contactForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <div id="nameError" class="error"></div>

        <label for="email">Email Address</label>
        <input type="text" id="email" placeholder="Enter your email">
        <div id="emailError" class="error"></div>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number">
        <div id="phoneError" class="error"></div>

        <label for="subject">Subject</label>
        <select id="subject">
            <option value="">-- Select Subject --</option>
            <option value="General Enquiry">General Enquiry</option>
            <option value="Support">Support</option>
            <option value="Feedback">Feedback</option>
            <option value="Other">Other</option>
        </select>
        <div id="subjectError" class="error"></div>

        <label for="message">Message</label>
        <textarea id="message" placeholder="Enter your message"></textarea>
        <div id="messageError" class="error"></div>

        <button type="submit">📨 Send Message</button>

    </form>

    <div id="success">
        ✅ Your message has been submitted successfully!
    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    document.getElementById("contactForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let subject = document.getElementById("subject").value;
        let message = document.getElementById("message").value.trim();

        let valid = true;

        // Clear previous errors
        document.getElementById("nameError").textContent = "";
        document.getElementById("emailError").textContent = "";
        document.getElementById("phoneError").textContent = "";
        document.getElementById("subjectError").textContent = "";
        document.getElementById("messageError").textContent = "";

        document.getElementById("success").style.display = "none";

        // Name validation
        if (name === "") {
            document.getElementById("nameError").textContent =
                "Name is required.";
            valid = false;
        }
        else if (!/^[A-Za-z ]+$/.test(name)) {
            document.getElementById("nameError").textContent =
                "Name should contain only alphabets.";
            valid = false;
        }

        // Email validation
        if (email === "") {
            document.getElementById("emailError").textContent =
                "Email is required.";
            valid = false;
        }
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            document.getElementById("emailError").textContent =
                "Enter a valid email address.";
            valid = false;
        }

        // Phone validation
        if (phone === "") {
            document.getElementById("phoneError").textContent =
                "Phone number is required.";
            valid = false;
        }
        else if (!/^[0-9]{10}$/.test(phone)) {
            document.getElementById("phoneError").textContent =
                "Phone number must contain exactly 10 digits.";
            valid = false;
        }

        // Subject validation
        if (subject === "") {
            document.getElementById("subjectError").textContent =
                "Please select a subject.";
            valid = false;
        }

        // Message validation
        if (message === "") {
            document.getElementById("messageError").textContent =
                "Message is required.";
            valid = false;
        }
        else if (message.length < 10) {
            document.getElementById("messageError").textContent =
                "Message must contain at least 10 characters.";
            valid = false;
        }

        // Successful submission
        if (valid) {
            document.getElementById("success").style.display = "block";

            document.getElementById("contactForm").reset();
        }

    });

</script>

</body>
</html>
