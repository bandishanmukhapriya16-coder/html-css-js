<!DOCTYPE html>
<html>
<head>
    <title>Age Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #009688;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #009688;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #009688;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00796b;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #009688;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎂 Age Validation</h1>

        <form id="ageForm">

            <label>Enter Your Age:</label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
                min="1"
            >

            <button type="submit">Validate Age</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("ageForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let age = document.getElementById("age").value;
            let message = document.getElementById("message");

            age = Number(age);

            if (age === 0 || isNaN(age)) {

                message.innerHTML = "❌ Please enter your age.";
                message.style.color = "red";

            }
            else if (age < 1 || age > 120) {

                message.innerHTML = "❌ Please enter a valid age between 1 and 120.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Valid age: " + age;
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
