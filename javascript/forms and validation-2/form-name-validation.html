<!DOCTYPE html>
<html>
<head>
    <title>Name Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #e84393;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e84393;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #e84393;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d63078;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #e84393;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👤 Name Validation</h1>

        <form id="nameForm">

            <label>Enter Your Name:</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <button type="submit">Validate Name</button>

        </form>

        <p id="message"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("nameForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let message = document.getElementById("message");

            // Regular expression for alphabets and spaces only
            let namePattern = /^[A-Za-z ]+$/;

            if (name === "") {

                message.innerHTML = "❌ Please enter your name.";
                message.style.color = "red";

            }
            else if (!namePattern.test(name)) {

                message.innerHTML = "❌ Name must contain alphabets only.";
                message.style.color = "red";

            }
            else {

                message.innerHTML = "✅ Valid name!";
                message.style.color = "green";

            }

        });
    </script>

</body>
</html>
