<!DOCTYPE html>
<html>
<head>
    <title>Password Regex Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #6c2bd9;
        }

        .info {
            background: #f1eaff;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            color: #4a237a;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #6c2bd9;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #6c2bd9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5120a5;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6c2bd9;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Validation</h1>

        <div class="info">
            Password must contain:
            <br>✔ At least 8 characters
            <br>✔ One uppercase letter
            <br>✔ One lowercase letter
            <br>✔ One number
        </div>

        <form id="passwordForm">

            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button type="submit">Validate Password</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            // Password regular expression
            let passwordPattern =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$/;

            if (password === "") {

                message.innerHTML = "❌ Please enter a password.";
                message.className = "error";

            }
            else if (passwordPattern.test(password)) {

                message.innerHTML = "✅ Strong password!";
                message.className = "success";

            }
            else {

                message.innerHTML =
                    "❌ Password does not meet all requirements.";

                message.className = "error";
            }

        });
    </script>

</body>
</html>
