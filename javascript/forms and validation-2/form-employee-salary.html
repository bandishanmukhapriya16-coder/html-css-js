<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #11998e;
        }

        .error {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #087f5b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #056b4c;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #e8f8f1;
            border-radius: 12px;
        }

        #result h2 {
            text-align: center;
            color: #087f5b;
        }

        .result-item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 17px;
        }

        .salary {
            color: #087f5b;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💼 Employee Salary Calculator</h1>

    <form id="salaryForm">

        <label for="name">Employee Name</label>
        <input type="text" id="name" placeholder="Enter employee name">
        <div id="nameError" class="error"></div>

        <label for="basic">Basic Salary (₹)</label>
        <input type="number" id="basic" min="0"
               placeholder="Enter basic salary">
        <div id="basicError" class="error"></div>

        <label for="hra">HRA (₹)</label>
        <input type="number" id="hra" min="0"
               placeholder="Enter HRA">
        <div id="hraError" class="error"></div>

        <label for="allowance">Other Allowances (₹)</label>
        <input type="number" id="allowance" min="0"
               placeholder="Enter other allowances">
        <div id="allowanceError" class="error"></div>

        <label for="deduction">Deductions (₹)</label>
        <input type="number" id="deduction" min="0"
               placeholder="Enter deductions">
        <div id="deductionError" class="error"></div>

        <button type="submit">
            🧮 Calculate Salary
        </button>

    </form>

    <div id="result">

        <h2>📋 Salary Details</h2>

        <div class="result-item">
            <strong>Employee:</strong>
            <span id="employeeName"></span>
        </div>

        <div class="result-item">
            <strong>Basic Salary:</strong>
            ₹<span id="basicResult"></span>
        </div>

        <div class="result-item">
            <strong>HRA:</strong>
            ₹<span id="hraResult"></span>
        </div>

        <div class="result-item">
            <strong>Other Allowances:</strong>
            ₹<span id="allowanceResult"></span>
        </div>

        <div class="result-item">
            <strong>Gross Salary:</strong>
            ₹<span id="grossSalary" class="salary"></span>
        </div>

        <div class="result-item">
            <strong>Deductions:</strong>
            ₹<span id="deductionResult"></span>
        </div>

        <div class="result-item">
            <strong>Net Salary:</strong>
            ₹<span id="netSalary" class="salary"></span>
        </div>

    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    document.getElementById("salaryForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();

            let basic = document.getElementById("basic").value;
            let hra = document.getElementById("hra").value;
            let allowance = document.getElementById("allowance").value;
            let deduction = document.getElementById("deduction").value;

            let valid = true;

            // Clear errors
            document.getElementById("nameError").textContent = "";
            document.getElementById("basicError").textContent = "";
            document.getElementById("hraError").textContent = "";
            document.getElementById("allowanceError").textContent = "";
            document.getElementById("deductionError").textContent = "";

            document.getElementById("result").style.display = "none";

            // Name validation
            if (name === "") {

                document.getElementById("nameError").textContent =
                    "Employee name is required.";

                valid = false;

            } else if (!/^[A-Za-z ]+$/.test(name)) {

                document.getElementById("nameError").textContent =
                    "Name should contain only alphabets.";

                valid = false;
            }

            // Basic salary validation
            if (basic === "" || Number(basic) < 0) {

                document.getElementById("basicError").textContent =
                    "Enter a valid basic salary.";

                valid = false;
            }

            // HRA validation
            if (hra === "" || Number(hra) < 0) {

                document.getElementById("hraError").textContent =
                    "Enter a valid HRA amount.";

                valid = false;
            }

            // Allowance validation
            if (allowance === "" || Number(allowance) < 0) {

                document.getElementById("allowanceError").textContent =
                    "Enter a valid allowance amount.";

                valid = false;
            }

            // Deduction validation
            if (deduction === "" || Number(deduction) < 0) {

                document.getElementById("deductionError").textContent =
                    "Enter a valid deduction amount.";

                valid = false;
            }

            if (!valid) {
                return;
            }

            // Convert values to numbers
            basic = Number(basic);
            hra = Number(hra);
            allowance = Number(allowance);
            deduction = Number(deduction);

            // Calculate salary
            let grossSalary = basic + hra + allowance;

            let netSalary = grossSalary - deduction;

            // Display results
            document.getElementById("employeeName").textContent = name;

            document.getElementById("basicResult").textContent =
                basic.toFixed(2);

            document.getElementById("hraResult").textContent =
                hra.toFixed(2);

            document.getElementById("allowanceResult").textContent =
                allowance.toFixed(2);

            document.getElementById("grossSalary").textContent =
                grossSalary.toFixed(2);

            document.getElementById("deductionResult").textContent =
                deduction.toFixed(2);

            document.getElementById("netSalary").textContent =
                netSalary.toFixed(2);

            document.getElementById("result").style.display =
                "block";
        }
    );

</script>

</body>
</html>
