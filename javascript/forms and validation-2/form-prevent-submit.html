<!DOCTYPE html>
<html>
<head>
    <title>Prevent Form Submission</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4834d4;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚫 Prevent Submission</h1>

        <form id="myForm">

            <label>Username:</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

            <label>Email:</label>
            <input
                type="text"
                id="email"
                placeholder="Enter email"
            >

            <button type="submit">Submit Form</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("myForm").addEventListener("submit", function(event) {

            let username = document.getElementById("username").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message");

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // Prevent submission if validation fails
            if (username === "") {

                event.preventDefault();

                message.innerHTML = "❌ Username is required.";
                message.className = "error";

            }
            else if (!emailPattern.test(email)) {

                event.preventDefault();

                message.innerHTML = "❌ Please enter a valid email.";
                message.className = "error";

            }
            else {

                // Keep the page from actually submitting
                event.preventDefault();

                message.innerHTML =
                    "✅ Form validation successful! Submission allowed.";
                message.className = "success";

            }

        });
    </script>

</body>
</html>
