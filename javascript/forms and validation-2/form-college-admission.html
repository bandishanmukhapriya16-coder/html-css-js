<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f5fd1;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #ffe0e0;
            color: #c0392b;
        }

        #confirmation {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #eef2ff;
            border-radius: 10px;
            color: #333;
            line-height: 1.7;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 College Admission</h1>

        <form id="admissionForm">

            <label for="name">Student Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter student name"
            >

            <label for="email">Email:</label>
            <input
                type="text"
                id="email"
                placeholder="Enter email"
            >

            <label for="mobile">Mobile Number:</label>
            <input
                type="text"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit number"
            >

            <label for="course">Select Course:</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="B.Tech AI & ML">B.Tech AI & ML</option>
                <option value="B.Tech Data Science">B.Tech Data Science</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc Computer Science">B.Sc Computer Science</option>
            </select>

            <label for="marks">12th Percentage:</label>
            <input
                type="number"
                id="marks"
                placeholder="Enter percentage"
                min="0"
                max="100"
            >

            <button type="submit">Apply for Admission</button>

        </form>

        <div id="message"></div>

        <div id="confirmation">
            <h2>🎉 Application Submitted!</h2>

            <p><strong>Name:</strong> <span id="confirmName"></span></p>
            <p><strong>Email:</strong> <span id="confirmEmail"></span></p>
            <p><strong>Mobile:</strong> <span id="confirmMobile"></span></p>
            <p><strong>Course:</strong> <span id="confirmCourse"></span></p>
            <p><strong>12th Percentage:</strong> <span id="confirmMarks"></span>%</p>
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        document.getElementById("admissionForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let course = document.getElementById("course").value;
            let marks = document.getElementById("marks").value;

            let message = document.getElementById("message");
            let confirmation = document.getElementById("confirmation");

            let namePattern = /^[A-Za-z ]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let mobilePattern = /^[0-9]{10}$/;


            if (name === "") {
                showError("❌ Please enter the student's name.");
                return;
            }

            if (!namePattern.test(name)) {
                showError("❌ Name should contain alphabets only.");
                return;
            }

            if (!emailPattern.test(email)) {
                showError("❌ Please enter a valid email.");
                return;
            }

            if (!mobilePattern.test(mobile)) {
                showError("❌ Please enter a valid 10-digit mobile number.");
                return;
            }

            if (course === "") {
                showError("❌ Please select a course.");
                return;
            }

            if (marks === "" || marks < 0 || marks > 100) {
                showError("❌ Enter a valid percentage between 0 and 100.");
                return;
            }


            // Display confirmation
            message.innerHTML = "✅ All details are valid!";
            message.className = "success";

            document.getElementById("confirmName").innerHTML = name;
            document.getElementById("confirmEmail").innerHTML = email;
            document.getElementById("confirmMobile").innerHTML = mobile;
            document.getElementById("confirmCourse").innerHTML = course;
            document.getElementById("confirmMarks").innerHTML = marks;

            confirmation.style.display = "block";


            function showError(text) {

                message.innerHTML = text;
                message.className = "error";
                confirmation.style.display = "none";

            }

        });

    </script>

</body>
</html>
