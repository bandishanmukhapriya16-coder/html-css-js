<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
        }

        .step {
            width: 32%;
            padding: 10px;
            text-align: center;
            background: #ddd;
            border-radius: 8px;
            font-weight: bold;
        }

        .step.active {
            background: #7b1fa2;
            color: white;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        h2 {
            color: #7b1fa2;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #7b1fa2;
            outline: none;
        }

        .error {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7b1fa2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #512da8;
        }

        #previous {
            background: #555;
        }

        #success {
            display: none;
            text-align: center;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Registration Form</h1>

    <div class="steps">
        <div class="step active">1. Personal</div>
        <div class="step">2. Contact</div>
        <div class="step">3. Account</div>
    </div>

    <form id="registrationForm">

        <!-- STEP 1 -->
        <div class="form-step active">

            <h2>👤 Personal Details</h2>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div id="nameError" class="error"></div>

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age">
            <div id="ageError" class="error"></div>

            <div class="buttons">
                <button type="button" onclick="nextStep()">Next →</button>
            </div>

        </div>

        <!-- STEP 2 -->
        <div class="form-step">

            <h2>📞 Contact Details</h2>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <div id="emailError" class="error"></div>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="10-digit phone number">
            <div id="phoneError" class="error"></div>

            <div class="buttons">
                <button type="button" id="previous" onclick="previousStep()">
                    ← Previous
                </button>

                <button type="button" onclick="nextStep()">
                    Next →
                </button>
            </div>

        </div>

        <!-- STEP 3 -->
        <div class="form-step">

            <h2>🔐 Account Details</h2>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username">
            <div id="usernameError" class="error"></div>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">
            <div id="passwordError" class="error"></div>

            <div class="buttons">
                <button type="button" id="previous" onclick="previousStep()">
                    ← Previous
                </button>

                <button type="submit">
                    Register ✓
                </button>
            </div>

        </div>

    </form>

    <div id="success">
        🎉 Registration completed successfully!
    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    let currentStep = 0;

    const steps = document.querySelectorAll(".form-step");
    const stepIndicators = document.querySelectorAll(".step");

    function showStep(step) {

        steps.forEach(function(item) {
            item.classList.remove("active");
        });

        stepIndicators.forEach(function(item) {
            item.classList.remove("active");
        });

        steps[step].classList.add("active");
        stepIndicators[step].classList.add("active");
    }

    function validateStep() {

        let valid = true;

        if (currentStep === 0) {

            let name = document.getElementById("name").value.trim();
            let age = document.getElementById("age").value;

            document.getElementById("nameError").textContent = "";
            document.getElementById("ageError").textContent = "";

            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required.";
                valid = false;
            }
            else if (!/^[A-Za-z ]+$/.test(name)) {
                document.getElementById("nameError").textContent =
                    "Name should contain only alphabets.";
                valid = false;
            }

            if (age === "") {
                document.getElementById("ageError").textContent =
                    "Age is required.";
                valid = false;
            }
            else if (age < 1 || age > 100) {
                document.getElementById("ageError").textContent =
                    "Enter a valid age.";
                valid = false;
            }
        }

        if (currentStep === 1) {

            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();

            document.getElementById("emailError").textContent = "";
            document.getElementById("phoneError").textContent = "";

            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required.";
                valid = false;
            }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email.";
                valid = false;
            }

            if (phone === "") {
                document.getElementById("phoneError").textContent =
                    "Phone number is required.";
                valid = false;
            }
            else if (!/^[0-9]{10}$/.test(phone)) {
                document.getElementById("phoneError").textContent =
                    "Enter exactly 10 digits.";
                valid = false;
            }
        }

        return valid;
    }

    function nextStep() {

        if (validateStep()) {

            if (currentStep < steps.length - 1) {
                currentStep++;
                showStep(currentStep);
            }
        }
    }

    function previousStep() {

        if (currentStep > 0) {
            currentStep--;
            showStep(currentStep);
        }
    }

    document.getElementById("registrationForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            document.getElementById("usernameError").textContent = "";
            document.getElementById("passwordError").textContent = "";

            let valid = true;

            if (username === "") {
                document.getElementById("usernameError").textContent =
                    "Username is required.";
                valid = false;
            }

            if (password === "") {
                document.getElementById("passwordError").textContent =
                    "Password is required.";
                valid = false;
            }
            else if (password.length < 6) {
                document.getElementById("passwordError").textContent =
                    "Password must contain at least 6 characters.";
                valid = false;
            }

            if (valid) {

                document.getElementById("success").style.display = "block";

                document.getElementById("registrationForm").reset();

                currentStep = 0;
                showStep(currentStep);
            }
        }
    );

</script>

</body>
</html>
