<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #0066cc;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0072ff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #0072ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056c7;
        }

        .error {
            color: #e53935;
            margin-top: 8px;
            font-size: 14px;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #e3f2fd;
            border-radius: 12px;
            text-align: center;
        }

        #result h2 {
            color: #0066cc;
        }

        .age {
            font-size: 30px;
            font-weight: bold;
            color: #0072ff;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: white;
            background: #333;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎂 Age Calculator</h1>

    <form id="ageForm">

        <label for="dob">Date of Birth</label>

        <input type="date" id="dob">

        <div id="error" class="error"></div>

        <button type="submit">
            🔢 Calculate Age
        </button>

    </form>

    <div id="result">
        <h2>Your Age</h2>

        <div class="age" id="ageResult"></div>

        <p id="details"></p>
    </div>

</div>

<div class="back">
    <a href="../index.html">← Back to JavaScript Index</a>
    <br><br>
    <a href="../../index.html">← Back to Main Index</a>
</div>

<script>

    document.getElementById("ageForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let dobValue = document.getElementById("dob").value;

            let error = document.getElementById("error");
            let result = document.getElementById("result");

            error.textContent = "";
            result.style.display = "none";

            // Check if date is selected
            if (dobValue === "") {
                error.textContent = "Please select your date of birth.";
                return;
            }

            let dob = new Date(dobValue);
            let today = new Date();

            // Check future date
            if (dob > today) {
                error.textContent =
                    "Date of birth cannot be in the future.";
                return;
            }

            let age = today.getFullYear() - dob.getFullYear();

            let monthDifference =
                today.getMonth() - dob.getMonth();

            // Adjust age if birthday has not occurred this year
            if (
                monthDifference < 0 ||
                (monthDifference === 0 &&
                 today.getDate() < dob.getDate())
            ) {
                age--;
            }

            document.getElementById("ageResult").textContent =
                age + " years old";

            document.getElementById("details").textContent =
                "Your date of birth is " +
                dob.toLocaleDateString();

            result.style.display = "block";
        }
    );

</script>

</body>
</html>
