<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Meter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .strength-box {
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        #strengthBar {
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        #strengthText {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .requirements {
            background: #f4f4ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
        }

        .requirements p {
            margin: 7px 0;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: #dc3545;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f5fd1;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Password Strength Meter</h1>

        <form id="passwordForm">

            <label for="password">Enter Password:</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <div class="strength-box">
                <div id="strengthBar"></div>
            </div>

            <div id="strengthText">Enter a password</div>

            <div class="requirements">
                <p id="length">❌ At least 8 characters</p>
                <p id="uppercase">❌ One uppercase letter</p>
                <p id="lowercase">❌ One lowercase letter</p>
                <p id="number">❌ One number</p>
                <p id="special">❌ One special character</p>
            </div>

            <button type="submit">Check Password</button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let password = document.getElementById("password");
        let strengthBar = document.getElementById("strengthBar");
        let strengthText = document.getElementById("strengthText");

        let lengthCheck = document.getElementById("length");
        let uppercaseCheck = document.getElementById("uppercase");
        let lowercaseCheck = document.getElementById("lowercase");
        let numberCheck = document.getElementById("number");
        let specialCheck = document.getElementById("special");


        password.addEventListener("input", function() {

            let value = password.value;
            let score = 0;

            // Check length
            if (value.length >= 8) {
                lengthCheck.innerHTML = "✔ At least 8 characters";
                lengthCheck.className = "valid";
                score++;
            }
            else {
                lengthCheck.innerHTML = "❌ At least 8 characters";
                lengthCheck.className = "invalid";
            }

            // Check uppercase
            if (/[A-Z]/.test(value)) {
                uppercaseCheck.innerHTML = "✔ One uppercase letter";
                uppercaseCheck.className = "valid";
                score++;
            }
            else {
                uppercaseCheck.innerHTML = "❌ One uppercase letter";
                uppercaseCheck.className = "invalid";
            }

            // Check lowercase
            if (/[a-z]/.test(value)) {
                lowercaseCheck.innerHTML = "✔ One lowercase letter";
                lowercaseCheck.className = "valid";
                score++;
            }
            else {
                lowercaseCheck.innerHTML = "❌ One lowercase letter";
                lowercaseCheck.className = "invalid";
            }

            // Check number
            if (/[0-9]/.test(value)) {
                numberCheck.innerHTML = "✔ One number";
                numberCheck.className = "valid";
                score++;
            }
            else {
                numberCheck.innerHTML = "❌ One number";
                numberCheck.className = "invalid";
            }

            // Check special character
            if (/[^A-Za-z0-9]/.test(value)) {
                specialCheck.innerHTML = "✔ One special character";
                specialCheck.className = "valid";
                score++;
            }
            else {
                specialCheck.innerHTML = "❌ One special character";
                specialCheck.className = "invalid";
            }


            // Update strength meter
            let percentage = (score / 5) * 100;

            strengthBar.style.width = percentage + "%";


            if (score === 0) {
                strengthText.innerHTML = "Enter a password";
            }
            else if (score <= 2) {
                strengthText.innerHTML = "Weak Password";
            }
            else if (score <= 4) {
                strengthText.innerHTML = "Medium Password";
            }
            else {
                strengthText.innerHTML = "Strong Password";
            }

        });


        document.getElementById("passwordForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let message = document.getElementById("message");

            if (
                password.value.length >= 8 &&
                /[A-Z]/.test(password.value) &&
                /[a-z]/.test(password.value) &&
                /[0-9]/.test(password.value) &&
                /[^A-Za-z0-9]/.test(password.value)
            ) {
                message.innerHTML = "✅ Password meets all requirements!";
                message.style.color = "green";
            }
            else {
                message.innerHTML = "❌ Please improve your password.";
                message.style.color = "red";
            }

        });

    </script>

</body>
</html>
