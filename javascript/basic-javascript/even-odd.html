<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Even or Odd - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
            font-size: 36px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 13px;
            margin: 15px 0;
            border: 2px solid #43cea2;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #e0f7f1;
            color: #185a9d;
            border-radius: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #185a9d;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #43cea2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔢 Even or Odd</h1>

        <p>Enter a number to check whether it is even or odd.</p>

        <input type="number" id="number" placeholder="Enter a number">

        <br><br>

        <button onclick="checkNumber()">Check Number</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="index.html">← Back to JavaScript Index</a>
        </div>

    </div>

    <script>
        function checkNumber() {

            let number = Number(document.getElementById("number").value);

            if (number % 2 === 0) {
                document.getElementById("result").innerHTML =
                    number + " is an Even Number ✅";
            } else {
                document.getElementById("result").innerHTML =
                    number + " is an Odd Number 🔵";
            }
        }
    </script>

</body>

</html>
