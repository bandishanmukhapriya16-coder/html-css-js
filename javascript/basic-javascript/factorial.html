<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Factorial - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #3154b5;
            font-size: 38px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 13px;
            margin: 15px 0;
            border: 2px solid #5b86e5;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e3f2fd;
            color: #3154b5;
            border-radius: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #3154b5;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #1e3a8a;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔢 Factorial</h1>

        <p>Enter a number to calculate its factorial.</p>

        <input type="number" id="number" placeholder="Enter a non-negative number">

        <br><br>

        <button onclick="findFactorial()">Calculate Factorial</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function findFactorial() {

            let number = Number(document.getElementById("number").value);
            let factorial = 1;

            if (number < 0 || !Number.isInteger(number)) {
                document.getElementById("result").innerHTML =
                    "Please enter a non-negative whole number.";
                return;
            }

            for (let i = 1; i <= number; i++) {
                factorial = factorial * i;
            }

            document.getElementById("result").innerHTML =
                number + "! = " + factorial;
        }
    </script>

</body>

</html>
