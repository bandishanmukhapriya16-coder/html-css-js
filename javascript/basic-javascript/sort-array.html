<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sort Array - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #8e24aa;
            font-size: 38px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 85%;
            padding: 14px;
            border: 2px solid #ba68c8;
            border-radius: 10px;
            font-size: 17px;
            margin: 15px 0;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #8e24aa, #ab47bc);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f3e5f5;
            color: #8e24aa;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #8e24aa;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #6a1b9a;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📊 Sort an Array</h1>

        <p>Enter numbers separated by commas.</p>

        <input type="text" id="numbers"
            placeholder="Example: 40, 10, 25, 5, 30">

        <br><br>

        <button onclick="sortArray()">Sort Array</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function sortArray() {

            let input = document.getElementById("numbers").value;

            if (input.trim() === "") {
                document.getElementById("result").innerHTML =
                    "Please enter some numbers.";
                return;
            }

            let array = input.split(",").map(Number);

            if (array.some(isNaN)) {
                document.getElementById("result").innerHTML =
                    "Please enter valid numbers only.";
                return;
            }

            let ascending = [...array].sort(function(a, b) {
                return a - b;
            });

            let descending = [...array].sort(function(a, b) {
                return b - a;
            });

            document.getElementById("result").innerHTML =
                "Original Array: " + array.join(", ") +
                "<br>Ascending: " + ascending.join(", ") +
                "<br>Descending: " + descending.join(", ");
        }
    </script>

</body>

</html>
