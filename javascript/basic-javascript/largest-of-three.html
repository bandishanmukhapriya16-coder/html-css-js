<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Largest of Three Numbers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #3949ab;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 8px;
            border: 2px solid #9face6;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            margin: 20px;
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: #3949ab;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #283593;
        }

        .result {
            padding: 18px;
            background: #e8eaf6;
            color: #283593;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background: #3949ab;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background: #283593;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🏆 Largest of Three Numbers</h1>

        <p>Enter three numbers to find the largest.</p>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
        <input type="number" id="num3" placeholder="Enter third number">

        <br>

        <button onclick="findLargest()">Find Largest</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="index.html">← Back to JavaScript Index</a>
        </div>

    </div>

    <script>
        function findLargest() {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let num3 = Number(document.getElementById("num3").value);

            let largest;

            if (num1 >= num2 && num1 >= num3) {
                largest = num1;
            } 
            else if (num2 >= num1 && num2 >= num3) {
                largest = num2;
            } 
            else {
                largest = num3;
            }

            document.getElementById("result").innerHTML =
                "The largest number is: " + largest;
        }
    </script>

</body>

</html>
