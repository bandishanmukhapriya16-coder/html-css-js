<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arithmetic Operations - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #7b2cbf;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 40%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #a18cd1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            margin: 20px 0;
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #7b2cbf, #a18cd1);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            background: #f3e8ff;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            line-height: 1.8;
            color: #4a148c;
            font-size: 18px;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #7b2cbf;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #5a189a;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🧮 Arithmetic Operations</h1>

        <p>Perform basic arithmetic operations using JavaScript.</p>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="calculate()">Calculate</button>

        <div class="result" id="result">
            Results will appear here.
        </div>

        <div class="back">
            <a href="index.html">← Back to JavaScript Index</a>
        </div>

    </div>

    <script>
        function calculate() {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let addition = num1 + num2;
            let subtraction = num1 - num2;
            let multiplication = num1 * num2;

            let division;

            if (num2 !== 0) {
                division = num1 / num2;
            } else {
                division = "Cannot divide by zero";
            }

            document.getElementById("result").innerHTML =
                "<b>Addition:</b> " + addition + "<br>" +
                "<b>Subtraction:</b> " + subtraction + "<br>" +
                "<b>Multiplication:</b> " + multiplication + "<br>" +
                "<b>Division:</b> " + division;
        }
    </script>

</body>

</html>
