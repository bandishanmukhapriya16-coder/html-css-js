<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Functions - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #c2185b;
            font-size: 38px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 14px;
            margin: 10px;
            border: 2px solid #ec407a;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 13px 30px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #c2185b, #ec407a);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #fce4ec;
            color: #c2185b;
            border-radius: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #c2185b;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #880e4f;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🧩 JavaScript Functions</h1>

        <p>Enter two numbers and use a function to calculate their sum.</p>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="displaySum()">Calculate Sum</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Function to add two numbers
        function addNumbers(a, b) {
            return a + b;
        }

        // Function to display the result
        function displaySum() {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            if (
                document.getElementById("num1").value === "" ||
                document.getElementById("num2").value === ""
            ) {
                document.getElementById("result").innerHTML =
                    "Please enter both numbers.";
                return;
            }

            let sum = addNumbers(num1, num2);

            document.getElementById("result").innerHTML =
                "Sum = " + sum;
        }

    </script>

</body>

</html>
