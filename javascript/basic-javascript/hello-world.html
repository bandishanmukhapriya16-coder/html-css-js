<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .emoji {
            font-size: 55px;
        }

        h1 {
            color: #764ba2;
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            color: #555;
            font-size: 20px;
        }

        .output {
            margin: 30px 0;
            padding: 18px;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .back a {
            display: inline-block;
            padding: 13px 25px;
            background-color: #764ba2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
        }

        .back a:hover {
            background-color: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="emoji">🌈✨</div>

        <h1>Hello World!</h1>

        <p>My First JavaScript Program</p>

        <div class="output" id="message">
            Hello World!
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        document.getElementById("message").innerHTML =
            "Hello World! JavaScript is working 🎉";

        console.log("Hello World!");
    </script>

</body>

</html>
