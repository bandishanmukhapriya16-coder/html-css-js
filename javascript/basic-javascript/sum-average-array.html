<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sum and Average of Array - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #7f00ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #1565c0;
            font-size: 36px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 85%;
            padding: 14px;
            border: 2px solid #42a5f5;
            border-radius: 10px;
            font-size: 17px;
            margin: 15px 0;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #1565c0, #7b1fa2);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>➕ Sum & Average of Array</h1>

        <p>Enter numbers separated by commas.</p>

        <input type="text" id="numbers"
            placeholder="Example: 10, 20, 30, 40, 50">

        <br><br>

        <button onclick="calculate()">Calculate</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function calculate() {

            let input = document.getElementById("numbers").value;

            if (input.trim() === "") {
                document.getElementById("result").innerHTML =
                    "Please enter some numbers.";
                return;
            }

            let array = input.split(",").map(Number);

            if (array.some(isNaN)) {
                document.getElementById("result").innerHTML =
                    "Please enter valid numbers only.";
                return;
            }

            let sum = 0;

            for (let i = 0; i < array.length; i++) {
                sum = sum + array[i];
            }

            let average = sum / array.length;

            document.getElementById("result").innerHTML =
                "Array: " + array.join(", ") +
                "<br>Sum: " + sum +
                "<br>Average: " + average.toFixed(2);
        }
    </script>

</body>

</html>
