<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fibonacci Series - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f, #ff9a9e);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #e85d04;
            font-size: 38px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 13px;
            margin: 15px 0;
            border: 2px solid #fcb69f;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #e85d04, #f48c06);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #fff3e0;
            color: #d84315;
            border-radius: 15px;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #e85d04;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #c2410c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔢 Fibonacci Series</h1>

        <p>Enter the number of terms to generate the Fibonacci series.</p>

        <input type="number" id="terms" placeholder="Enter number of terms">

        <br><br>

        <button onclick="generateFibonacci()">Generate Series</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function generateFibonacci() {

            let terms = Number(document.getElementById("terms").value);

            if (terms <= 0 || !Number.isInteger(terms)) {
                document.getElementById("result").innerHTML =
                    "Please enter a positive whole number.";
                return;
            }

            let first = 0;
            let second = 1;
            let series = [];

            for (let i = 1; i <= terms; i++) {
                series.push(first);

                let next = first + second;
                first = second;
                second = next;
            }

            document.getElementById("result").innerHTML =
                "Fibonacci Series:<br>" + series.join(" → ");
        }
    </script>

</body>

</html>
