<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Number - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0, #8fd3f4, #a6c1ee);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #1976d2;
            font-size: 38px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            padding: 13px;
            margin: 15px 0;
            border: 2px solid #8fd3f4;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #1976d2, #64b5f6);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔄 Palindrome Number</h1>

        <p>Enter a number to check whether it reads the same forward and backward.</p>

        <input type="number" id="number" placeholder="Enter a number">

        <br><br>

        <button onclick="checkPalindrome()">Check Palindrome</button>

        <div class="result" id="result">
            Result will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function checkPalindrome() {

            let number = document.getElementById("number").value;

            if (number === "") {
                document.getElementById("result").innerHTML =
                    "Please enter a number.";
                return;
            }

            let original = number;
            let reversed = number.split("").reverse().join("");

            if (original === reversed) {
                document.getElementById("result").innerHTML =
                    original + " is a Palindrome Number ✅";
            } else {
                document.getElementById("result").innerHTML =
                    original + " is Not a Palindrome Number ❌";
            }
        }
    </script>

</body>

</html>
