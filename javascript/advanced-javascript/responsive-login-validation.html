<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #5a3d8a;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a3d8a;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            margin-top: 25px;
            text-align: center;
        }

        .back a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 22px;
            }

            h1 {
                font-size: 26px;
            }

            input,
            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Login Form</h1>

    <p>Enter your login details</p>

    <form onsubmit="validateLogin(event)">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function validateLogin(event) {

    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let message = document.getElementById("message");

    if (username === "" || password === "") {

        message.innerHTML = "⚠️ Please fill in all fields.";
        message.style.color = "red";

    }
    else if (password.length < 6) {

        message.innerHTML =
            "❌ Password must contain at least 6 characters.";

        message.style.color = "red";

    }
    else {

        message.innerHTML =
            "✅ Login validation successful!";

        message.style.color = "green";
    }
}

</script>

</body>
</html>
