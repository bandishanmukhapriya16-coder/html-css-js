<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            padding: 35px;
            max-width: 650px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #00897b;
        }

        p {
            font-size: 17px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #00897b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00695c;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #e0f2f1;
            border-radius: 12px;
            font-size: 17px;
            line-height: 1.8;
            text-align: left;
        }

        .back {
            margin-top: 30px;
            text-align: center;
        }

        .back a {
            color: #00897b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🌐 Fetch API</h1>

        <p>
            Click the button to fetch data from an online API.
        </p>

        <button onclick="fetchData()">
            📥 Fetch Data
        </button>

        <div id="result">
            Data will appear here...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function fetchData() {

            document.getElementById("result").innerHTML =
                "⏳ Loading data...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")

                .then(function(response) {

                    return response.json();

                })

                .then(function(data) {

                    document.getElementById("result").innerHTML =
                        "<b>📌 ID:</b> " + data.id + "<br>" +
                        "<b>📌 Title:</b> " + data.title + "<br>" +
                        "<b>📌 Body:</b> " + data.body;

                })

                .catch(function(error) {

                    document.getElementById("result").innerHTML =
                        "❌ Error while fetching data.";

                    console.log(error);
                });
        }

    </script>

</body>
</html>
