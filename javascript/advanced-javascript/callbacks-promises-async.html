<!DOCTYPE html>
<html>
<head>
    <title>Callbacks, Promises and Async Await</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            padding: 35px;
            max-width: 650px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1565c0;
        }

        .box {
            background: #e3f2fd;
            padding: 18px;
            margin: 15px 0;
            border-radius: 12px;
            text-align: left;
        }

        .box h3 {
            color: #1976d2;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #result {
            margin-top: 20px;
            font-size: 17px;
            line-height: 1.8;
            font-weight: bold;
            color: #e91e63;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>⚡ Callbacks, Promises & Async/Await</h1>

        <div class="box">
            <h3>📌 Callback</h3>
            <p>A function passed to another function.</p>
        </div>

        <div class="box">
            <h3>📌 Promise</h3>
            <p>Represents the result of an asynchronous operation.</p>
        </div>

        <div class="box">
            <h3>📌 Async/Await</h3>
            <p>Provides a simple way to work with asynchronous code.</p>
        </div>

        <button onclick="runExample()">
            Run Example
        </button>

        <div id="result"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Callback Example
        function calculate(a, b, callback) {

            let result = a + b;

            callback(result);
        }

        // Promise Example
        function createPromise() {

            return new Promise(function(resolve) {

                setTimeout(function() {

                    resolve("Promise completed!");

                }, 1000);

            });
        }

        // Async/Await Example
        async function runExample() {

            let output = "";

            // Callback
            calculate(10, 20, function(result) {

                output += "📞 Callback Result: " + result + "<br>";

            });

            // Promise
            let promiseResult = await createPromise();

            output += "🤝 " + promiseResult + "<br>";

            // Async/Await
            output += "⏳ Async/Await executed successfully!";

            document.getElementById("result").innerHTML = output;
        }

    </script>

</body>
</html>
