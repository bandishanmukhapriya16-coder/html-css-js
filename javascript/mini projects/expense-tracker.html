<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .expense-box {
            background: white;
            width: 430px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #11998e;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input {
            width: 50%;
            padding: 11px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 10px;
            background: #11998e;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f2f6;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background: #e74c3c;
            padding: 7px 10px;
        }

        #total {
            text-align: center;
            color: #11998e;
            margin-top: 20px;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #11998e;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="expense-box">

        <h1>💰 Expense Tracker</h1>

        <div class="input-group">
            <input type="text" id="expenseName" placeholder="Expense name">
            <input type="number" id="expenseAmount" placeholder="Amount">
            <button onclick="addExpense()">Add</button>
        </div>

        <ul id="expenseList"></ul>

        <h2 id="total">Total: ₹0</h2>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        let expenses = [];
        let total = 0;

        function addExpense() {

            let name = document.getElementById("expenseName").value.trim();
            let amount = Number(
                document.getElementById("expenseAmount").value
            );

            if (name === "" || amount <= 0) {
                alert("Please enter a valid expense.");
                return;
            }

            expenses.push({
                name: name,
                amount: amount
            });

            displayExpenses();

            document.getElementById("expenseName").value = "";
            document.getElementById("expenseAmount").value = "";
        }

        function displayExpenses() {

            let list = document.getElementById("expenseList");

            list.innerHTML = "";
            total = 0;

            expenses.forEach(function(expense, index) {

                total += expense.amount;

                let li = document.createElement("li");

                li.innerHTML = `
                    <span>
                        ${expense.name} - ₹${expense.amount}
                    </span>

                    <button class="delete"
                            onclick="deleteExpense(${index})">
                        Delete
                    </button>
                `;

                list.appendChild(li);
            });

            document.getElementById("total").textContent =
                "Total: ₹" + total;
        }

        function deleteExpense(index) {

            expenses.splice(index, 1);

            displayExpenses();
        }
    </script>

</body>
</html>
