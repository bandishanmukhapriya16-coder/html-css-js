<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-box {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
            justify-content: center;
        }

        .cell {
            width: 90px;
            height: 90px;
            font-size: 35px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #eee;
            cursor: pointer;
        }

        .cell:hover {
            background: #ddd;
        }

        .reset {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-box">

        <h1>🎮 Tic-Tac-Toe</h1>

        <div id="status">Player X's Turn</div>

        <div class="board">

            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>

            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>

            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>

        </div>

        <button class="reset" onclick="resetGame()">
            🔄 Reset Game
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            document.getElementsByClassName("cell")[index].textContent =
                currentPlayer;

            if (checkWinner()) {

                document.getElementById("status").textContent =
                    "🎉 Player " + currentPlayer + " Wins!";

                gameOver = true;
                return;
            }

            if (!board.includes("")) {

                document.getElementById("status").textContent =
                    "🤝 It's a Draw!";

                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";

            document.getElementById("status").textContent =
                "Player " + currentPlayer + "'s Turn";
        }

        function checkWinner() {

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {
                    return true;
                }
            }

            return false;
        }

        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            document.querySelectorAll(".cell").forEach(function(cell) {
                cell.textContent = "";
            });

            document.getElementById("status").textContent =
                "Player X's Turn";
        }
    </script>

</body>
</html>
