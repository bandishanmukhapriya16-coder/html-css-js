<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            margin: 0;
            padding: 30px 0;
        }

        .cart-box {
            background: white;
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #e84393;
        }

        .product {
            background: #f8f9fa;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #e84393;
            color: white;
            cursor: pointer;
        }

        .product button:hover {
            opacity: 0.8;
        }

        #cart {
            margin-top: 25px;
        }

        #total {
            text-align: center;
            color: #27ae60;
        }

        .clear {
            display: block;
            margin: 15px auto;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #e84393;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="cart-box">

        <h1>🛒 Shopping Cart</h1>

        <div class="product">
            <span>📱 Smartphone - ₹15,000</span>
            <button onclick="addToCart('Smartphone', 15000)">
                Add
            </button>
        </div>

        <div class="product">
            <span>🎧 Headphones - ₹2,000</span>
            <button onclick="addToCart('Headphones', 2000)">
                Add
            </button>
        </div>

        <div class="product">
            <span>⌨️ Keyboard - ₹1,500</span>
            <button onclick="addToCart('Keyboard', 1500)">
                Add
            </button>
        </div>

        <div class="product">
            <span>🖱️ Mouse - ₹800</span>
            <button onclick="addToCart('Mouse', 800)">
                Add
            </button>
        </div>

        <div id="cart">
            <h2>Your Cart</h2>
            <p id="cartItems">Cart is empty.</p>
            <h2 id="total">Total: ₹0</h2>
        </div>

        <button class="clear" onclick="clearCart()">
            Clear Cart
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            displayCart();
        }

        function displayCart() {

            let cartItems = document.getElementById("cartItems");
            let total = 0;

            if (cart.length === 0) {
                cartItems.textContent = "Cart is empty.";
                document.getElementById("total").textContent =
                    "Total: ₹0";
                return;
            }

            cartItems.innerHTML = "";

            cart.forEach(function(item, index) {

                total += item.price;

                let div = document.createElement("div");

                div.innerHTML = `
                    ${item.name} - ₹${item.price}
                    <button onclick="removeItem(${index})">
                        Remove
                    </button>
                    <br><br>
                `;

                cartItems.appendChild(div);
            });

            document.getElementById("total").textContent =
                "Total: ₹" + total;
        }

        function removeItem(index) {

            cart.splice(index, 1);

            displayCart();
        }

        function clearCart() {

            cart = [];

            displayCart();
        }
    </script>

</body>
</html>
