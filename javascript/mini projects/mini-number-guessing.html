<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-box {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #ff5e62;
        }

        p {
            color: #555;
        }

        input {
            width: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 8px 5px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .guess {
            background: #3498db;
        }

        .reset {
            background: #e74c3c;
        }

        button:hover {
            opacity: 0.8;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        #attempts {
            color: #777;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            color: #ff5e62;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-box">

        <h1>🎯 Number Guessing Game</h1>

        <p>Guess a number between 1 and 100.</p>

        <input
            type="number"
            id="guessInput"
            min="1"
            max="100"
            placeholder="Enter number"
        >

        <br>

        <button class="guess" onclick="checkGuess()">
            Guess
        </button>

        <button class="reset" onclick="resetGame()">
            Reset
        </button>

        <div id="message"></div>

        <p id="attempts">Attempts: 0</p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {

            let input = document.getElementById("guessInput");
            let guess = Number(input.value);
            let message = document.getElementById("message");

            if (guess < 1 || guess > 100 || input.value === "") {
                message.textContent =
                    "⚠️ Please enter a number between 1 and 100.";
                return;
            }

            attempts++;

            document.getElementById("attempts").textContent =
                "Attempts: " + attempts;

            if (guess === randomNumber) {

                message.textContent =
                    "🎉 Correct! You guessed the number!";

            } else if (guess < randomNumber) {

                message.textContent =
                    "📈 Too low! Try again.";

            } else {

                message.textContent =
                    "📉 Too high! Try again.";
            }
        }

        function resetGame() {

            randomNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;

            document.getElementById("guessInput").value = "";

            document.getElementById("message").textContent =
                "🔄 New game started!";

            document.getElementById("attempts").textContent =
                "Attempts: 0";
        }
    </script>

</body>
</html>
