<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stopwatch {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #185a9d;
        }

        #display {
            font-size: 50px;
            font-weight: bold;
            color: #333;
            margin: 25px 0;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            cursor: pointer;
        }

        .start {
            background: #27ae60;
        }

        .stop {
            background: #e74c3c;
        }

        .reset {
            background: #f39c12;
        }

        button:hover {
            opacity: 0.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #185a9d;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="stopwatch">

        <h1>⏱️ Stopwatch</h1>

        <div id="display">00:00:00</div>

        <button class="start" onclick="startStopwatch()">Start</button>
        <button class="stop" onclick="stopStopwatch()">Stop</button>
        <button class="reset" onclick="resetStopwatch()">Reset</button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        let seconds = 0;
        let timer = null;

        function updateDisplay() {

            let hours = Math.floor(seconds / 3600);
            let minutes = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            secs = String(secs).padStart(2, "0");

            document.getElementById("display").textContent =
                hours + ":" + minutes + ":" + secs;
        }

        function startStopwatch() {

            if (timer === null) {
                timer = setInterval(function () {
                    seconds++;
                    updateDisplay();
                }, 1000);
            }
        }

        function stopStopwatch() {

            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {

            clearInterval(timer);
            timer = null;
            seconds = 0;
            updateDisplay();
        }
    </script>

</body>
</html>
