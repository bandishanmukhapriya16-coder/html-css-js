<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 17px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.85;
        }

        .length {
            margin: 15px 0;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f2f6;
            border-radius: 10px;
            word-break: break-all;
            font-size: 18px;
            font-weight: bold;
            color: #5b4bdb;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="password-box">

        <h1>🔐 Password Generator</h1>

        <p>Select password length:</p>

        <input
            type="number"
            id="length"
            value="12"
            min="4"
            max="30"
        >

        <button onclick="generatePassword()">
            Generate Password
        </button>

        <div id="result">
            Your password will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function generatePassword() {

            let length = Number(
                document.getElementById("length").value
            );

            if (length < 4 || length > 30) {
                alert("Please choose a length between 4 and 30.");
                return;
            }

            let characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
                "abcdefghijklmnopqrstuvwxyz" +
                "0123456789" +
                "!@#$%^&*";

            let password = "";

            for (let i = 0; i < length; i++) {

                let randomIndex =
                    Math.floor(Math.random() * characters.length);

                password += characters[randomIndex];
            }

            document.getElementById("result").textContent =
                password;
        }
    </script>

</body>
</html>
