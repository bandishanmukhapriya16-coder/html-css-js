<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #185a9d;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #bde0fe;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #185a9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #123f6d;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e7f5ff;
            border-radius: 12px;
            font-weight: bold;
            color: #185a9d;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔄 Swap Two Numbers</h1>

    <input type="number" id="num1" placeholder="Enter first number">

    <input type="number" id="num2" placeholder="Enter second number">

    <br>

    <button onclick="swapNumbers()">Swap Numbers</button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function swapNumbers() {

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    let temp = a;
    a = b;
    b = temp;

    document.getElementById("result").innerHTML =
        "After Swapping:<br>" +
        "First Number = " + a + "<br>" +
        "Second Number = " + b;
}

</script>

</body>
</html>
