<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Digits</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #0066cc;
        }

        p {
            color: #666;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #a8d8ff;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #0072ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056c7;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eaf6ff;
            border-radius: 12px;
            color: #0066cc;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #0072ff;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔢 Count Digits</h1>

    <p>Enter a number to count how many digits it contains.</p>

    <input
        type="number"
        id="number"
        placeholder="Enter a number"
    >

    <br>

    <button onclick="countDigits()">
        Count Digits
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function countDigits() {

    let number = document.getElementById("number").value;

    if (number === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter a number.";
        return;
    }

    let digits = Math.abs(Number(number))
        .toString()
        .length;

    document.getElementById("result").innerHTML =
        "✅ Number of digits = " + digits;
}

</script>

</body>
</html>
