<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #3154a4;
        }

        p {
            color: #666;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #a9c7ff;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #3154a4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #203b7a;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 12px;
            color: #3154a4;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #3154a4;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✖️ Multiplication Table</h1>

    <p>Enter a number to generate its multiplication table.</p>

    <input
        type="number"
        id="number"
        placeholder="Enter a number"
    >

    <br>

    <button onclick="generateTable()">
        Generate Table
    </button>

    <div id="result">
        Table will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function generateTable() {

    let number = Number(document.getElementById("number").value);
    let result = document.getElementById("result");

    if (isNaN(number)) {
        result.innerHTML = "⚠️ Please enter a number.";
        return;
    }

    let table = "";

    for (let i = 1; i <= 10; i++) {

        table += number + " × " + i +
                 " = " + (number * i) + "<br>";
    }

    result.innerHTML = table;
}

</script>

</body>
</html>
