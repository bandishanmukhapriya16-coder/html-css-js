<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Two Arrays</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a3d8a;
        }

        p {
            color: #666;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #c9b6e4;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c5fd5;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            background: #f3f0ff;
            border-radius: 12px;
            color: #5a3d8a;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔗 Merge Two Arrays</h1>

    <p>Enter two arrays with elements separated by commas.</p>

    <input
        type="text"
        id="array1"
        placeholder="Example: 1, 2, 3"
    >

    <input
        type="text"
        id="array2"
        placeholder="Example: 4, 5, 6"
    >

    <br>

    <button onclick="mergeArrays()">
        Merge Arrays
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function mergeArrays() {

    let input1 = document.getElementById("array1").value;
    let input2 = document.getElementById("array2").value;

    if (input1.trim() === "" || input2.trim() === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter both arrays.";
        return;
    }

    let array1 = input1
        .split(",")
        .map(item => item.trim());

    let array2 = input2
        .split(",")
        .map(item => item.trim());

    let mergedArray = [...array1, ...array2];

    document.getElementById("result").innerHTML =
        "Array 1: [" + array1.join(", ") + "]<br>" +
        "Array 2: [" + array2.join(", ") + "]<br><br>" +
        "🔗 Merged Array: [" +
        mergedArray.join(", ") + "]";
}

</script>

</body>
</html>
