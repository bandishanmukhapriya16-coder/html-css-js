<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency of Array Elements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d6336c;
        }

        p {
            color: #666;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #ffb3c6;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #d6336c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a61e4d;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            background: #fff0f6;
            border-radius: 12px;
            color: #862e4b;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #d6336c;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔢 Frequency of Array Elements</h1>

    <p>
        Enter array elements separated by commas.
    </p>

    <input
        type="text"
        id="arrayInput"
        placeholder="Example: 1, 2, 2, 3, 1, 2"
    >

    <br>

    <button onclick="findFrequency()">
        Find Frequency
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function findFrequency() {

    let input = document.getElementById("arrayInput").value;

    if (input.trim() === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter array elements.";
        return;
    }

    let array = input
        .split(",")
        .map(item => item.trim());

    let frequency = {};

    array.forEach(function(element) {

        if (frequency[element]) {
            frequency[element]++;
        } else {
            frequency[element] = 1;
        }

    });

    let output = "<strong>Element Frequency:</strong><br><br>";

    for (let element in frequency) {

        output += element + " → " +
                  frequency[element] + " time(s)<br>";
    }

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
