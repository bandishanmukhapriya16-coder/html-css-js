<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD of Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #43cea2);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #4b3f72;
        }

        p {
            color: #666;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #b8e0d2;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4b3f72;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef7f2;
            border-radius: 12px;
            color: #26734d;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔢 GCD of Two Numbers</h1>

    <p>Find the Greatest Common Divisor of two numbers.</p>

    <input type="number" id="num1" placeholder="Enter first number">

    <input type="number" id="num2" placeholder="Enter second number">

    <br>

    <button onclick="findGCD()">Find GCD</button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function findGCD() {

    let a = Math.abs(
        Number(document.getElementById("num1").value)
    );

    let b = Math.abs(
        Number(document.getElementById("num2").value)
    );

    if (a === 0 && b === 0) {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter valid numbers.";
        return;
    }

    while (b !== 0) {
        let remainder = a % b;
        a = b;
        b = remainder;
    }

    document.getElementById("result").innerHTML =
        "✅ GCD = " + a;
}

</script>

</body>
</html>
