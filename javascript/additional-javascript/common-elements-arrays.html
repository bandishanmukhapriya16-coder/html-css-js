<!DOCTYPE html>
<html>
<head>
    <title>Common Elements in Two Arrays</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #764ba2;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #764ba2;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0e6ff;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🔗 Common Elements in Two Arrays</h1>

        <p>Enter two arrays separated by commas:</p>

        <input type="text" id="array1"
               placeholder="Example: 1,2,3,4,5">

        <input type="text" id="array2"
               placeholder="Example: 3,4,5,6,7">

        <br>

        <button onclick="findCommon()">Find Common Elements</button>

        <div id="result"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function findCommon() {

            let array1 = document.getElementById("array1").value
                .split(",")
                .map(Number);

            let array2 = document.getElementById("array2").value
                .split(",")
                .map(Number);

            let common = array1.filter(function(value) {
                return array2.includes(value);
            });

            // Remove duplicate common elements
            common = [...new Set(common)];

            document.getElementById("result").innerHTML =
                "Common Elements: " + common.join(", ");
        }
    </script>

</body>
</html>
