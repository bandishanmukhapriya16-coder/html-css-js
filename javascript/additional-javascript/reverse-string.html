<!DOCTYPE html>
<html>
<head>
    <title>Reverse a String</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4f81;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 15px;
            border: 2px solid #ff7eb3;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: #ff4f81;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #d6336c;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #ffe6ef;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #ff4f81;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🔄 Reverse a String</h1>

        <p>Enter a string:</p>

        <input type="text" id="text"
               placeholder="Example: JavaScript">

        <br>

        <button onclick="reverseString()">Reverse String</button>

        <div id="result"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>
        function reverseString() {

            let text = document.getElementById("text").value;

            let reversed = text.split("").reverse().join("");

            document.getElementById("result").innerHTML =
                "Reversed String: " + reversed;
        }
    </script>

</body>
</html>
