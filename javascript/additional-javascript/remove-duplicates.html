<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Duplicates from Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
        }

        p {
            color: #666;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #a8e6cf;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #185a9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #123f6d;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f2;
            border-radius: 12px;
            color: #185a9d;
            font-weight: bold;
            line-height: 1.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔄 Remove Duplicates</h1>

    <p>
        Enter array elements separated by commas.
    </p>

    <input
        type="text"
        id="arrayInput"
        placeholder="Example: 10, 20, 10, 30, 20"
    >

    <br>

    <button onclick="removeDuplicates()">
        Remove Duplicates
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function removeDuplicates() {

    let input = document.getElementById("arrayInput").value;

    if (input.trim() === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter array elements.";
        return;
    }

    let array = input
        .split(",")
        .map(item => item.trim());

    let uniqueArray = [...new Set(array)];

    document.getElementById("result").innerHTML =
        "Original Array:<br>" +
        "[" + array.join(", ") + "]<br><br>" +

        "Array Without Duplicates:<br>" +
        "[" + uniqueArray.join(", ") + "]";
}

</script>

</body>
</html>
