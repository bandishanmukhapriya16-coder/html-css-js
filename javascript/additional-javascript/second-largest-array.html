<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Largest Element in Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d94841;
        }

        p {
            color: #666;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #ffb4a2;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff5e62;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #c92a2a;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #fff1ee;
            border-radius: 12px;
            color: #c92a2a;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #d94841;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🥈 Second Largest Element</h1>

    <p>
        Enter array elements separated by commas.
    </p>

    <input
        type="text"
        id="arrayInput"
        placeholder="Example: 10, 25, 15, 40, 30"
    >

    <br>

    <button onclick="findSecondLargest()">
        Find Second Largest
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function findSecondLargest() {

    let input = document.getElementById("arrayInput").value;

    let array = input
        .split(",")
        .map(Number);

    if (
        input.trim() === "" ||
        array.some(num => isNaN(num))
    ) {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter valid numbers.";
        return;
    }

    let uniqueArray = [...new Set(array)];

    if (uniqueArray.length < 2) {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter at least two different numbers.";
        return;
    }

    uniqueArray.sort((a, b) => b - a);

    let secondLargest = uniqueArray[1];

    document.getElementById("result").innerHTML =
        "Array: [" + array.join(", ") + "]<br><br>" +
        "🥈 Second Largest = " + secondLargest;
}

</script>

</body>
</html>
