<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCM of Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d94841;
        }

        p {
            color: #666;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #ffb4a2;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff5e62;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94841;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #fff1ee;
            border-radius: 12px;
            color: #c92a2a;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #d94841;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔢 LCM of Two Numbers</h1>

    <p>Find the Least Common Multiple of two numbers.</p>

    <input type="number" id="num1" placeholder="Enter first number">

    <input type="number" id="num2" placeholder="Enter second number">

    <br>

    <button onclick="findLCM()">Find LCM</button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function findLCM() {

    let a = Math.abs(
        Number(document.getElementById("num1").value)
    );

    let b = Math.abs(
        Number(document.getElementById("num2").value)
    );

    if (a === 0 || b === 0) {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter non-zero numbers.";
        return;
    }

    let x = a;
    let y = b;

    while (y !== 0) {
        let remainder = x % y;
        x = y;
        y = remainder;
    }

    let gcd = x;

    let lcm = (a * b) / gcd;

    document.getElementById("result").innerHTML =
        "✅ LCM = " + lcm;
}

</script>

</body>
</html>
