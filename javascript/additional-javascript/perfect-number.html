<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #c44569;
        }

        p {
            color: #666;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
            border: 2px solid #f8b4c0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #c44569;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #9b2c50;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #fff0f3;
            border-radius: 12px;
            color: #9b2c50;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #c44569;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✨ Perfect Number</h1>

    <p>Check whether a number is a perfect number.</p>

    <input
        type="number"
        id="number"
        placeholder="Enter a positive number"
    >

    <br>

    <button onclick="checkPerfect()">
        Check Number
    </button>

    <div id="result">
        Result will appear here...
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

</div>

<script>

function checkPerfect() {

    let number = Number(document.getElementById("number").value);

    if (number <= 0 || !Number.isInteger(number)) {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter a positive whole number.";
        return;
    }

    let sum = 0;

    for (let i = 1; i < number; i++) {

        if (number % i === 0) {
            sum += i;
        }
    }

    if (sum === number) {

        document.getElementById("result").innerHTML =
            "✅ " + number + " is a Perfect Number.";

    } else {

        document.getElementById("result").innerHTML =
            "❌ " + number + " is not a Perfect Number.";
    }
}

</script>

</body>
</html>
