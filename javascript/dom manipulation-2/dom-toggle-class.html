<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toggle CSS Class</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #36d1dc, #5b86e5);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #2563eb;
        }

        #box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 25px;
            margin: 25px 0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.4s;
        }

        /* This class will be toggled */
        .active {
            background: #fef3c7 !important;
            color: #92400e !important;
            border: 4px solid #f59e0b;
            transform: scale(1.05);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔄 Toggle CSS Class</h1>

        <p id="status">
            Click the button to toggle the class.
        </p>

        <div id="box">
            ✨ Click the button to change my style!
        </div>

        <button onclick="toggleClass()">
            Toggle Class
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function toggleClass() {

            const box = document.getElementById("box");

            // Add the class if it is absent
            // Remove the class if it is present
            box.classList.toggle("active");

            if (box.classList.contains("active")) {

                document.getElementById("status").innerHTML =
                    "🟢 The <b>active</b> class is ON.";

            } else {

                document.getElementById("status").innerHTML =
                    "⚪ The <b>active</b> class is OFF.";

            }

        }

    </script>

</body>
</html>
