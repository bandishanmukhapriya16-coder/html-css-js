<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Date and Time</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #0066cc;
        }

        #date {
            margin-top: 25px;
            padding: 15px;
            background: #e3f2fd;
            color: #0d47a1;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        #time {
            margin-top: 15px;
            padding: 20px;
            background: #bbdefb;
            color: #0d47a1;
            border-radius: 12px;
            font-size: 30px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📅 Current Date & Time</h1>

        <div id="date">
            Date
        </div>

        <div id="time">
            Time
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showDateTime() {

            // Create a Date object
            let now = new Date();

            // Get current date
            let currentDate = now.toLocaleDateString();

            // Get current time
            let currentTime = now.toLocaleTimeString();

            // Display date
            document.getElementById("date").innerText =
                "📅 Date: " + currentDate;

            // Display time
            document.getElementById("time").innerText =
                "⏰ Time: " + currentTime;
        }

        // Run the function immediately
        showDateTime();

        // Update the time every second
        setInterval(showDateTime, 1000);

    </script>

</body>
</html>
