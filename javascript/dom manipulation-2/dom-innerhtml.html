<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change InnerHTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d63384;
        }

        #content {
            background: #fff0f6;
            color: #9c2c77;
            padding: 20px;
            border-radius: 12px;
            font-size: 19px;
            margin: 20px 0;
        }

        button {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b02a6f;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌐 Change InnerHTML</h1>

        <div id="content">
            This is the original content.
        </div>

        <button onclick="changeContent()">
            Change Content
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function changeContent() {

            document.getElementById("content").innerHTML =
                "<h2>🎉 Content Changed!</h2>" +
                "<p>This heading and paragraph were added using <b>innerHTML</b>.</p>";

        }

    </script>

</body>
</html>
