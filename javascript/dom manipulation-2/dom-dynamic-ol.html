<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Ordered List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d63384;
        }

        input {
            width: 85%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin: 10px 0;
        }

        button {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #b02a6f;
        }

        ol {
            text-align: left;
            margin-top: 25px;
        }

        li {
            background: #fff0f6;
            color: #9c2c77;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            font-weight: bold;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔢 Dynamic Ordered List</h1>

        <p>Enter an item and add it to the ordered list.</p>

        <input
            type="text"
            id="itemInput"
            placeholder="Enter an item"
        >

        <br>

        <button onclick="addItem()">
            ➕ Add Item
        </button>

        <ol id="itemList"></ol>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function addItem() {

            const input = document.getElementById("itemInput");
            const list = document.getElementById("itemList");

            const itemText = input.value.trim();

            if (itemText === "") {

                alert("Please enter an item.");

                return;
            }

            // Create a new list item
            const listItem = document.createElement("li");

            // Add text to the list item
            listItem.textContent = itemText;

            // Add the item to the ordered list
            list.appendChild(listItem);

            // Clear the input field
            input.value = "";

            // Put cursor back in the input
            input.focus();
        }

    </script>

</body>
</html>
