<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Student Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #43cea2, #185a9d);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 750px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #185a9d;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #e3f2fd;
        }

        button {
            background: #185a9d;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d3d6b;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px;
                overflow-x: auto;
            }

            table {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Dynamic Student Table</h1>

        <p>
            Click the button to generate the student table dynamically.
        </p>

        <button onclick="createTable()">
            Create Student Table
        </button>

        <div id="tableContainer"></div>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function createTable() {

            const students = [
                {
                    name: "Ananya",
                    roll: "101",
                    course: "CSE",
                    marks: 92
                },
                {
                    name: "Rahul",
                    roll: "102",
                    course: "AI & ML",
                    marks: 88
                },
                {
                    name: "Priya",
                    roll: "103",
                    course: "Data Science",
                    marks: 95
                },
                {
                    name: "Arjun",
                    roll: "104",
                    course: "CSE",
                    marks: 84
                }
            ];

            const container =
                document.getElementById("tableContainer");

            // Create table
            const table = document.createElement("table");

            // Create table header
            const headerRow = document.createElement("tr");

            const headings = [
                "Name",
                "Roll No.",
                "Course",
                "Marks"
            ];

            headings.forEach(function(heading) {

                const th = document.createElement("th");

                th.textContent = heading;

                headerRow.appendChild(th);

            });

            table.appendChild(headerRow);

            // Create student rows
            students.forEach(function(student) {

                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = student.name;

                const rollCell = document.createElement("td");
                rollCell.textContent = student.roll;

                const courseCell = document.createElement("td");
                courseCell.textContent = student.course;

                const marksCell = document.createElement("td");
                marksCell.textContent = student.marks;

                row.appendChild(nameCell);
                row.appendChild(rollCell);
                row.appendChild(courseCell);
                row.appendChild(marksCell);

                table.appendChild(row);

            });

            // Display table
            container.innerHTML = "";
            container.appendChild(table);
        }

    </script>

</body>
</html>
