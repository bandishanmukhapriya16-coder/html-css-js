<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        p {
            text-align: center;
            color: #555;
        }

        .password-box {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #d81b60;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #d81b60;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #ad1457;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #ad1457;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 Show / Hide Password</h1>

        <p>Click the button to show or hide the password.</p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="togglePassword()" id="toggleButton">
                Show
            </button>

        </div>

        <div id="message">
            Password is hidden.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function togglePassword() {

            let password =
                document.getElementById("password");

            let button =
                document.getElementById("toggleButton");

            let message =
                document.getElementById("message");

            if (password.type === "password") {

                // Show password
                password.type = "text";

                button.innerText = "Hide";

                message.innerText =
                    "👁️ Password is visible.";

            } else {

                // Hide password
                password.type = "password";

                button.innerText = "Show";

                message.innerText =
                    "🔒 Password is hidden.";
            }
        }

    </script>

</body>
</html>
