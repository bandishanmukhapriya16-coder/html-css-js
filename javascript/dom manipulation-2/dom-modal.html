<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Modal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #e65100;
        }

        p {
            color: #555;
        }

        .open-button {
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #e65100;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .open-button:hover {
            background: #bf360c;
        }

        /* Modal background */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        /* Modal box */
        .modal-content {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: 12% auto;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #e65100;
        }

        .close-button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .close-button:hover {
            background: #b71c1c;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📢 DOM Modal</h1>

        <p>
            Click the button to open a modal window.
        </p>

        <button class="open-button" onclick="openModal()">
            Open Modal
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>


    <!-- Modal -->
    <div id="myModal" class="modal">

        <div class="modal-content">

            <h2>🎉 Welcome!</h2>

            <p>
                This is a modal window created using
                HTML, CSS, and JavaScript DOM manipulation.
            </p>

            <button class="close-button" onclick="closeModal()">
                Close
            </button>

        </div>

    </div>


    <script>

        function openModal() {

            // Show the modal
            document.getElementById("myModal").style.display = "block";
        }


        function closeModal() {

            // Hide the modal
            document.getElementById("myModal").style.display = "none";
        }


        // Close modal when clicking outside the modal box
        window.onclick = function(event) {

            let modal = document.getElementById("myModal");

            if (event.target === modal) {
                modal.style.display = "none";
            }
        };

    </script>

</body>
</html>
