<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #ef6c00;
        }

        p {
            text-align: center;
            color: #555;
        }

        textarea {
            width: 95%;
            height: 180px;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #ef6c00;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #f57c00;
        }

        #counter {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: #fff3e0;
            color: #e65100;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #ef6c00;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>✍️ Live Character Counter</h1>

        <p>
            Type something in the box to count characters automatically.
        </p>

        <textarea
            id="textBox"
            placeholder="Start typing here..."
            oninput="countCharacters()"
        ></textarea>

        <div id="counter">
            Characters: 0
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function countCharacters() {

            // Get the text entered by the user
            let text =
                document.getElementById("textBox").value;

            // Count characters
            let count = text.length;

            // Display character count
            document.getElementById("counter").innerText =
                "Characters: " + count;
        }

    </script>

</body>
</html>
