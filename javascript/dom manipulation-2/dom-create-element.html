<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #43cea2, #185a9d);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
        }

        #output {
            margin: 20px 0;
        }

        .new-item {
            background: #e3f2fd;
            color: #1565c0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            background: #185a9d;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d3d6b;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>➕ Create New Element</h1>

        <p>Click the button to create a new HTML element.</p>

        <button onclick="createElementDemo()">
            Create Element
        </button>

        <div id="output"></div>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        let count = 0;

        function createElementDemo() {

            count++;

            // Create a new paragraph element
            const newElement = document.createElement("p");

            // Add text to the element
            newElement.textContent =
                "🎉 New element " + count + " created using JavaScript!";

            // Add CSS class
            newElement.className = "new-item";

            // Add the element to the webpage
            document.getElementById("output").appendChild(newElement);
        }

    </script>

</body>
</html>
