<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Filter Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #185a9d;
        }

        p {
            text-align: center;
            color: #555;
        }

        #searchBox {
            width: 95%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #43cea2;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #185a9d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #185a9d;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #e8f5e9;
        }

        tr:hover {
            background: #d1f2eb;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #185a9d;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔎 Searchable Student Table</h1>

        <p>Type a name, roll number, or course to filter the table.</p>

        <input
            type="text"
            id="searchBox"
            placeholder="Search students..."
            onkeyup="searchTable()"
        >

        <table id="studentTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Priya</td>
                    <td>101</td>
                    <td>CSE</td>
                </tr>

                <tr>
                    <td>Anjali</td>
                    <td>102</td>
                    <td>AI & DS</td>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>103</td>
                    <td>ECE</td>
                </tr>

                <tr>
                    <td>Arun</td>
                    <td>104</td>
                    <td>CSE</td>
                </tr>

                <tr>
                    <td>Meena</td>
                    <td>105</td>
                    <td>IT</td>
                </tr>

            </tbody>

        </table>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function searchTable() {

            // Get search text
            let searchText =
                document.getElementById("searchBox").value.toLowerCase();

            // Get table rows
            let rows =
                document.getElementById("studentTable")
                .getElementsByTagName("tbody")[0]
                .getElementsByTagName("tr");

            // Check every row
            for (let i = 0; i < rows.length; i++) {

                let rowText = rows[i].innerText.toLowerCase();

                // Show or hide the row
                if (rowText.includes(searchText)) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }

    </script>

</body>
</html>
