<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #e65100;
        }

        p {
            text-align: center;
            color: #555;
        }

        .buttons {
            text-align: center;
            margin: 20px 0;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #e65100;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #bf360c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #e65100;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #fff3e0;
        }

        tr:hover {
            background: #ffe0b2;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔃 Sort Student Table</h1>

        <p>Sort the students by name, roll number, or marks.</p>

        <div class="buttons">
            <button onclick="sortName()">Sort by Name</button>
            <button onclick="sortRoll()">Sort by Roll No.</button>
            <button onclick="sortMarks()">Sort by Marks</button>
        </div>

        <table id="studentTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Rahul</td>
                    <td>103</td>
                    <td>78</td>
                </tr>

                <tr>
                    <td>Priya</td>
                    <td>101</td>
                    <td>92</td>
                </tr>

                <tr>
                    <td>Anjali</td>
                    <td>105</td>
                    <td>85</td>
                </tr>

                <tr>
                    <td>Arun</td>
                    <td>102</td>
                    <td>95</td>
                </tr>

                <tr>
                    <td>Meena</td>
                    <td>104</td>
                    <td>88</td>
                </tr>

            </tbody>

        </table>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function getRows() {
            return document
                .getElementById("studentTable")
                .getElementsByTagName("tbody")[0]
                .getElementsByTagName("tr");
        }

        function sortName() {

            let tbody = document.querySelector("#studentTable tbody");
            let rows = Array.from(getRows());

            rows.sort(function(a, b) {
                let nameA = a.cells[0].innerText.toLowerCase();
                let nameB = b.cells[0].innerText.toLowerCase();

                return nameA.localeCompare(nameB);
            });

            rows.forEach(function(row) {
                tbody.appendChild(row);
            });
        }

        function sortRoll() {

            let tbody = document.querySelector("#studentTable tbody");
            let rows = Array.from(getRows());

            rows.sort(function(a, b) {
                let rollA = Number(a.cells[1].innerText);
                let rollB = Number(b.cells[1].innerText);

                return rollA - rollB;
            });

            rows.forEach(function(row) {
                tbody.appendChild(row);
            });
        }

        function sortMarks() {

            let tbody = document.querySelector("#studentTable tbody");
            let rows = Array.from(getRows());

            rows.sort(function(a, b) {
                let marksA = Number(a.cells[2].innerText);
                let marksB = Number(b.cells[2].innerText);

                return marksB - marksA;
            });

            rows.forEach(function(row) {
                tbody.appendChild(row);
            });
        }

    </script>

</body>
</html>
