<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change HTML Attributes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a189a;
        }

        img {
            width: 250px;
            height: 160px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #ddd;
            margin: 20px 0;
        }

        button {
            background: #5a189a;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7b2cbf;
        }

        #status {
            color: #555;
            font-weight: bold;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #5a189a;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔧 Change HTML Attributes</h1>

        <p id="status">
            The image has its original attributes.
        </p>

        <img
            id="myImage"
            src="https://picsum.photos/id/1015/400/250"
            alt="Original Image"
            title="Original Image"
        >

        <br>

        <button onclick="changeAttributes()">
            Change Attributes
        </button>

        <button onclick="resetAttributes()">
            Reset
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function changeAttributes() {

            const image = document.getElementById("myImage");

            // Change the image source
            image.setAttribute(
                "src",
                "https://picsum.photos/id/1025/400/250"
            );

            // Change the alt attribute
            image.setAttribute(
                "alt",
                "Changed Image"
            );

            // Change the title attribute
            image.setAttribute(
                "title",
                "This image was changed using JavaScript"
            );

            document.getElementById("status").textContent =
                "✅ Image attributes have been changed!";

        }

        function resetAttributes() {

            const image = document.getElementById("myImage");

            image.setAttribute(
                "src",
                "https://picsum.photos/id/1015/400/250"
            );

            image.setAttribute(
                "alt",
                "Original Image"
            );

            image.setAttribute(
                "title",
                "Original Image"
            );

            document.getElementById("status").textContent =
                "🔄 Image attributes have been reset.";

        }

    </script>

</body>
</html>
