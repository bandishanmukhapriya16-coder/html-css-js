<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Table Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        p {
            text-align: center;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #d81b60;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #fce4ec;
        }

        button {
            background: #8e24aa;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #6a1b9a;
        }

        input {
            width: 90%;
            padding: 7px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .save {
            background: #2e7d32;
        }

        .save:hover {
            background: #1b5e20;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>✏️ Edit Table Data</h1>

        <p>Click the Edit button to modify student details.</p>

        <table id="studentTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Priya</td>
                    <td>101</td>
                    <td>CSE</td>
                    <td>
                        <button onclick="editRow(this)">Edit</button>
                    </td>
                </tr>

                <tr>
                    <td>Anjali</td>
                    <td>102</td>
                    <td>AI & DS</td>
                    <td>
                        <button onclick="editRow(this)">Edit</button>
                    </td>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>103</td>
                    <td>CSE</td>
                    <td>
                        <button onclick="editRow(this)">Edit</button>
                    </td>
                </tr>

            </tbody>

        </table>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function editRow(button) {

            // Get the selected row
            let row = button.parentElement.parentElement;

            // Get the cells
            let nameCell = row.cells[0];
            let rollCell = row.cells[1];
            let courseCell = row.cells[2];

            // Check whether the row is already being edited
            if (button.innerText === "Edit") {

                nameCell.innerHTML =
                    '<input type="text" value="' + nameCell.innerText + '">';

                rollCell.innerHTML =
                    '<input type="text" value="' + rollCell.innerText + '">';

                courseCell.innerHTML =
                    '<input type="text" value="' + courseCell.innerText + '">';

                button.innerText = "Save";
                button.classList.add("save");

            } else {

                // Get the input values
                let name = nameCell.querySelector("input").value;
                let roll = rollCell.querySelector("input").value;
                let course = courseCell.querySelector("input").value;

                // Update the table cells
                nameCell.innerText = name;
                rollCell.innerText = roll;
                courseCell.innerText = course;

                button.innerText = "Edit";
                button.classList.remove("save");
            }
        }

    </script>

</body>
</html>
