<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #673ab7;
        }

        p {
            text-align: center;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: 2px solid #673ab7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #673ab7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4527a0;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #ede7f6;
            border-radius: 10px;
            color: #4527a0;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #673ab7;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Dynamic Dropdown</h1>

        <p>Select a course from the dynamically created dropdown.</p>

        <select id="courseDropdown">
            <option value="">-- Select Course --</option>
        </select>

        <button onclick="showCourse()">Show Selected Course</button>

        <div id="result">
            Your selected course will appear here.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Array containing course names
        let courses = [
            "Computer Science",
            "Artificial Intelligence",
            "Data Science",
            "Information Technology",
            "Electronics and Communication"
        ];

        // Get the dropdown
        let dropdown = document.getElementById("courseDropdown");

        // Create options dynamically
        courses.forEach(function(course) {

            let option = document.createElement("option");

            option.value = course;
            option.textContent = course;

            dropdown.appendChild(option);
        });

        // Display selected course
        function showCourse() {

            let selectedCourse = dropdown.value;

            if (selectedCourse === "") {
                document.getElementById("result").innerText =
                    "⚠️ Please select a course.";
            } else {
                document.getElementById("result").innerText =
                    "✅ Selected Course: " + selectedCourse;
            }
        }

    </script>

</body>
</html>
