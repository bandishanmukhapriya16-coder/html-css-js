<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change CSS Style</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
        }

        #box {
            background: #e3f2fd;
            color: #1565c0;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        button {
            background: #185a9d;
            color: white;
            border: none;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d3d6b;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Change CSS Style</h1>

        <div id="box">
            Change my style using JavaScript!
        </div>

        <button onclick="changeStyle()">
            Change Style ✨
        </button>

        <button onclick="resetStyle()">
            Reset 🔄
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function changeStyle() {

            const box = document.getElementById("box");

            box.style.backgroundColor = "#ffe082";
            box.style.color = "#e65100";
            box.style.fontSize = "25px";
            box.style.border = "4px solid #ff9800";
            box.style.transform = "scale(1.05)";

        }

        function resetStyle() {

            const box = document.getElementById("box");

            box.style.backgroundColor = "#e3f2fd";
            box.style.color = "#1565c0";
            box.style.fontSize = "20px";
            box.style.border = "none";
            box.style.transform = "scale(1)";

        }

    </script>

</body>
</html>
