<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Remove Replace Elements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #6a1b9a;
        }

        #content {
            margin: 25px 0;
        }

        .box {
            background: #f3e5f5;
            color: #4a148c;
            padding: 18px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 18px;
        }

        button {
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            background: #7b1fa2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4a148c;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #6a1b9a;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔧 DOM Element Operations</h1>

        <p>
            Create, append, remove and replace HTML elements using JavaScript.
        </p>

        <div id="content">

            <div class="box" id="firstBox">
                Original Element
            </div>

        </div>

        <button onclick="createElementDemo()">
            Create Element
        </button>

        <button onclick="appendElementDemo()">
            Append Element
        </button>

        <button onclick="removeElementDemo()">
            Remove Element
        </button>

        <button onclick="replaceElementDemo()">
            Replace Element
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Create a new element
        function createElementDemo() {

            let newElement = document.createElement("div");

            newElement.className = "box";
            newElement.textContent = "✨ New Element Created!";

            document.getElementById("content")
                .appendChild(newElement);
        }


        // Create and append an element
        function appendElementDemo() {

            let newElement = document.createElement("div");

            newElement.className = "box";
            newElement.textContent = "📌 New Element Appended!";

            document.getElementById("content")
                .appendChild(newElement);
        }


        // Remove the last element
        function removeElementDemo() {

            let content = document.getElementById("content");

            if (content.children.length > 1) {

                content.removeChild(
                    content.lastElementChild
                );

            } else {

                alert("There is no extra element to remove.");
            }
        }


        // Replace the original element
        function replaceElementDemo() {

            let oldElement =
                document.getElementById("firstBox");

            let newElement = document.createElement("div");

            newElement.className = "box";
            newElement.textContent =
                "🔄 Original Element Replaced!";

            oldElement.parentNode.replaceChild(
                newElement,
                oldElement
            );

            newElement.id = "firstBox";
        }

    </script>

</body>
</html>
