<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Tooltip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #0072ff;
        }

        p {
            color: #555;
        }

        .items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .item {
            position: relative;
            padding: 18px 25px;
            background: #e3f2fd;
            color: #0056b3;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .item:hover {
            background: #bbdefb;
        }

        .tooltip {
            display: none;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            width: 180px;
            font-size: 14px;
            font-weight: normal;
            z-index: 10;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #222 transparent transparent transparent;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            color: #0072ff;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💡 Dynamic Tooltip</h1>

        <p>
            Move your mouse over an item to display its tooltip.
        </p>

        <div class="items">

            <div class="item"
                 onmouseover="showTooltip(this, 'HTML creates the structure of a webpage.')"
                 onmouseout="hideTooltip(this)">
                🌐 HTML
            </div>

            <div class="item"
                 onmouseover="showTooltip(this, 'CSS is used to style webpages.')"
                 onmouseout="hideTooltip(this)">
                🎨 CSS
            </div>

            <div class="item"
                 onmouseover="showTooltip(this, 'JavaScript adds interactivity to webpages.')"
                 onmouseout="hideTooltip(this)">
                ⚡ JavaScript
            </div>

        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showTooltip(element, message) {

            // Create tooltip dynamically
            let tooltip = document.createElement("div");

            tooltip.className = "tooltip";
            tooltip.innerText = message;

            // Add tooltip to the selected element
            element.appendChild(tooltip);

            // Show tooltip
            tooltip.style.display = "block";
        }


        function hideTooltip(element) {

            // Find the tooltip
            let tooltip = element.querySelector(".tooltip");

            // Remove tooltip
            if (tooltip) {
                tooltip.remove();
            }
        }

    </script>

</body>
</html>
