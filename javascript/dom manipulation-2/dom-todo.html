<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List using DOM</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #e91e63;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e91e63;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #e91e63;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: #fce4ec;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #880e4f;
        }

        li button {
            background: #d32f2f;
            padding: 7px 12px;
        }

        li button:hover {
            background: #b71c1c;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #e91e63;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>✅ My To-Do List</h1>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button onclick="addTask()">Add Task</button>

        </div>

        <ul id="taskList"></ul>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function addTask() {

            // Get the input value
            let task =
                document.getElementById("taskInput").value.trim();

            // Check if input is empty
            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            // Create a new list item
            let li = document.createElement("li");

            // Create task text
            let taskText = document.createElement("span");
            taskText.textContent = task;

            // Create delete button
            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            // Delete the task when button is clicked
            deleteButton.onclick = function() {
                li.remove();
            };

            // Add elements to the list item
            li.appendChild(taskText);
            li.appendChild(deleteButton);

            // Add list item to the unordered list
            document.getElementById("taskList")
                .appendChild(li);

            // Clear the input box
            document.getElementById("taskInput").value = "";
        }

    </script>

</body>
</html>
