<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Background Color on Click</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.5s;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a189a;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            border: none;
            color: white;
            padding: 13px 22px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .pink {
            background: #e91e63;
        }

        .blue {
            background: #2196f3;
        }

        .green {
            background: #4caf50;
        }

        .orange {
            background: #ff9800;
        }

        .purple {
            background: #9c27b0;
        }

        .reset {
            background: #333;
        }

        button:hover {
            transform: scale(1.05);
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #5a189a;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Background Color Changer</h1>

        <p>
            Click a button to change the webpage background color.
        </p>

        <button class="pink" onclick="changeBackground('#e91e63')">
            Pink
        </button>

        <button class="blue" onclick="changeBackground('#2196f3')">
            Blue
        </button>

        <button class="green" onclick="changeBackground('#4caf50')">
            Green
        </button>

        <button class="orange" onclick="changeBackground('#ff9800')">
            Orange
        </button>

        <button class="purple" onclick="changeBackground('#9c27b0')">
            Purple
        </button>

        <button class="reset" onclick="resetBackground()">
            Reset
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function changeBackground(color) {

            document.body.style.background = color;

        }

        function resetBackground() {

            document.body.style.background =
                "linear-gradient(135deg, #667eea, #764ba2)";

        }

    </script>

</body>
</html>
