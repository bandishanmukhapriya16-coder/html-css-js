<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Unordered List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a189a;
        }

        ul {
            text-align: left;
            padding: 0;
            list-style: none;
        }

        li {
            background: #f3e8ff;
            color: #5a189a;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: bold;
        }

        button {
            background: #5a189a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7b2cbf;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #5a189a;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Dynamic Unordered List</h1>

        <p>
            Click the button to create a list dynamically.
        </p>

        <ul id="studentList"></ul>

        <button onclick="createList()">
            Create List
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function createList() {

            const students = [
                "Ananya",
                "Rahul",
                "Priya",
                "Arjun",
                "Kavya"
            ];

            const list = document.getElementById("studentList");

            // Clear existing list
            list.innerHTML = "";

            // Create list items dynamically
            students.forEach(function(student) {

                const listItem = document.createElement("li");

                listItem.textContent = "🎓 " + student;

                list.appendChild(listItem);

            });

        }

    </script>

</body>
</html>
