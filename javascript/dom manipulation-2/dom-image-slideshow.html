<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Image Slideshow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #673ab7;
        }

        p {
            color: #555;
        }

        #slideImage {
            width: 100%;
            max-width: 550px;
            height: 330px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        #caption {
            font-size: 20px;
            font-weight: bold;
            color: #673ab7;
            margin: 15px;
        }

        button {
            padding: 11px 22px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #673ab7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4527a0;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #673ab7;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖼️ Image Slideshow</h1>

        <p>Use the buttons to move through the images.</p>

        <img id="slideImage"
             src="https://picsum.photos/id/1015/600/400"
             alt="Slideshow Image">

        <div id="caption">Nature</div>

        <div>
            <button onclick="previousImage()">⬅ Previous</button>
            <button onclick="nextImage()">Next ➡</button>
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Image array
        let images = [
            {
                url: "https://picsum.photos/id/1015/600/400",
                name: "Nature"
            },
            {
                url: "https://picsum.photos/id/1018/600/400",
                name: "Mountain"
            },
            {
                url: "https://picsum.photos/id/1019/600/400",
                name: "Forest"
            },
            {
                url: "https://picsum.photos/id/1025/600/400",
                name: "Animal"
            }
        ];

        // Current image position
        let currentIndex = 0;

        function showImage() {

            let image =
                document.getElementById("slideImage");

            let caption =
                document.getElementById("caption");

            // Change image
            image.src = images[currentIndex].url;

            // Change caption
            caption.innerText = images[currentIndex].name;
        }

        function nextImage() {

            currentIndex++;

            // Go back to first image
            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            showImage();
        }

        function previousImage() {

            currentIndex--;

            // Go to last image
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            showImage();
        }

    </script>

</body>
</html>
