<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #00897b;
        }

        p {
            text-align: center;
            color: #555;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #00897b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00695c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #00695c;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #00897b;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖼️ Dynamic Image Gallery</h1>

        <p>Images are created dynamically using JavaScript.</p>

        <div id="gallery" class="gallery"></div>

        <button onclick="addImage()">➕ Add New Image</button>

        <div id="message">
            Click an image to view its name.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Image data
        let images = [
            {
                name: "Nature",
                url: "https://picsum.photos/id/1015/400/300"
            },
            {
                name: "Mountain",
                url: "https://picsum.photos/id/1018/400/300"
            },
            {
                name: "Forest",
                url: "https://picsum.photos/id/1019/400/300"
            },
            {
                name: "Lake",
                url: "https://picsum.photos/id/1025/400/300"
            }
        ];

        let gallery = document.getElementById("gallery");

        // Create images dynamically
        function displayImages() {

            gallery.innerHTML = "";

            images.forEach(function(image) {

                let img = document.createElement("img");

                img.src = image.url;
                img.alt = image.name;
                img.title = image.name;

                // Click event
                img.onclick = function() {
                    document.getElementById("message").innerText =
                        "🌟 You selected: " + image.name;
                };

                gallery.appendChild(img);
            });
        }

        // Add a new image
        function addImage() {

            let newImage = {
                name: "New Image",
                url: "https://picsum.photos/400/300?random=" +
                     Math.random()
            };

            images.push(newImage);

            displayImages();

            document.getElementById("message").innerText =
                "✅ New image added!";
        }

        // Display initial images
        displayImages();

    </script>

</body>
</html>
