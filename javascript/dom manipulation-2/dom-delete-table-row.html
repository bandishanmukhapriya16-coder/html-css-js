<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Selected Table Row</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #6a1b9a;
        }

        p {
            text-align: center;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #6a1b9a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f3e5f5;
        }

        button {
            background: #e53935;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            color: #6a1b9a;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🗑️ Delete Selected Table Row</h1>

        <p>Click the Delete button to remove a selected row.</p>

        <table id="studentTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Priya</td>
                    <td>101</td>
                    <td>CSE</td>
                    <td>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>Anjali</td>
                    <td>102</td>
                    <td>AI & DS</td>
                    <td>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>103</td>
                    <td>CSE</td>
                    <td>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>Arun</td>
                    <td>104</td>
                    <td>ECE</td>
                    <td>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>

            </tbody>

        </table>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function deleteRow(button) {

            // Get the row containing the clicked button
            let row = button.parentElement.parentElement;

            // Remove the selected row
            row.remove();
        }

    </script>

</body>
</html>
