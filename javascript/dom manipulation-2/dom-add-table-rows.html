<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add and Delete Table Rows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 100%;
            max-width: 750px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a189a;
        }

        input {
            width: 25%;
            padding: 11px;
            margin: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        button {
            background: #5a189a;
            color: white;
            border: none;
            padding: 11px 18px;
            margin: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #7b2cbf;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #5a189a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f3e8ff;
        }

        .delete-btn {
            background: #dc3545;
            margin: 0;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #5a189a;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            input {
                width: 90%;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📊 Add & Delete Table Rows</h1>

        <p>Enter student details and add them to the table.</p>

        <input
            type="text"
            id="name"
            placeholder="Student Name"
        >

        <input
            type="text"
            id="roll"
            placeholder="Roll No."
        >

        <input
            type="text"
            id="course"
            placeholder="Course"
        >

        <br>

        <button onclick="addRow()">
            ➕ Add Row
        </button>

        <table id="studentTable">

            <tr>
                <th>Name</th>
                <th>Roll No.</th>
                <th>Course</th>
                <th>Action</th>
            </tr>

        </table>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function addRow() {

            const name =
                document.getElementById("name").value.trim();

            const roll =
                document.getElementById("roll").value.trim();

            const course =
                document.getElementById("course").value.trim();

            if (name === "" || roll === "" || course === "") {

                alert("Please enter all student details.");

                return;
            }

            const table =
                document.getElementById("studentTable");

            // Create a new row
            const row = document.createElement("tr");

            // Create Name cell
            const nameCell = document.createElement("td");
            nameCell.textContent = name;

            // Create Roll Number cell
            const rollCell = document.createElement("td");
            rollCell.textContent = roll;

            // Create Course cell
            const courseCell = document.createElement("td");
            courseCell.textContent = course;

            // Create Action cell
            const actionCell = document.createElement("td");

            // Create Delete button
            const deleteButton =
                document.createElement("button");

            deleteButton.textContent = "🗑️ Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {
                row.remove();
            };

            // Add button to action cell
            actionCell.appendChild(deleteButton);

            // Add cells to row
            row.appendChild(nameCell);
            row.appendChild(rollCell);
            row.appendChild(courseCell);
            row.appendChild(actionCell);

            // Add row to table
            table.appendChild(row);

            // Clear input fields
            document.getElementById("name").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("course").value = "";

            document.getElementById("name").focus();
        }

    </script>

</body>
</html>
