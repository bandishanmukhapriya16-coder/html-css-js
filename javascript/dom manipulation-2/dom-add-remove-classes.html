<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add and Remove CSS Classes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a189a;
        }

        #box {
            background: #f3e8ff;
            color: #5a189a;
            padding: 25px;
            margin: 25px 0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        /* Class added using JavaScript */
        .highlight {
            background: #fff3cd !important;
            color: #856404 !important;
            border: 4px solid #ffc107;
            transform: scale(1.05);
        }

        button {
            border: none;
            color: white;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .add {
            background: #28a745;
        }

        .remove {
            background: #dc3545;
        }

        .add:hover {
            background: #218838;
        }

        .remove:hover {
            background: #c82333;
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #5a189a;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Add & Remove Classes</h1>

        <p id="status">
            The <b>highlight</b> class is not applied.
        </p>

        <div id="box">
            ✨ This box can be styled using CSS classes.
        </div>

        <button class="add" onclick="addClass()">
            ➕ Add Class
        </button>

        <button class="remove" onclick="removeClass()">
            ➖ Remove Class
        </button>

        <div class="back">

            <a href="../index.html">
                ← Back to JavaScript Index
            </a>

            <br><br>

            <a href="../../index.html">
                ← Back to Main Index
            </a>

        </div>

    </div>

    <script>

        function addClass() {

            const box = document.getElementById("box");

            box.classList.add("highlight");

            document.getElementById("status").innerHTML =
                "✅ The <b>highlight</b> class has been added.";

        }

        function removeClass() {

            const box = document.getElementById("box");

            box.classList.remove("highlight");

            document.getElementById("status").innerHTML =
                "❌ The <b>highlight</b> class has been removed.";

        }

    </script>

</body>
</html>
