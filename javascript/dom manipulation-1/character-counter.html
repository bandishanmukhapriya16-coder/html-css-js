<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e84393;
        }

        textarea {
            width: 90%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e84393;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
        }

        .counter {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #6c5ce7;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>📝 Live Character Counter</h1>

        <textarea id="message"
            placeholder="Type something here..."></textarea>

        <div class="counter">
            Characters: <span id="count">0</span>
        </div>
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const message = document.getElementById("message");
        const count = document.getElementById("count");

        message.addEventListener("input", function() {
            count.textContent = message.value.length;
        });
    </script>

</body>
</html>
