<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Show Hide</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            text-align: center;
            padding: 60px 20px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        input {
            width: 75%;
            padding: 13px;
            border: 2px solid #6c5ce7;
            border-radius: 10px;
            font-size: 16px;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #e84393;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6c5ce7;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🔐 Password Show / Hide</h1>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <br>

        <button onclick="togglePassword()">
            👁 Show / Hide
        </button>
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
