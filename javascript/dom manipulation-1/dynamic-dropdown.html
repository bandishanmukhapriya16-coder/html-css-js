<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            text-align: center;
            padding: 60px 20px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
        }

        select {
            width: 80%;
            padding: 14px;
            margin: 20px 0;
            border: 2px solid #6c5ce7;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #e84393;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6c5ce7;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00b894;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>📋 Dynamic Dropdown</h1>

        <select id="course">
            <option value="">Select a Course</option>
        </select>

        <br>

        <button onclick="showCourse()">Show Selection</button>

        <div id="result"></div>
    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const courses = [
            "Computer Science",
            "Artificial Intelligence",
            "Data Science",
            "Cyber Security",
            "Web Development"
        ];

        const dropdown = document.getElementById("course");

        courses.forEach(function(course) {
            const option = document.createElement("option");

            option.textContent = course;
            option.value = course;

            dropdown.appendChild(option);
        });

        function showCourse() {
            const selected = dropdown.value;
            const result = document.getElementById("result");

            if (selected === "") {
                result.textContent = "Please select a course.";
            } else {
                result.textContent = "You selected: " + selected;
            }
        }
    </script>

</body>
</html>
