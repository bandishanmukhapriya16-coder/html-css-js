<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dependent Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c5ce7;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 10%;
            font-weight: bold;
            color: #444;
        }

        select {
            width: 80%;
            padding: 13px;
            border: 2px solid #6c5ce7;
            border-radius: 10px;
            font-size: 16px;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #dff9fb;
            border-radius: 10px;
            color: #0984e3;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌍 Dependent Dropdown</h1>

        <label for="country">Country:</label>
        <select id="country">
            <option value="">Select Country</option>
        </select>

        <label for="state">State:</label>
        <select id="state">
            <option value="">Select State</option>
        </select>

        <label for="city">City:</label>
        <select id="city">
            <option value="">Select City</option>
        </select>

        <div id="result">
            Select your location.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const data = {
            India: {
                TamilNadu: ["Chennai", "Coimbatore", "Madurai"],
                Karnataka: ["Bengaluru", "Mysuru", "Mangaluru"]
            },

            USA: {
                California: ["Los Angeles", "San Francisco", "San Diego"],
                Texas: ["Houston", "Dallas", "Austin"]
            },

            Australia: {
                Victoria: ["Melbourne", "Geelong"],
                Queensland: ["Brisbane", "Cairns"]
            }
        };

        const country = document.getElementById("country");
        const state = document.getElementById("state");
        const city = document.getElementById("city");
        const result = document.getElementById("result");

        // Add countries dynamically
        for (let countryName in data) {
            const option = document.createElement("option");

            option.value = countryName;
            option.textContent = countryName;

            country.appendChild(option);
        }

        // Country selection
        country.addEventListener("change", function() {

            state.innerHTML = '<option value="">Select State</option>';
            city.innerHTML = '<option value="">Select City</option>';

            const selectedCountry = country.value;

            if (selectedCountry !== "") {

                for (let stateName in data[selectedCountry]) {

                    const option = document.createElement("option");

                    option.value = stateName;
                    option.textContent = stateName;

                    state.appendChild(option);
                }
            }

            result.textContent = "Select your state.";
        });

        // State selection
        state.addEventListener("change", function() {

            city.innerHTML = '<option value="">Select City</option>';

            const selectedCountry = country.value;
            const selectedState = state.value;

            if (selectedState !== "") {

                const cities = data[selectedCountry][selectedState];

                cities.forEach(function(cityName) {

                    const option = document.createElement("option");

                    option.value = cityName;
                    option.textContent = cityName;

                    city.appendChild(option);
                });
            }

            result.textContent = "Select your city.";
        });

        // City selection
        city.addEventListener("change", function() {

            if (city.value !== "") {
                result.textContent =
                    "Selected: " +
                    country.value + " → " +
                    state.value + " → " +
                    city.value;
            }
        });
    </script>

</body>
</html>
