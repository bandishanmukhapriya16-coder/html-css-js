<!DOCTYPE html>
<html>
<head>
    <title>Online Offline Updates</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 35px;
            max-width: 550px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #117864;
        }

        #status {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .online {
            background: #d5f5e3;
            color: #196f3d;
        }

        .offline {
            background: #fadbd8;
            color: #922b21;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #117864;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌐 Internet Status Monitor</h1>

        <p>
            This program automatically updates when your
            internet connection changes.
        </p>

        <div id="status"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>
        const status = document.getElementById("status");

        function showOnline() {
            status.textContent = "🟢 You are Online";
            status.className = "online";
        }

        function showOffline() {
            status.textContent = "🔴 You are Offline";
            status.className = "offline";
        }

        // Check the current status
        if (navigator.onLine) {
            showOnline();
        } else {
            showOffline();
        }

        // Detect when the connection comes back
        window.addEventListener("online", showOnline);

        // Detect when the connection is lost
        window.addEventListener("offline", showOffline);
    </script>

</body>
</html>
