<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser Window Object</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            color: #5a3dbb;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .info-box {
            background: #f3efff;
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
        }

        .info-box p {
            margin: 12px 0;
            color: #333;
        }

        .value {
            color: #6a42d8;
            font-weight: bold;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            background: #6a42d8;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4c2aa8;
            transform: scale(1.05);
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            text-decoration: none;
            color: #6a42d8;
            font-weight: bold;
        }

        .back a:hover {
            color: #ff4081;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🪟 JavaScript Window Object</h1>

        <p>
            This page demonstrates some useful properties and methods
            of the JavaScript Window Object.
        </p>

        <div class="info-box">

            <p>
                🌐 Window Width:
                <span class="value" id="width">-</span> px
            </p>

            <p>
                📏 Window Height:
                <span class="value" id="height">-</span> px
            </p>

            <p>
                📄 Page Title:
                <span class="value" id="title">-</span>
            </p>

            <p>
                🔗 Current URL:
                <span class="value" id="url">-</span>
            </p>

        </div>

        <button onclick="showAlert()">
            🔔 Show Alert
        </button>

        <button onclick="openNewWindow()">
            🪟 Open New Window
        </button>

        <button onclick="closeWindow()">
            ❌ Close Window
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Display window width and height
        document.getElementById("width").textContent = window.innerWidth;

        document.getElementById("height").textContent = window.innerHeight;

        // Display page title
        document.getElementById("title").textContent = window.document.title;

        // Display current URL
        document.getElementById("url").textContent = window.location.href;


        // Show alert using Window Object
        function showAlert() {
            window.alert("Hello! This alert is created using the Window Object.");
        }


        // Open a new browser window
        function openNewWindow() {
            window.open(
                "https://www.google.com",
                "_blank",
                "width=600,height=400"
            );
        }


        // Close the current window
        function closeWindow() {
            window.close();
        }

    </script>

</body>
</html>
