<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>setTimeout Example</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #0072ff;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #0072ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #0056c7;
            transform: scale(1.05);
        }

        #message {
            margin: 25px 0;
            padding: 20px;
            background: #eaf6ff;
            border-radius: 12px;
            color: #0066cc;
            font-weight: bold;
            min-height: 25px;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #0072ff;
            font-weight: bold;
        }

        .back a:hover {
            color: #ff4081;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⏳ setTimeout() Example</h1>

        <p>
            Click the button and wait for <b>3 seconds</b>.
            The message will appear after the delay.
        </p>

        <button onclick="startTimer()">
            ▶ Start Timer
        </button>

        <button onclick="cancelTimer()">
            ❌ Cancel Timer
        </button>

        <div id="message">
            Timer has not started yet.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let timer;

        function startTimer() {

            document.getElementById("message").textContent =
                "⏳ Timer started... Please wait 3 seconds.";

            // Execute the function after 3 seconds
            timer = setTimeout(function() {

                document.getElementById("message").textContent =
                    "🎉 3 seconds completed! setTimeout() executed successfully.";

            }, 3000);
        }


        function cancelTimer() {

            clearTimeout(timer);

            document.getElementById("message").textContent =
                "🛑 Timer cancelled.";
        }

    </script>

</body>
</html>
