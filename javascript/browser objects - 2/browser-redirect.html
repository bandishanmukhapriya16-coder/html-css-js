<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Redirection</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #e67e00;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .info {
            background: #fff8e6;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }

        #message {
            color: #b35c00;
            font-weight: bold;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            background: #e67e00;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b85c00;
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #e67e00;
            font-weight: bold;
        }

        .back a:hover {
            color: #673ab7;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔀 Page Redirection</h1>

        <p>
            This program demonstrates how JavaScript can
            redirect the browser to another webpage.
        </p>

        <div class="info">
            <p id="message">
                Click the button below to redirect to Google.
            </p>
        </div>

        <button onclick="redirectPage()">
            🌐 Go to Google
        </button>

        <button onclick="showCurrentPage()">
            📄 Show Current Page
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Redirect the browser
        function redirectPage() {

            document.getElementById("message").textContent =
                "🌐 Redirecting to Google...";

            window.location.href = "https://www.google.com";
        }


        // Display current page URL
        function showCurrentPage() {

            document.getElementById("message").textContent =
                "📄 Current Page: " + window.location.href;
        }

    </script>

</body>
</html>
