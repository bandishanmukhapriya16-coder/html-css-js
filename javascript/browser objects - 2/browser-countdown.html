<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown Timer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #e64a19;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        #timer {
            margin: 30px 0;
            padding: 25px;
            background: #fff3ed;
            border-radius: 15px;
            color: #e64a19;
            font-size: 55px;
            font-weight: bold;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            background: #e64a19;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #bf360c;
            transform: scale(1.05);
        }

        .reset {
            background: #607d8b;
        }

        .reset:hover {
            background: #455a64;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #fff8f5;
            color: #555;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #e64a19;
            font-weight: bold;
        }

        .back a:hover {
            color: #673ab7;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⏳ Countdown Timer</h1>

        <p>
            Start the countdown and watch the timer decrease every second.
        </p>

        <div id="timer">00:10</div>

        <button onclick="startCountdown()">
            ▶ Start
        </button>

        <button onclick="pauseCountdown()">
            ⏸ Pause
        </button>

        <button class="reset" onclick="resetCountdown()">
            🔄 Reset
        </button>

        <div id="message">
            Timer is ready.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let timeLeft = 10;
        let countdown;


        // Display the timer
        function displayTime() {

            let seconds = String(timeLeft).padStart(2, "0");

            document.getElementById("timer").textContent =
                "00:" + seconds;
        }


        // Start countdown
        function startCountdown() {

            if (countdown) {
                return;
            }

            document.getElementById("message").textContent =
                "🟢 Countdown is running...";

            countdown = setInterval(function() {

                timeLeft--;

                displayTime();

                if (timeLeft <= 0) {

                    clearInterval(countdown);
                    countdown = null;

                    document.getElementById("message").textContent =
                        "🎉 Time's up!";

                }

            }, 1000);
        }


        // Pause countdown
        function pauseCountdown() {

            clearInterval(countdown);
            countdown = null;

            document.getElementById("message").textContent =
                "⏸ Countdown paused.";
        }


        // Reset countdown
        function resetCountdown() {

            clearInterval(countdown);
            countdown = null;

            timeLeft = 10;

            displayTime();

            document.getElementById("message").textContent =
                "🔄 Timer reset to 10 seconds.";
        }


        // Display initial value
        displayTime();

    </script>

</body>
</html>
