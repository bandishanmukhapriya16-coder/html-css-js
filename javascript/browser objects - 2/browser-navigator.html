<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navigator Object</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #d81b60;
        }

        .info {
            margin-top: 25px;
            background: #fff1f7;
            padding: 20px;
            border-radius: 15px;
        }

        .info p {
            padding: 10px;
            margin: 8px 0;
            border-bottom: 1px solid #f3c2d8;
            word-break: break-word;
        }

        .label {
            font-weight: bold;
            color: #d81b60;
        }

        .value {
            color: #444;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #d81b60;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ad1457;
            transform: scale(1.05);
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #d81b60;
            font-weight: bold;
        }

        .back a:hover {
            color: #673ab7;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌐 JavaScript Navigator Object</h1>

        <div class="info">

            <p>
                <span class="label">Browser:</span>
                <span class="value" id="browser"></span>
            </p>

            <p>
                <span class="label">Platform:</span>
                <span class="value" id="platform"></span>
            </p>

            <p>
                <span class="label">Language:</span>
                <span class="value" id="language"></span>
            </p>

            <p>
                <span class="label">Online Status:</span>
                <span class="value" id="online"></span>
            </p>

            <p>
                <span class="label">Cookies Enabled:</span>
                <span class="value" id="cookies"></span>
            </p>

        </div>

        <button onclick="showNavigatorInfo()">
            🔍 Show Browser Information
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showNavigatorInfo() {

            // Browser information
            document.getElementById("browser").textContent =
                navigator.userAgent;

            // Operating system/platform
            document.getElementById("platform").textContent =
                navigator.platform;

            // Browser language
            document.getElementById("language").textContent =
                navigator.language;

            // Internet connection status
            document.getElementById("online").textContent =
                navigator.onLine ? "Online 🟢" : "Offline 🔴";

            // Cookies status
            document.getElementById("cookies").textContent =
                navigator.cookieEnabled ? "Enabled ✅" : "Disabled ❌";
        }


        // Display information when the page loads
        showNavigatorInfo();

    </script>

</body>
</html>
