<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Stopwatch</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #5a3dbb;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        #display {
            margin: 30px 0;
            padding: 25px;
            background: #f2efff;
            border-radius: 15px;
            color: #5a3dbb;
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        button {
            padding: 13px 24px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .start {
            background: #28a745;
        }

        .pause {
            background: #ff9800;
        }

        .reset {
            background: #e63946;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8ff;
            border-radius: 10px;
            color: #555;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #5a3dbb;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⏱️ JavaScript Stopwatch</h1>

        <p>
            Start, pause, and reset the stopwatch.
        </p>

        <div id="display">00:00:00</div>

        <button class="start" onclick="startStopwatch()">
            ▶ Start
        </button>

        <button class="pause" onclick="pauseStopwatch()">
            ⏸ Pause
        </button>

        <button class="reset" onclick="resetStopwatch()">
            🔄 Reset
        </button>

        <div id="status">
            Stopwatch is ready.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let seconds = 0;
        let interval = null;


        // Display stopwatch time
        function updateDisplay() {

            let hours = Math.floor(seconds / 3600);

            let minutes = Math.floor((seconds % 3600) / 60);

            let remainingSeconds = seconds % 60;


            hours = String(hours).padStart(2, "0");

            minutes = String(minutes).padStart(2, "0");

            remainingSeconds =
                String(remainingSeconds).padStart(2, "0");


            document.getElementById("display").textContent =
                hours + ":" + minutes + ":" + remainingSeconds;
        }


        // Start stopwatch
        function startStopwatch() {

            if (interval !== null) {
                return;
            }

            document.getElementById("status").textContent =
                "🟢 Stopwatch is running...";

            interval = setInterval(function() {

                seconds++;

                updateDisplay();

            }, 1000);
        }


        // Pause stopwatch
        function pauseStopwatch() {

            clearInterval(interval);

            interval = null;

            document.getElementById("status").textContent =
                "⏸ Stopwatch paused.";
        }


        // Reset stopwatch
        function resetStopwatch() {

            clearInterval(interval);

            interval = null;

            seconds = 0;

            updateDisplay();

            document.getElementById("status").textContent =
                "🔄 Stopwatch reset.";
        }


        // Initial display
        updateDisplay();

    </script>

</body>
</html>
