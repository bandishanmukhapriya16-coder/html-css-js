<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser Information</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #087ea4;
        }

        p.intro {
            text-align: center;
            color: #555;
            font-size: 17px;
        }

        .info {
            margin-top: 25px;
            padding: 20px;
            background: #eefaff;
            border-radius: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 5px;
            border-bottom: 1px solid #c8eaf4;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #087ea4;
        }

        .value {
            color: #333;
            text-align: right;
            word-break: break-word;
            max-width: 65%;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #087ea4;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #05566f;
            transform: scale(1.05);
        }

        .back {
            text-align: center;
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #087ea4;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖥️ Browser Information</h1>

        <p class="intro">
            This page displays information about your browser
            using the JavaScript Navigator Object.
        </p>

        <div class="info">

            <div class="row">
                <span class="label">Browser User Agent</span>
                <span class="value" id="userAgent"></span>
            </div>

            <div class="row">
                <span class="label">Platform</span>
                <span class="value" id="platform"></span>
            </div>

            <div class="row">
                <span class="label">Language</span>
                <span class="value" id="language"></span>
            </div>

            <div class="row">
                <span class="label">Cookies Enabled</span>
                <span class="value" id="cookies"></span>
            </div>

            <div class="row">
                <span class="label">Online Status</span>
                <span class="value" id="online"></span>
            </div>

        </div>

        <button onclick="displayBrowserInfo()">
            🔍 Refresh Information
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function displayBrowserInfo() {

            document.getElementById("userAgent").textContent =
                navigator.userAgent;

            document.getElementById("platform").textContent =
                navigator.platform;

            document.getElementById("language").textContent =
                navigator.language;

            document.getElementById("cookies").textContent =
                navigator.cookieEnabled
                    ? "Enabled ✅"
                    : "Disabled ❌";

            document.getElementById("online").textContent =
                navigator.onLine
                    ? "Online 🟢"
                    : "Offline 🔴";
        }


        // Display information when the page loads
        displayBrowserInfo();

    </script>

</body>
</html>
