<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Object</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #2878c8;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .info {
            margin: 25px 0;
            padding: 20px;
            background: #eef8ff;
            border-radius: 15px;
            text-align: left;
        }

        .info p {
            margin: 14px 0;
            word-break: break-all;
            color: #333;
        }

        .value {
            color: #2878c8;
            font-weight: bold;
        }

        button {
            padding: 13px 24px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            background: #2878c8;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #155a9c;
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #2878c8;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📍 JavaScript Location Object</h1>

        <p>
            The Location Object provides information about the
            current webpage address.
        </p>

        <div class="info">

            <p>
                🌐 Full URL:
                <span class="value" id="url"></span>
            </p>

            <p>
                📄 Host:
                <span class="value" id="host"></span>
            </p>

            <p>
                🔗 Path:
                <span class="value" id="path"></span>
            </p>

            <p>
                🔒 Protocol:
                <span class="value" id="protocol"></span>
            </p>

        </div>

        <button onclick="showURL()">
            🔄 Show Current URL
        </button>

        <button onclick="reloadPage()">
            ♻️ Reload Page
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Display current URL information
        function showURL() {

            document.getElementById("url").textContent =
                window.location.href;

            document.getElementById("host").textContent =
                window.location.host;

            document.getElementById("path").textContent =
                window.location.pathname;

            document.getElementById("protocol").textContent =
                window.location.protocol;
        }


        // Reload the current webpage
        function reloadPage() {

            window.location.reload();
        }


        // Display information when page loads
        showURL();

    </script>

</body>
</html>
