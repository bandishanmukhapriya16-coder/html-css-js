<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current URL</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #185a9d;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .url-box {
            margin: 25px 0;
            padding: 22px;
            background: #eef9f6;
            border-radius: 15px;
            border: 2px solid #43cea2;
            word-break: break-all;
        }

        #url {
            color: #185a9d;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            background: #185a9d;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0d3d6b;
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            text-decoration: none;
            color: #185a9d;
            font-weight: bold;
        }

        .back a:hover {
            color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔗 Current Page URL</h1>

        <p>
            Click the button to display the URL of the current webpage.
        </p>

        <div class="url-box">
            <div id="url">
                URL will appear here.
            </div>
        </div>

        <button onclick="showURL()">
            🔍 Show Current URL
        </button>

        <button onclick="copyURL()">
            📋 Copy URL
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        // Display the current URL
        function showURL() {

            document.getElementById("url").textContent =
                window.location.href;
        }


        // Copy the current URL
        function copyURL() {

            let currentURL = window.location.href;

            navigator.clipboard.writeText(currentURL)
                .then(function() {

                    document.getElementById("url").textContent =
                        "✅ URL copied successfully!";

                })
                .catch(function() {

                    document.getElementById("url").textContent =
                        currentURL;
                });
        }


        // Display URL when page loads
        showURL();

    </script>

</body>
</html>
