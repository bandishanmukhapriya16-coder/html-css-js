<!DOCTYPE html>
<html>
<head>
    <title>Double Click Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #7b2cbf;
        }

        #count {
            font-size: 60px;
            font-weight: bold;
            color: #e85d75;
            margin: 25px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #7b2cbf;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            margin-top: 20px;
            color: #555;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Double-Click Counter</h1>

        <p>Double-click the button to increase the counter.</p>

        <div id="count">0</div>

        <button id="doubleClickButton">
            🖱️ Double-Click Me
        </button>

        <div id="message">
            Waiting for a double-click...
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let count = 0;

        let button = document.getElementById("doubleClickButton");
        let countDisplay = document.getElementById("count");
        let message = document.getElementById("message");

        button.addEventListener("dblclick", function() {

            count++;

            countDisplay.textContent = count;

            message.textContent =
                "🎉 Double-click detected! Total: " + count;

        });

    </script>

</body>
</html>
