<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #388e3c;
        }

        input {
            width: 85%;
            padding: 15px;
            margin-top: 25px;
            border: 2px solid #66bb6a;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #2e7d32;
            background: #f1f8e9;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            background: #e8f5e9;
            color: #1b5e20;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            word-wrap: break-word;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #388e3c;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⌨️ Input Event</h1>

        <p>
            Type in the box and see the text update instantly.
        </p>

        <input
            type="text"
            id="textBox"
            placeholder="Start typing..."
            oninput="displayText()"
        >

        <div id="result">
            Your text will appear here...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function displayText() {

            let text =
                document.getElementById("textBox").value;

            if (text === "") {

                document.getElementById("result").innerText =
                    "Your text will appear here...";

            } else {

                document.getElementById("result").innerText =
                    "You typed: " + text;
            }
        }

    </script>

</body>
</html>
