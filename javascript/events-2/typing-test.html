<!DOCTYPE html>
<html>
<head>
    <title>Typing Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #168aad;
        }

        .sentence {
            background: #e3fafc;
            padding: 20px;
            border-radius: 12px;
            color: #0b7285;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.6;
        }

        textarea {
            width: 90%;
            height: 120px;
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #90e0ef;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #168aad;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }

        .stat {
            background: #f1f3f5;
            padding: 15px 20px;
            border-radius: 12px;
            color: #168aad;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #168aad;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b7285;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⌨️ Typing Test</h1>

        <p>Type the sentence shown below.</p>

        <div class="sentence">
            JavaScript makes webpages interactive and dynamic.
        </div>

        <textarea
            id="typingArea"
            placeholder="Start typing here..."
        ></textarea>

        <div class="stats">

            <div class="stat">
                Characters:
                <span id="characters">0</span>
            </div>

            <div class="stat">
                Words:
                <span id="words">0</span>
            </div>

        </div>

        <button id="checkButton">
            ✅ Check Typing
        </button>

        <button id="resetButton">
            🔄 Reset
        </button>

        <div id="result">
            Start typing to begin!
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let typingArea = document.getElementById("typingArea");
        let characters = document.getElementById("characters");
        let words = document.getElementById("words");
        let result = document.getElementById("result");

        let targetText =
            "JavaScript makes webpages interactive and dynamic.";

        // Input event
        typingArea.addEventListener("input", function() {

            let text = typingArea.value;

            characters.textContent = text.length;

            let wordCount = text.trim() === ""
                ? 0
                : text.trim().split(/\s+/).length;

            words.textContent = wordCount;

        });


        // Check button
        document.getElementById("checkButton")
            .addEventListener("click", function() {

                let typedText = typingArea.value.trim();

                if (typedText === targetText) {

                    result.textContent =
                        "🎉 Excellent! You typed the sentence correctly.";

                } else {

                    result.textContent =
                        "❌ The typed text does not match. Try again!";

                }

            });


        // Reset button
        document.getElementById("resetButton")
            .addEventListener("click", function() {

                typingArea.value = "";
                characters.textContent = "0";
                words.textContent = "0";

                result.textContent =
                    "🔄 Test has been reset. Start typing!";

            });

    </script>

</body>
</html>
