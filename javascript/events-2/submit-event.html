<!DOCTYPE html>
<html>
<head>
    <title>Submit Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #5a3fc0;
        }

        p {
            color: #555;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a3fc0;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #28a745;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📩 Submit Event</h1>

        <p>Enter your name and submit the form.</p>

        <form id="myForm">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <br>

            <button type="submit">Submit Form</button>

        </form>

        <div id="message"></div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        document.getElementById("myForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;

            document.getElementById("message").textContent =
                "✅ Form submitted successfully, " + name + "!";

        });

    </script>

</body>
</html>
