<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onclick Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #e53935;
        }

        #message {
            margin: 25px 0;
            padding: 20px;
            background: #ffebee;
            color: #c62828;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #e53935;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Onclick Event</h1>

        <p>Click the button to trigger a JavaScript event.</p>

        <div id="message">
            Waiting for button click...
        </div>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showMessage() {

            document.getElementById("message").innerText =
                "🎉 Button was clicked successfully!";

        }

    </script>

</body>
</html>
