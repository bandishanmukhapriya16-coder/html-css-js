<!DOCTYPE html>
<html>
<head>
    <title>Multiple Buttons with Different Handlers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6c3483;
        }

        p {
            color: #555;
        }

        button {
            padding: 13px 22px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .hello {
            background: #3498db;
        }

        .date {
            background: #27ae60;
        }

        .color {
            background: #e67e22;
        }

        .reset {
            background: #e74c3c;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #f3e5f5;
            color: #6c3483;
            font-weight: bold;
            min-height: 25px;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔘 Multiple Buttons</h1>

        <p>Each button has a different JavaScript handler.</p>

        <button class="hello" onclick="sayHello()">
            👋 Say Hello
        </button>

        <button class="date" onclick="showDate()">
            📅 Show Date
        </button>

        <button class="color" onclick="changeColor()">
            🎨 Change Color
        </button>

        <button class="reset" onclick="resetPage()">
            🔄 Reset
        </button>

        <div id="message">
            Click any button!
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function sayHello() {

            document.getElementById("message").textContent =
                "👋 Hello! Welcome to JavaScript Events.";

        }

        function showDate() {

            let today = new Date();

            document.getElementById("message").textContent =
                "📅 Today is " + today.toLocaleDateString();

        }

        function changeColor() {

            document.body.style.background =
                "linear-gradient(135deg, #84fab0, #8fd3f4)";

            document.getElementById("message").textContent =
                "🎨 Background color changed!";

        }

        function resetPage() {

            document.body.style.background =
                "linear-gradient(135deg, #a18cd1, #fbc2eb)";

            document.getElementById("message").textContent =
                "🔄 Page has been reset!";

        }

    </script>

</body>
</html>
