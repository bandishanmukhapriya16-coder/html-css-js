<!DOCTYPE html>
<html>
<head>
    <title>removeEventListener Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #5a3fc0;
        }

        #message {
            margin: 25px 0;
            padding: 20px;
            border-radius: 12px;
            background: #f3e5f5;
            color: #5a3fc0;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .start {
            background: #28a745;
        }

        .stop {
            background: #e74c3c;
        }

        button:hover {
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎯 removeEventListener()</h1>

        <p>Start the click event, then remove it.</p>

        <button class="start" id="startButton">
            ▶ Start Event
        </button>

        <button class="stop" id="stopButton">
            ⏹ Remove Event
        </button>

        <div id="message">
            Event is not active.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let message = document.getElementById("message");

        // Event function
        function showMessage() {

            message.textContent =
                "🖱️ The click event is working!";

        }

        // Add event listener
        document.getElementById("startButton")
            .addEventListener("click", function() {

                message.textContent =
                    "✅ Click event has been added. Click this message!";

                message.addEventListener("click", showMessage);

            });

        // Remove event listener
        document.getElementById("stopButton")
            .addEventListener("click", function() {

                message.removeEventListener("click", showMessage);

                message.textContent =
                    "❌ Click event has been removed.";

            });

    </script>

</body>
</html>
