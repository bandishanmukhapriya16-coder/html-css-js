<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouseover and Mouseout Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #0066cc;
        }

        #box {
            margin: 30px auto;
            width: 250px;
            padding: 60px 20px;
            background: #e3f2fd;
            color: #0d47a1;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        #message {
            font-size: 18px;
            color: #333;
            margin-top: 20px;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Mouseover & Mouseout</h1>

        <p>
            Move your mouse over the box and then move it away.
        </p>

        <div
            id="box"
            onmouseover="mouseOver()"
            onmouseout="mouseOut()"
        >
            Move Mouse Here
        </div>

        <div id="message">
            Waiting for mouse action...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function mouseOver() {

            let box = document.getElementById("box");

            box.style.background = "#81d4fa";
            box.style.transform = "scale(1.08)";
            box.innerText = "🎉 Mouse is Over!";

            document.getElementById("message").innerText =
                "Mouseover event occurred.";
        }


        function mouseOut() {

            let box = document.getElementById("box");

            box.style.background = "#e3f2fd";
            box.style.transform = "scale(1)";
            box.innerText = "Move Mouse Here";

            document.getElementById("message").innerText =
                "Mouseout event occurred.";
        }

    </script>

</body>
</html>
