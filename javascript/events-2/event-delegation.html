<!DOCTYPE html>
<html>
<head>
    <title>Event Delegation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #168aad;
        }

        #courseList {
            list-style: none;
            padding: 0;
        }

        #courseList li {
            background: #e3fafc;
            color: #0b7285;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #courseList li:hover {
            background: #99e9f2;
            transform: scale(1.03);
        }

        #message {
            margin-top: 25px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 12px;
            color: #555;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎯 Event Delegation</h1>

        <p>Click any course below.</p>

        <ul id="courseList">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
            <li>Java</li>
        </ul>

        <div id="message">
            Select a course.
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let courseList = document.getElementById("courseList");

        // One event listener handles all list items
        courseList.addEventListener("click", function(event) {

            if (event.target.tagName === "LI") {

                document.getElementById("message").textContent =
                    "✅ You selected: " + event.target.textContent;

                event.target.style.background = "#b2f2bb";

            }

        });

    </script>

</body>
</html>
