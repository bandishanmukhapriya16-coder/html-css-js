<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Font Size</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #5a3fc0;
        }

        #text {
            font-size: 24px;
            margin: 30px 0;
            color: #333;
            transition: 0.3s;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .increase {
            background: #28a745;
        }

        .decrease {
            background: #e74c3c;
        }

        .reset {
            background: #667eea;
        }

        button:hover {
            transform: scale(1.05);
        }

        #size {
            font-weight: bold;
            color: #5a3fc0;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔤 Dynamic Font Size</h1>

        <p id="text">
            JavaScript can change the font size dynamically!
        </p>

        <p>Current Font Size: <span id="size">24</span>px</p>

        <button class="increase" onclick="increaseFont()">
            ➕ Increase
        </button>

        <button class="decrease" onclick="decreaseFont()">
            ➖ Decrease
        </button>

        <button class="reset" onclick="resetFont()">
            🔄 Reset
        </button>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let fontSize = 24;

        function increaseFont() {

            if (fontSize < 50) {
                fontSize += 2;
            }

            updateFont();

        }

        function decreaseFont() {

            if (fontSize > 12) {
                fontSize -= 2;
            }

            updateFont();

        }

        function resetFont() {

            fontSize = 24;
            updateFont();

        }

        function updateFont() {

            document.getElementById("text").style.fontSize =
                fontSize + "px";

            document.getElementById("size").textContent =
                fontSize;

        }

    </script>

</body>
</html>
