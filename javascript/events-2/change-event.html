<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #d81b60;
        }

        select {
            width: 80%;
            padding: 14px;
            margin-top: 25px;
            border: 2px solid #d81b60;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            background: #fce4ec;
            color: #ad1457;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔄 Change Event</h1>

        <p>Select a course from the dropdown.</p>

        <select id="course" onchange="showCourse()">
            <option value="">-- Select Course --</option>
            <option value="CSE">Computer Science</option>
            <option value="AI">Artificial Intelligence</option>
            <option value="DS">Data Science</option>
            <option value="Cyber Security">Cyber Security</option>
        </select>

        <div id="result">
            No course selected.
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showCourse() {

            let course =
                document.getElementById("course").value;

            if (course === "") {

                document.getElementById("result").innerText =
                    "No course selected.";

            } else {

                document.getElementById("result").innerText =
                    "✅ Selected Course: " + course;
            }
        }

    </script>

</body>
</html>
