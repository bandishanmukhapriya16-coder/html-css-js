<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keydown Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #ef6c00;
        }

        input {
            width: 85%;
            padding: 15px;
            margin-top: 25px;
            border: 2px solid #ef6c00;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #e65100;
        }

        #message {
            margin-top: 25px;
            padding: 18px;
            background: #fff3e0;
            color: #e65100;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #ef6c00;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⌨️ Keydown Event</h1>

        <p>Press any key inside the input box.</p>

        <input
            type="text"
            id="textBox"
            placeholder="Press a key..."
            onkeydown="showKey(event)"
        >

        <div id="message">
            Waiting for a key...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showKey(event) {

            document.getElementById("message").innerText =
                "🔑 Key pressed: " + event.key;
        }

    </script>

</body>
</html>
