<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mousemove Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #1565c0;
        }

        #area {
            height: 280px;
            margin-top: 25px;
            border: 3px dashed #1565c0;
            border-radius: 15px;
            background: #e3f2fd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d47a1;
            font-size: 20px;
            font-weight: bold;
            cursor: crosshair;
        }

        #coordinates {
            margin-top: 20px;
            padding: 15px;
            background: #bbdefb;
            color: #0d47a1;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Mousemove Event</h1>

        <p>Move your mouse inside the box to see the coordinates.</p>

        <div id="area" onmousemove="showCoordinates(event)">
            Move Mouse Here
        </div>

        <div id="coordinates">
            X: 0 | Y: 0
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showCoordinates(event) {

            let x = event.clientX;
            let y = event.clientY;

            document.getElementById("coordinates").innerText =
                "X: " + x + " | Y: " + y;
        }

    </script>

</body>
</html>
