<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Down and Mouse Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #d81b60;
        }

        #box {
            width: 280px;
            margin: 30px auto;
            padding: 60px 20px;
            background: #fce4ec;
            color: #ad1457;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            transition: 0.2s;
            user-select: none;
        }

        #message {
            padding: 15px;
            background: #fff3e0;
            color: #e65100;
            border-radius: 10px;
            font-size: 18px;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Mouse Down & Mouse Up</h1>

        <p>
            Press and hold the mouse button on the box.
        </p>

        <div
            id="box"
            onmousedown="mouseDown()"
            onmouseup="mouseUp()"
        >
            Press Mouse Here
        </div>

        <div id="message">
            Waiting for mouse action...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function mouseDown() {

            let box = document.getElementById("box");

            box.style.background = "#f48fb1";
            box.style.transform = "scale(0.95)";
            box.innerText = "🔽 Mouse Button Pressed!";

            document.getElementById("message").innerText =
                "mousedown event occurred.";
        }


        function mouseUp() {

            let box = document.getElementById("box");

            box.style.background = "#fce4ec";
            box.style.transform = "scale(1)";
            box.innerText = "Press Mouse Here";

            document.getElementById("message").innerText =
                "mouseup event occurred.";
        }

    </script>

</body>
</html>
