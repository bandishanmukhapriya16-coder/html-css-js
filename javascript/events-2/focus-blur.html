<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus and Blur Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #1565c0;
        }

        input {
            width: 85%;
            padding: 15px;
            margin: 12px 0;
            border: 2px solid #90caf9;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1565c0;
            background: #e3f2fd;
            box-shadow: 0 0 8px rgba(21,101,192,0.3);
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            color: #0d47a1;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎯 Focus & Blur Events</h1>

        <p>Click inside an input and then click outside it.</p>

        <input
            type="text"
            placeholder="Enter your name"
            onfocus="showFocus()"
            onblur="showBlur()"
        >

        <input
            type="email"
            placeholder="Enter your email"
            onfocus="showFocus()"
            onblur="showBlur()"
        >

        <div id="message">
            Click an input field...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function showFocus() {

            document.getElementById("message").innerText =
                "🟢 Input field is focused.";
        }


        function showBlur() {

            document.getElementById("message").innerText =
                "🔵 Input field lost focus.";
        }

    </script>

</body>
</html>
