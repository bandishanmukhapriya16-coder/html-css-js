<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Key Press Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #d81b60;
        }

        p {
            color: #555;
        }

        textarea {
            width: 90%;
            height: 150px;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #d81b60;
            border-radius: 10px;
            font-size: 18px;
            resize: none;
            outline: none;
        }

        #counter {
            margin-top: 25px;
            padding: 20px;
            background: #fce4ec;
            color: #ad1457;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⌨️ Keyboard Key Press Counter</h1>

        <p>
            Press any key inside the text box to increase the counter.
        </p>

        <textarea
            id="textBox"
            placeholder="Start typing..."
            onkeydown="countKeyPress()"
        ></textarea>

        <div id="counter">
            Key Presses: 0
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let count = 0;

        function countKeyPress() {

            count++;

            document.getElementById("counter").innerText =
                "⌨️ Key Presses: " + count;
        }

    </script>

</body>
</html>
