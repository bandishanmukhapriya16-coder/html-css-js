<!DOCTYPE html>
<html>
<head>
    <title>Button Background Color</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            transition: 0.5s;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #5a3fc0;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .pink {
            background: #ff4f81;
        }

        .blue {
            background: #4285f4;
        }

        .green {
            background: #28a745;
        }

        .purple {
            background: #8e44ad;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Background Color Changer</h1>

        <p>Click a button to change the background color.</p>

        <button class="pink" onclick="changeColor('pink')">
            Pink
        </button>

        <button class="blue" onclick="changeColor('lightblue')">
            Blue
        </button>

        <button class="green" onclick="changeColor('lightgreen')">
            Green
        </button>

        <button class="purple" onclick="changeColor('lavender')">
            Purple
        </button>

        <div id="message">
            Choose a color!
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        function changeColor(color) {

            document.body.style.background = color;

            document.getElementById("message").textContent =
                "🌈 Background changed to " + color + "!";

        }

    </script>

</body>
</html>
