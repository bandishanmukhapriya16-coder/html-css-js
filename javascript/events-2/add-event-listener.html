<!DOCTYPE html>
<html>
<head>
    <title>addEventListener Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2463c5;
        }

        #message {
            margin: 25px 0;
            padding: 20px;
            background: #eef6ff;
            border-radius: 12px;
            color: #2463c5;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: #2463c5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #174a96;
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎯 addEventListener()</h1>

        <p>Click the button to trigger an event.</p>

        <button id="myButton">
            Click Me
        </button>

        <div id="message">
            Waiting for an event...
        </div>

    </div>

    <div class="back">
        <a href="../index.html">← Back to JavaScript Index</a>
        <br><br>
        <a href="../../index.html">← Back to Main Index</a>
    </div>

    <script>

        let button = document.getElementById("myButton");

        button.addEventListener("click", function() {

            document.getElementById("message").textContent =
                "✅ Button clicked using addEventListener()!";

        });

    </script>

</body>
</html>
