<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 35px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #8e24aa;
        }

        p {
            font-size: 17px;
        }

        input {
            width: 70%;
            padding: 12px;
            margin: 15px;
            border: 2px solid #ce93d8;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #8e24aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6a1b9a;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #e91e63;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #8e24aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🎯 Number Guessing Game</h1>

        <p>Guess a number between <b>1 and 100</b>.</p>

        <input type="number" id="guess" placeholder="Enter your guess">

        <br>

        <button onclick="checkGuess()">Check Guess</button>
        <button onclick="newGame()">New Game</button>

        <div id="result"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let randomNumber = Math.floor(Math.random() * 100) + 1;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);
            let result = document.getElementById("result");

            if (guess < 1 || guess > 100) {
                result.innerHTML = "⚠️ Enter a number between 1 and 100.";
            }
            else if (guess === randomNumber) {
                result.innerHTML = "🎉 Correct! You guessed the number!";
            }
            else if (guess < randomNumber) {
                result.innerHTML = "⬆️ Try a higher number!";
            }
            else {
                result.innerHTML = "⬇️ Try a lower number!";
            }
        }

        function newGame() {

            randomNumber = Math.floor(Math.random() * 100) + 1;

            document.getElementById("guess").value = "";

            document.getElementById("result").innerHTML =
                "🔄 New game started! Guess again.";
        }

    </script>

</body>
</html>
