<!DOCTYPE html>
<html>
<head>
    <title>Change Image on Click</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e91e63;
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin: 20px;
            border: 4px solid #e91e63;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #e91e63;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ad1457;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #e91e63;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🖼️ Change Image on Click</h1>

        <p>Click the button to change the image.</p>

        <img id="myImage"
             src="https://picsum.photos/id/237/300/200"
             alt="Sample Image">

        <br>

        <button onclick="changeImage()">Change Image</button>

        <p id="result"></p>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function changeImage() {

            let image = document.getElementById("myImage");

            image.src = "https://picsum.photos/id/1025/300/200";

            document.getElementById("result").innerHTML =
                "✅ Image changed successfully!";
        }

    </script>

</body>
</html>
