<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 40px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e65100;
        }

        input {
            width: 70%;
            padding: 12px;
            margin: 15px;
            border: 2px solid #ffb74d;
            border-radius: 10px;
            font-size: 16px;
        }

        #display {
            font-size: 55px;
            font-weight: bold;
            color: #e91e63;
            margin: 30px 0;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: #e65100;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #bf360c;
        }

        #message {
            font-size: 18px;
            font-weight: bold;
            color: #00897b;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>⏳ Countdown Timer</h1>

        <input
            type="number"
            id="secondsInput"
            placeholder="Enter seconds"
            min="1"
        >

        <br>

        <button onclick="startCountdown()">
            ▶ Start
        </button>

        <button onclick="resetCountdown()">
            🔄 Reset
        </button>

        <div id="display">00:00</div>

        <div id="message"></div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let timeLeft = 0;
        let timer = null;

        function startCountdown() {

            if (timer !== null) {
                return;
            }

            let input = document.getElementById("secondsInput").value;

            if (input === "" || input <= 0) {
                document.getElementById("message").innerHTML =
                    "⚠️ Please enter a valid number of seconds.";
                return;
            }

            timeLeft = Number(input);

            document.getElementById("message").innerHTML = "";

            displayTime();

            timer = setInterval(function() {

                timeLeft--;

                displayTime();

                if (timeLeft <= 0) {

                    clearInterval(timer);
                    timer = null;

                    document.getElementById("message").innerHTML =
                        "🎉 Time's up!";
                }

            }, 1000);
        }

        function displayTime() {

            let minutes = Math.floor(timeLeft / 60);

            let seconds = timeLeft % 60;

            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("display").innerHTML =
                minutes + ":" + seconds;
        }

        function resetCountdown() {

            clearInterval(timer);

            timer = null;
            timeLeft = 0;

            document.getElementById("display").innerHTML = "00:00";
            document.getElementById("message").innerHTML = "";
            document.getElementById("secondsInput").value = "";
        }

    </script>

</body>
</html>
