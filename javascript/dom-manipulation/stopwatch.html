<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            background: white;
            padding: 40px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e53935;
        }

        #display {
            font-size: 55px;
            font-weight: bold;
            color: #673ab7;
            margin: 30px 0;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .start {
            background: #43a047;
        }

        .stop {
            background: #e53935;
        }

        .reset {
            background: #757575;
        }

        button:hover {
            opacity: 0.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #e53935;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>⏱️ Stopwatch</h1>

        <div id="display">00:00:00</div>

        <button class="start" onclick="startStopwatch()">
            ▶ Start
        </button>

        <button class="stop" onclick="stopStopwatch()">
            ⏹ Stop
        </button>

        <button class="reset" onclick="resetStopwatch()">
            🔄 Reset
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let seconds = 0;
        let timer = null;

        function startStopwatch() {

            if (timer === null) {

                timer = setInterval(function() {

                    seconds++;
                    displayTime();

                }, 1000);
            }
        }

        function stopStopwatch() {

            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {

            stopStopwatch();

            seconds = 0;

            displayTime();
        }

        function displayTime() {

            let hours = Math.floor(seconds / 3600);

            let minutes = Math.floor((seconds % 3600) / 60);

            let secs = seconds % 60;

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            secs = String(secs).padStart(2, "0");

            document.getElementById("display").innerHTML =
                hours + ":" + minutes + ":" + secs;
        }

    </script>

</body>
</html>
