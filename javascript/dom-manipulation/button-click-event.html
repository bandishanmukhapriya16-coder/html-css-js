<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Button Click Event - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9966, #ff5e62, #8e2de2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #d84315;
            font-size: 36px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #d84315, #ff7043);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #fbe9e7;
            color: #d84315;
            border-radius: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #d84315;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #bf360c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖱️ Button Click Event</h1>

        <p>Click the button to trigger a JavaScript event.</p>

        <button onclick="buttonClicked()">
            Click Me
        </button>

        <div class="result" id="result">
            Waiting for button click...
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function buttonClicked() {

            document.getElementById("result").innerHTML =
                "🎉 Button clicked successfully!";

        }

    </script>

</body>

</html>
