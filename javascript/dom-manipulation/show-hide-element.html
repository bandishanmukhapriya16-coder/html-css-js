<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show and Hide Element - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d, #667eea);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #1565c0;
            font-size: 36px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        #message {
            margin: 25px 0;
            padding: 20px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 13px 28px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .show-btn {
            background: #00897b;
        }

        .hide-btn {
            background: #e53935;
        }

        button:hover {
            transform: scale(1.05);
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👁️ Show / Hide Element</h1>

        <p>Use JavaScript to show or hide an HTML element.</p>

        <div id="message">
            🎉 This message can be shown or hidden!
        </div>

        <button class="hide-btn" onclick="hideMessage()">
            Hide
        </button>

        <button class="show-btn" onclick="showMessage()">
            Show
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function hideMessage() {
            document.getElementById("message").style.display = "none";
        }

        function showMessage() {
            document.getElementById("message").style.display = "block";
        }

    </script>

</body>

</html>
