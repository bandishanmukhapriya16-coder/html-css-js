<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            background: white;
            padding: 40px;
            max-width: 500px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1565c0;
        }

        #count {
            font-size: 70px;
            font-weight: bold;
            color: #e91e63;
            margin: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .increase {
            background: #43a047;
        }

        .decrease {
            background: #e53935;
        }

        .reset {
            background: #757575;
        }

        button:hover {
            opacity: 0.8;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🔢 Counter</h1>

        <div id="count">0</div>

        <button class="increase" onclick="increaseCount()">
            ➕ Increase
        </button>

        <button class="decrease" onclick="decreaseCount()">
            ➖ Decrease
        </button>

        <button class="reset" onclick="resetCount()">
            🔄 Reset
        </button>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        let count = 0;

        function increaseCount() {
            count++;
            displayCount();
        }

        function decreaseCount() {
            count--;
            displayCount();
        }

        function resetCount() {
            count = 0;
            displayCount();
        }

        function displayCount() {
            document.getElementById("count").innerHTML = count;
        }

    </script>

</body>
</html>
