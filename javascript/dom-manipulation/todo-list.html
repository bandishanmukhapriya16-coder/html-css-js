<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 35px;
            max-width: 550px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #7b1fa2;
        }

        input {
            width: 65%;
            padding: 12px;
            border: 2px solid #ce93d8;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin-left: 5px;
            border: none;
            border-radius: 10px;
            background: #7b1fa2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4a148c;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: #f3e5f5;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li button {
            background: #e53935;
            margin-left: 10px;
            padding: 8px 12px;
        }

        li button:hover {
            background: #b71c1c;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: #7b1fa2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>📝 To-Do List</h1>

        <input
            type="text"
            id="task"
            placeholder="Enter a task"
        >

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function addTask() {

            let task = document.getElementById("task").value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let list = document.getElementById("taskList");

            let li = document.createElement("li");

            li.innerHTML =
                task +
                '<button onclick="removeTask(this)">Delete</button>';

            list.appendChild(li);

            document.getElementById("task").value = "";
        }

        function removeTask(button) {

            button.parentElement.remove();

        }

    </script>

</body>
</html>
