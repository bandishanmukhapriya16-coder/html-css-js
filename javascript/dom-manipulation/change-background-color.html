<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Background Color - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #673ab7;
            font-size: 36px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 14px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .purple {
            background-color: #673ab7;
        }

        .pink {
            background-color: #e91e63;
        }

        .blue {
            background-color: #2196f3;
        }

        .green {
            background-color: #009688;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f3e5f5;
            color: #673ab7;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #673ab7;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back a:hover {
            background-color: #4527a0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎨 Change Background Color</h1>

        <p>Click a button to change the webpage background color.</p>

        <button class="purple" onclick="changeColor('purple')">
            Purple
        </button>

        <button class="pink" onclick="changeColor('pink')">
            Pink
        </button>

        <button class="blue" onclick="changeColor('blue')">
            Blue
        </button>

        <button class="green" onclick="changeColor('green')">
            Green
        </button>

        <div class="result" id="result">
            Current Color: Default
        </div>

        <div class="back">
            <a href="../index.html">← Back to JavaScript Index</a>
            <br><br>
            <a href="../../index.html">← Back to Main Index</a>
        </div>

    </div>

    <script>

        function changeColor(color) {

            if (color === "purple") {
                document.body.style.background =
                    "linear-gradient(135deg, #667eea, #764ba2)";
            }

            else if (color === "pink") {
                document.body.style.background =
                    "linear-gradient(135deg, #ff758c, #ff7eb3)";
            }

            else if (color === "blue") {
                document.body.style.background =
                    "linear-gradient(135deg, #36d1dc, #5b86e5)";
            }

            else if (color === "green") {
                document.body.style.background =
                    "linear-gradient(135deg, #11998e, #38ef7d)";
            }

            document.getElementById("result").innerHTML =
                "Current Color: " +
                color.charAt(0).toUpperCase() + color.slice(1);
        }

    </script>

</body>

</html>
