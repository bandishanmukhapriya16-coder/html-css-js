<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode using CSS Variables</title>

    <style>
        :root {
            --bg-color: white;
            --text-color: #222;
            --card-color: #f2f2f2;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: 0.5s;
        }

        .container {
            padding: 50px;
            text-align: center;
        }

        .card {
            background-color: var(--card-color);
            padding: 30px;
            margin: 20px auto;
            max-width: 400px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #222;
                --text-color: white;
                --card-color: #333;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Dark Mode</h1>

        <div class="card">
            <h2>CSS Variables</h2>
            <p>This page automatically supports dark mode.</p>
        </div>
    </div>

</body>
