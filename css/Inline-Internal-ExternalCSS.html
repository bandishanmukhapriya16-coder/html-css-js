<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="external-style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            color: green;
            font-size: 22px;
            text-align: center;
        }

        .box {
            background-color: #f4f6fb;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1 style="color: red;">
            Inline CSS
        </h1>

        <p class="internal">
            This paragraph uses Internal CSS.
        </p>

        <p class="external">
            This paragraph uses External CSS.
        </p>

    </div>

</body>
