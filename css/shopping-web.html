<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .product {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
        }

        @media (max-width: 800px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Store</h1>
        <p>Shop your favourite products</p>
    </header>

    <section class="products">

        <div class="product">
            <h3>Smart Watch</h3>
            <p>₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h3>Backpack</h3>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

    </section>

</body>

</html>
