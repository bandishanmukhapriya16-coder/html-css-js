<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
        }

        nav {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
            display: inline-block;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #3498db;
        }

        .content {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">

        <h1>Styled Navigation Bar</h1>

        <p>
            Move the mouse over the navigation links
            to see the hover effect.
        </p>

    </div>

</body>

</html>
