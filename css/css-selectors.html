<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors</title>

    <style>

        /* Element selector */
        p {
            font-size: 18px;
        }

        /* Class selector */
        .highlight {
            color: blue;
            font-weight: bold;
        }

        /* ID selector */
        #special {
            color: red;
            background-color: #ffe6e6;
            padding: 10px;
        }

        /* Group selector */
        h1, h2 {
            color: #2c3e50;
        }

    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>
    <p>This paragraph is styled using an element selector.</p>

    <h2>Class Selector</h2>
    <p class="highlight">
        This paragraph uses a class selector.
    </p>

    <h2>ID Selector</h2>
    <p id="special">
        This paragraph uses an ID selector.
    </p>

</body>
