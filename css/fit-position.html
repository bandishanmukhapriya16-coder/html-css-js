<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit and Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
        }

        .box img {
            width: 300px;
            height: 200px;
            border: 3px solid #3498db;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
        }

        .position {
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>

<body>

    <h1>Object-Fit and Object-Position</h1>

    <div class="container">

        <div class="box">
            <h3>Object Fit: Cover</h3>
            <img class="cover"
                 src="../assets/images/college.jpg"
                 alt="College">
        </div>

        <div class="box">
            <h3>Object Fit: Contain</h3>
            <img class="contain"
                 src="../assets/images/college.jpg"
                 alt="College">
        </div>

        <div class="box">
            <h3>Object Position: Top</h3>
            <img class="position"
                 src="../assets/images/college.jpg"
                 alt="College">
        </div>

    </div>

</body>
