<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        .block {
            display: block;
            background-color: #3498db;
            color: white;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background-color: #2ecc71;
            color: white;
            padding: 15px;
        }

        .inline-block {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 20px;
            margin: 10px;
            width: 150px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <h2>Block</h2>

    <div class="block">Block Element 1</div>
    <div class="block">Block Element 2</div>

    <h2>Inline</h2>

    <span class="inline">Inline Element 1</span>
    <span class="inline">Inline Element 2</span>

    <h2>Inline-Block</h2>

    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <h2>Display None</h2>

    <p class="none">
        This text is hidden using display: none.
    </p>

    <p>The hidden text above is not displayed.</p>

</body>
