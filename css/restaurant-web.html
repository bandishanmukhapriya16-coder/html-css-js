<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            text-align: center;
            padding: 15px;
            background-color: #eee;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
            color: #333;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .item {
            width: 220px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .price {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .item {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Food Paradise</h1>
        <p>Delicious food, happy moments!</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <h2 style="text-align:center;">Our Menu</h2>

    <section class="menu">

        <div class="item">
            <h3>Pizza</h3>
            <p>Cheesy vegetable pizza</p>
            <p class="price">₹250</p>
        </div>

        <div class="item">
            <h3>Burger</h3>
            <p>Fresh vegetable burger</p>
            <p class="price">₹150</p>
        </div>

        <div class="item">
            <h3>Pasta</h3>
            <p>Creamy pasta</p>
            <p class="price">₹200</p>
        </div>

    </section>

</body>

        <a href="../index.html">← Back to Main Index</a>
</html>
