<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
        }

        nav a:hover {
            background-color: #3498db;
            border-radius: 5px;
        }

        .content {
            text-align: center;
            padding: 50px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            nav a {
                width: 80%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h1>Responsive Navigation Menu</h1>
        <p>Resize the browser window to see the responsive effect.</p>
    </div>

</body>

</html>
