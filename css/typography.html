<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 8vw;
            text-align: center;
        }

        h2 {
            font-size: 5vw;
        }

        p {
            font-size: 3vw;
            line-height: 1.6;
        }

        @media (min-width: 800px) {
            h1 {
                font-size: 60px;
            }

            h2 {
                font-size: 35px;
            }

            p {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Typography</h1>

    <h2>About CSS</h2>

    <p>
        Responsive typography changes the size of text
        according to the screen size.
    </p>

</body>
