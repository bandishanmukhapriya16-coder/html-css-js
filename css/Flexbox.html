<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Flexbox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

            background-color: white;
            padding: 30px;
            margin: 30px auto;
            max-width: 900px;
            border-radius: 10px;
        }

        .box {
            width: 180px;
            height: 120px;
            background-color: #3498db;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .box:nth-child(2) {
            background-color: #2ecc71;
        }

        .box:nth-child(3) {
            background-color: #e67e22;
        }

        .box:nth-child(4) {
            background-color: #9b59b6;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox Layout</h1>

    <div class="flex-container">

        <div class="box">HTML</div>

        <div class="box">CSS</div>

        <div class="box">JavaScript</div>

        <div class="box">Python</div>

    </div>

</body>
