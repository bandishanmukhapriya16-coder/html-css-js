<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Shapes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        .square {
            width: 150px;
            height: 150px;
            background-color: #3498db;
            margin: 30px auto;
            border-radius: 10px;
        }

        .rounded {
            width: 250px;
            height: 120px;
            background-color: #2ecc71;
            margin: 30px auto;
            border-radius: 30px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background-color: #e67e22;
            margin: 30px auto;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <h1>CSS Border Radius</h1>

    <h2>Rounded Square</h2>
    <div class="square"></div>

    <h2>Rounded Rectangle</h2>
    <div class="rounded"></div>

    <h2>Circle</h2>
    <div class="circle"></div>

</body>
