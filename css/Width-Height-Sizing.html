<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Width Height and Sizing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .box1 {
            width: 300px;
            height: 100px;
            background-color: #d6eaf8;
            border: 3px solid #3498db;
            padding: 20px;
            margin: 20px auto;
        }

        .box2 {
            width: 50%;
            height: 120px;
            background-color: #d5f5e3;
            border: 3px solid #27ae60;
            padding: 20px;
            margin: 20px auto;
        }

        .box3 {
            width: 80%;
            min-height: 100px;
            max-width: 600px;
            background-color: #fdebd0;
            border: 3px solid #e67e22;
            padding: 20px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Width, Height and Sizing</h1>

        <div class="box1">
            <strong>Box 1</strong>
            <p>Width: 300px | Height: 100px</p>
        </div>

        <div class="box2">
            <strong>Box 2</strong>
            <p>Width: 50% | Height: 120px</p>
        </div>

        <div class="box3">
            <strong>Box 3</strong>
            <p>
                Width: 80%, minimum height: 100px,
                maximum width: 600px.
            </p>
        </div>

    </div>

</body>

</html>
