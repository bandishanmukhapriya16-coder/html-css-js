<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar p {
            padding: 10px;
        }

        .main {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ccc;
        }

        .card h2 {
            color: #3498db;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Dashboard</h2>
            <p>Home</p>
            <p>Students</p>
            <p>Courses</p>
            <p>Reports</p>
        </aside>

        <main class="main">

            <h1>Student Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h2>Students</h2>
                    <p>250</p>
                </div>

                <div class="card">
                    <h2>Courses</h2>
                    <p>12</p>
                </div>

                <div class="card">
                    <h2>Projects</h2>
                    <p>45</p>
                </div>

            </div>

        </main>


    </div>

</body>

</html>
