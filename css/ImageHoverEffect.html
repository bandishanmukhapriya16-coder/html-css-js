<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        .image-container {
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            overflow: hidden;
            border-radius: 10px;
        }

        .image-container img {
            width: 100%;
            display: block;
            transition: transform 0.5s;
        }

        .image-container img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>CSS Image Hover Effect</h1>

    <div class="image-container">

        <img src="../assets/images/college.jpg"
             alt="College Image">

    </div>

    <p>
        Move the mouse over the image to see the zoom effect.
    </p>

</body>
