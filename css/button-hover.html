<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Animation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2c3e50;
        }

        .button {
            margin-top: 50px;
            padding: 15px 35px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;

            transition: transform 0.3s, box-shadow 0.3s;
        }

        .button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px #999;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button class="button">
        Hover Me
    </button>

</body>
