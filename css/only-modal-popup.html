<!DOCTYPE html>
<html>
<head>
    <title>CSS Only Modal Popup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #333;
            color: white;
            text-decoration: none;
            margin-top: 100px;
        }

        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal:target {
            display: block;
        }

        .content {
            background-color: white;
            width: 300px;
            padding: 30px;
            margin: 150px auto;
            border-radius: 10px;
        }

        .close {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>CSS Only Modal Popup</h1>

    <a href="#popup" class="button">Open Popup</a>

    <div id="popup" class="modal">

        <div class="content">
            <h2>Hello!</h2>
            <p>This is a CSS-only modal popup.</p>

            <a href="#" class="close">Close</a>
        </div>

    </div>

</body>

</html>
