<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .blur {
            filter: blur(3px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(150%);
        }
    </style>
</head>

<body>

    <h1>CSS Image Filters</h1>

    <div class="gallery">

        <div>
            <h3>Normal</h3>
            <img src="../assets/images/college.jpg" alt="College">
        </div>

        <div>
            <h3>Blur</h3>
            <img class="blur" src="../assets/images/college.jpg" alt="College">
        </div>

        <div>
            <h3>Grayscale</h3>
            <img class="grayscale" src="../assets/images/college.jpg" alt="College">
        </div>

        <div>
            <h3>Brightness</h3>
            <img class="brightness" src="../assets/images/college.jpg" alt="College">
        </div>

        <div>
            <h3>Contrast</h3>
            <img class="contrast" src="../assets/images/college.jpg" alt="College">
        </div>

    </div>

</body>
