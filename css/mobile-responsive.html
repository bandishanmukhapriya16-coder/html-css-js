<!DOCTYPE html>
<html>
<head>
    <title>Mobile First Responsive Design</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            padding: 15px;
        }

        .card {
            width: 100%;
            padding: 25px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background-color: #eee;
            text-align: center;
        }

        @media (min-width: 600px) {
            .container {
                display: flex;
                gap: 20px;
            }

            .card {
                flex: 1;
            }
        }

        @media (min-width: 900px) {
            .container {
                max-width: 1000px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Mobile First Website</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Structure of webpages.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Styling of webpages.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Interactivity of webpages.</p>
        </div>

    </div>

</body>
