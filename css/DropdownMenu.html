<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dropdown Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
        }

        nav {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        .dropdown {
            display: inline-block;
            position: relative;
        }

        .dropdown-button {
            color: white;
            padding: 15px 20px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 4px 8px #999;
            text-align: left;
        }

        .dropdown-content a {
            display: block;
            color: #333;
            padding: 12px;
        }

        .dropdown-content a:hover {
            background-color: #eee;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .content {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>

        <div class="dropdown">

            <span class="dropdown-button">Courses ▼</span>

            <div class="dropdown-content">
                <a href="#">CSE</a>
                <a href="#">AI & DS</a>
                <a href="#">Cyber Security</a>
            </div>

        </div>

        <a href="#">About</a>
        <a href="#">Contact</a>

    </nav>

    <div class="content">
        <h1>CSS Dropdown Menu</h1>
        <p>Move the mouse over "Courses" to see the dropdown.</p>
    </div>

</body>

</html>
