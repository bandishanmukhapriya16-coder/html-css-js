<!DOCTYPE html>
<html>
<head>
    <title>Responsive Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        .contact {
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .contact {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="contact">

        <h1>Contact Us</h1>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Message</label>
            <textarea placeholder="Enter your message"></textarea>

            <button type="submit">Send Message</button>
        </form>

    </div>

</body>
