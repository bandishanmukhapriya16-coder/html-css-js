<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        .box {
            width: 250px;
            padding: 30px;
            margin: 20px auto;
            color: white;
            font-size: 20px;
            border-radius: 10px;
        }

        .full {
            background-color: #3498db;
            opacity: 1;
        }

        .medium {
            background-color: #3498db;
            opacity: 0.6;
        }

        .low {
            background-color: #3498db;
            opacity: 0.3;
        }

        .transparent {
            background-color: rgba(52, 152, 219, 0.4);
            color: #222;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="box full">
        Opacity: 1
    </div>

    <div class="box medium">
        Opacity: 0.6
    </div>

    <div class="box low">
        Opacity: 0.3
    </div>

    <div class="box transparent">
        Transparent Background
    </div>

</body>
