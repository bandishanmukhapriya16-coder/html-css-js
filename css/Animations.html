<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2c3e50;
        }

        .box {
            width: 120px;
            height: 120px;
            background-color: #3498db;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 80px auto;
            border-radius: 10px;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {
            from {
                transform: translateX(-150px);
            }

            to {
                transform: translateX(150px);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box">
        Moving
    </div>

</body>
