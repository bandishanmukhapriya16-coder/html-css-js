<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2c3e50;
            text-shadow: 2px 2px 4px #aaa;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;

            box-shadow: 5px 5px 15px #999;
        }

        .card h2 {
            color: #3498db;
        }

        .card p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>CSS Shadows</h1>

    <div class="card">
        <h2>Box Shadow</h2>
        <p>
            This card uses the CSS box-shadow property.
        </p>
    </div>

</body>
