<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Flexbox</title>

   <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffeaa7, #dfe6e9, #a29bfe);
        margin: 0;
        padding: 30px;
        min-height: 100vh;
    }

    h1 {
        text-align: center;
        color: white;
        background: linear-gradient(135deg, #6c5ce7, #0984e3);
        padding: 20px;
        border-radius: 18px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .container {
        display: flex;
        gap: 25px;
        max-width: 1000px;
        margin: 30px auto;
    }

    .column {
        flex: 1;
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        border-top: 6px solid #fd79a8;
        transition: 0.3s;
    }

    .column:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .column h2 {
        color: #6c5ce7;
        margin-bottom: 15px;
    }

    .column p {
        color: #555;
        line-height: 1.6;
    }

    @media (max-width: 700px) {
        .container {
            flex-direction: column;
        }

        body {
            padding: 15px;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>
</head>

<body>

    <h1>Three Column Flexbox Layout</h1>

    <div class="container">

        <div class="column">
            <h2>HTML</h2>
            <p>Structure</p>
        </div>

        <div class="column">
            <h2>CSS</h2>
            <p>Styling</p>
        </div>

        <div class="column">
            <h2>JavaScript</h2>
            <p>Functionality</p>
        </div>

    </div>

</body>
