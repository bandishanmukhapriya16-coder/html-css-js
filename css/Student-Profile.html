        .profile {
            max-width: 600px;

            padding: 30px;

            border-radius: 15px;

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

</head>
