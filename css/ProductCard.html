<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 50px;
        }

        .product-card {
            width: 300px;
            margin: auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        h2 {
            color: #2c3e50;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #e67e22;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <img src="../assets/images/smartwatch.jpg" alt="Product Image">

        <div class="product-info">

            <h2>Smart Watch</h2>

            <p>Modern smartwatch with useful features.</p>

            <p class="price">₹1,999</p>

            <button>Add to Cart</button>

        </div>

    </div>

</body>
