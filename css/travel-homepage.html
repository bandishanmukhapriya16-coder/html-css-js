<!DOCTYPE html>
<html>
<head>
    <title>Travel Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .destinations {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .place {
            width: 250px;
            padding: 30px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #333;
            color: white;
        }

        @media (max-width: 600px) {
            .place {
                width: 90%;
            }

            header {
                padding: 40px 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Explore the World</h1>
        <p>Discover beautiful destinations</p>
        <button>Explore Now</button>
    </header>

    <h2 style="text-align:center;">Popular Destinations</h2>

    <section class="destinations">

        <div class="place">
            <h3>Goa</h3>
            <p>Beautiful beaches and relaxing views.</p>
        </div>

        <div class="place">
            <h3>Manali</h3>
            <p>Mountains, nature and adventure.</p>
        </div>

        <div class="place">
            <h3>Jaipur</h3>
            <p>Explore historical places and culture.</p>
        </div>

    </section>

</body>

</html>
