<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Media Queries</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6fb;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 30px;
        }

        .box {
            width: 250px;
            padding: 40px;
            background-color: #3498db;
            color: white;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .box {
                width: 80%;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Webpage</h1>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Style of webpage</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Functionality of webpage</p>
        </div>

    </div>

</body>

</html>
