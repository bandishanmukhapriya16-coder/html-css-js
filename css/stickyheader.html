<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
        }

        header {
            position: sticky;
            top: 0;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        nav {
            background-color: #34495e;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .content {
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .section {
            background-color: white;
            margin: 20px 0;
            padding: 30px;
            border-radius: 10px;
            min-height: 250px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">

        <div class="section">
            <h2>Section 1</h2>
            <p>Scroll down to see the sticky header.</p>
        </div>

        <div class="section">
            <h2>Section 2</h2>
            <p>The header remains at the top.</p>
        </div>

        <div class="section">
            <h2>Section 3</h2>
            <p>This demonstrates position: sticky.</p>
        </div>

        <div class="section">
            <h2>Section 4</h2>
            <p>Continue scrolling to test the header.</p>
        </div>

    </div>

</body>

</html>
