<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
        }

        .container {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 40px auto;
            background-color: white;
            border: 2px solid #ccc;
        }

        .box1 {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: #3498db;
            left: 80px;
            top: 70px;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        .box2 {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: #e67e22;
            left: 180px;
            top: 120px;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS Z-Index</h1>

    <div class="container">

        <div class="box1">
            Box 1<br>
            Z-index: 1
        </div>

        <div class="box2">
            Box 2<br>
            Z-index: 2
        </div>

    </div>

</body>
