<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #2c3e50;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-top: 50px;
        }

        .button {
            background-color: #3498db;
            color: white;
            padding: 15px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tooltip-text {
            visibility: hidden;
            width: 180px;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;

            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
        }
    </style>
</head>

<body>

    <h1>CSS Tooltip</h1>

    <div class="tooltip">

        <div class="button">
            Hover Me
        </div>

        <div class="tooltip-text">
            This is a tooltip message.
        </div>

    </div>

</body>
